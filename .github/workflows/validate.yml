name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Observe the C5 setup prerequisite
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set +e
          sudo /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-launcher
          provision_status=$?
          printf 'C5 launcher provision exit: %s\n' "$provision_status"
          if [ "$provision_status" -ne 0 ]; then
            exit "$provision_status"
          fi
          sudo /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py
          setup_status=$?
          printf 'C5 setup observation instrument exit: %s\n' "$setup_status"
          exit "$setup_status"

      - name: Provision the scoped hosted bwrap AppArmor prerequisite
        timeout-minutes: 1
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-bwrap-policy

      - name: Receive the C5 current input prerequisites
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: sudo /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --receive-hosted-prerequisites "$GITHUB_SHA"

      - name: Observe the ordinary continuity transport prerequisite
        if: always()
        timeout-minutes: 1
        run: |
          /usr/bin/python3.12 -I -S -B -c 'import runpy; probe=runpy.run_path("tests/work-graph-continuity-cases.py"); probe["require_host"]()' --require-supported-host

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install --disable-pip-version-check --no-deps --requirement requirements-release.txt
          rg --version

      - name: Validate whitespace
        run: git diff --check HEAD^ HEAD

      - name: Validate package-owner JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool package/implementaudit-package.json >/dev/null

      - name: Verify package contract
        run: bash scripts/verify-package.sh

      - name: Observe retained job-owned bwrap AppArmor prerequisite
        if: always()
        timeout-minutes: 1
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --finalize-hosted-bwrap-policy
