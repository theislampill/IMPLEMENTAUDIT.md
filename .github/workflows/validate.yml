name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install --disable-pip-version-check --no-deps --requirement requirements-release.txt
          rg --version

      - name: Validate whitespace
        run: git diff --check HEAD^ HEAD

      - name: Validate package-owner JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/plugin.json >/dev/null
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool package/implementaudit-package.json >/dev/null

      - name: Verify package contract
        run: bash scripts/verify-package.sh
