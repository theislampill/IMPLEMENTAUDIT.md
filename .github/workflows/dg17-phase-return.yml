name: Original DG17 phase returns

on:
  push:
    branches:
      - pro/dg17-phase-return-2-20261117
    paths-ignore:
      - handoff/dg17-phase-return/mailbox/**

permissions:
  contents: read

jobs:
  greeting-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DG17_SCRIPT: handoff/dg17-phase-return/hosted_phase.py
      DG17_REQUEST: handoff/dg17-phase-return/request.json
    steps:
      - name: Bind evidence directory on the runner
        run: printf 'DG17_OUTPUT=%s/dg17-phase-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Observe actual planning authority before dispatch
        id: prepare
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" prepare --request "$DG17_REQUEST" --output "$DG17_OUTPUT"
      - name: Expose actual planning observation
        if: steps.prepare.outputs.stage == 'planning'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-planning
          path: ${{ env.DG17_OUTPUT }}/planning/
          if-no-files-found: error
          retention-days: 7
      - name: Receive actual Root plan correction decision
        id: plan
        if: steps.prepare.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" plan --output "$DG17_OUTPUT"
      - name: Expose actual plan-corrected observation
        if: steps.plan.outputs.stage == 'plan-corrected'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-plan-corrected
          path: ${{ env.DG17_OUTPUT }}/plan-corrected/
          if-no-files-found: error
          retention-days: 7
      - name: Receive actual post-check L1 return and dispatch decision
        id: dispatch
        if: steps.plan.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" dispatch --output "$DG17_OUTPUT"
      - name: Expose actual regression observation
        if: steps.dispatch.outputs.stage == 'regression'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-regression
          path: ${{ env.DG17_OUTPUT }}/regression/
          if-no-files-found: error
          retention-days: 7
      - name: Receive Root regression decision and execute the bounded repair
        id: phase
        if: steps.dispatch.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" phase --output "$DG17_OUTPUT"
      - name: Expose actual phase-repaired observation
        if: steps.phase.outputs.stage == 'phase-repaired'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-phase-repaired
          path: ${{ env.DG17_OUTPUT }}/phase-repaired/
          if-no-files-found: error
          retention-days: 7
      - name: Receive Root phase completion decision and run exact final audit
        id: audit
        if: steps.phase.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" audit --output "$DG17_OUTPUT"
      - name: Expose actual audit-gap observation
        if: steps.audit.outputs.stage == 'audit-gap'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-audit-gap
          path: ${{ env.DG17_OUTPUT }}/audit-gap/
          if-no-files-found: error
          retention-days: 7
      - name: Receive Root final-gap decision and execute the bounded audit fix
        id: fix
        if: steps.audit.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" fix --output "$DG17_OUTPUT"
      - name: Expose actual final-repaired observation
        if: steps.fix.outputs.stage == 'final-repaired'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-final-repaired
          path: ${{ env.DG17_OUTPUT }}/final-repaired/
          if-no-files-found: error
          retention-days: 7
      - name: Receive Root and independent review then run exact re-audit
        id: reaudit
        if: steps.fix.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" reaudit --output "$DG17_OUTPUT"
      - name: Expose actual reaudited observation
        if: steps.reaudit.outputs.stage == 'reaudited'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-reaudited
          path: ${{ env.DG17_OUTPUT }}/reaudited/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve terminal custody and remove only owned scratch
        if: always()
        run: /usr/bin/python3 -I -B "$DG17_SCRIPT" finalize --output "$DG17_OUTPUT"
      - name: Retain complete actual phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg17-phase-complete-evidence
          path: ${{ env.DG17_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7
