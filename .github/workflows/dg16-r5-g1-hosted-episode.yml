{
  "name": "R5 current original G1 and scoped two-stage G3",
  "on": {
    "push": {
      "branches": [
        "pro/dg16-g132-original-20261125-01"
      ],
      "paths": [
        ".github/workflows/dg16-r5-g1-hosted-episode.yml",
        "qualification/dg16-r5-g1-hosted-episode/**",
        "qualification/dg16-r5-g1-hosted-entry/**"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "dg16-r5-g1-final-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "qualify": {
      "if": "github.repository == 'theislampill/IMPLEMENTAUDIT.md' && github.event_name == 'push' && github.ref == 'refs/heads/pro/dg16-g132-original-20261125-01' && github.event.deleted == false && github.run_attempt == '1'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 75,
      "steps": [
        {
          "name": "Check out exact reviewed composition",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "packet",
            "fetch-depth": 1,
            "persist-credentials": false,
            "set-safe-directory": false,
            "submodules": false,
            "lfs": false
          }
        },
        {
          "name": "Create exclusive fixed root island and exact packet",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/bootstrap_entry.py\"\n"
        },
        {
          "name": "Provision original pinned git program tree",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /usr/bin/bash -s <<'DG16_PROVISION_GIT'\nset -euo pipefail\numask 022\n# Exact git 2.56.0 program tree (usr/bin/git and the whole usr/lib/git-core) from one digest-bound package.\n# bwrap is deliberately NOT provisioned here: the core's qualified --provision-hosted-launcher owns that path.\nURL='https://snapshot.ppa.launchpadcontent.net/git-core/ppa/ubuntu/20261101T000000Z/pool/main/g/git/git_2.56.0-0ppa1~ubuntu24.04.2_amd64.deb'\nPKG_BYTES=7773244\nPKG_SHA256=8681013502ef3b3ab4131c94e43ca89dd133934d0f5dc143cd456a7896b0ba81\nGIT_BYTES=4640352\nGIT_SHA256=824d5b2fffef332ec7ba053e579659bb12f26a0b4747da6f9c6dc0e71d36f235\nTREE_SHA256=fa83107dc7b2465aed4fef67808b0cb70ed2c09c74148cdd78c9ba1838965db3\n# One line per path: \"<path> <sha256> <octal st_mode>\"; sha256 of the content (regular file), of the link\n# target text (symlink) or of the empty string (directory); LC_ALL=C sorted; digest = sha256 of all lines.\nmanifest() {\n  (cd \"$1\" && /usr/bin/find usr/bin/git usr/lib/git-core -print0 | LC_ALL=C /usr/bin/sort -z |\n    while IFS= read -r -d '' p; do\n      if [ -L \"$p\" ]; then h=\"$(/usr/bin/readlink -n -- \"$p\" | /usr/bin/sha256sum)\"\n      elif [ -f \"$p\" ]; then h=\"$(/usr/bin/sha256sum < \"$p\")\"\n      elif [ -d \"$p\" ]; then h=\"$(printf '' | /usr/bin/sha256sum)\"\n      else printf 'UNEXPECTED_TREE_MEMBER %s\\n' \"$p\" >&2; exit 1\n      fi\n      printf '%s %s %o\\n' \"$p\" \"${h%% *}\" \"0x$(/usr/bin/stat -c %f -- \"$p\")\"\n    done)\n}\ndigest() { printf '%s\\n' \"$1\" | /usr/bin/sha256sum | /usr/bin/cut -c1-64; }\ntest \"$(/usr/bin/id -u)\" = 0\nwork=\"$(/usr/bin/mktemp -d)\"\ntrap '/usr/bin/rm -rf -- \"$work\"' EXIT\ntest \"$(/usr/bin/stat -c '%u %a' -- \"$work\")\" = \"$(/usr/bin/id -u) 700\"\npkg=\"$work/git.deb\"\n/usr/bin/curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 5 \\\n  --max-filesize \"$PKG_BYTES\" --connect-timeout 20 --max-time 300 --retry 4 --retry-all-errors --retry-delay 3 \\\n  --output \"$pkg\" \"$URL\"\ntest \"$(/usr/bin/stat -c %s -- \"$pkg\")\" = \"$PKG_BYTES\"\nprintf '%s  %s\\n' \"$PKG_SHA256\" \"$pkg\" | /usr/bin/sha256sum --check --strict --quiet\ntest \"$(/usr/bin/dpkg-deb --field \"$pkg\" Package Version Architecture)\" = \"$(printf 'Package: git\\nVersion: 1:2.56.0-0ppa1~ubuntu24.04.2\\nArchitecture: amd64')\"\nstage=\"$work/stage\"\n/usr/bin/mkdir -m 0755 -- \"$stage\"\n/usr/bin/dpkg-deb --fsys-tarfile \"$pkg\" | /usr/bin/tar --extract --preserve-permissions --directory \"$stage\" ./usr/bin/git ./usr/lib/git-core\ntest \"$(/usr/bin/stat -c %s -- \"$stage/usr/bin/git\")\" = \"$GIT_BYTES\"\nprintf '%s  %s\\n' \"$GIT_SHA256\" \"$stage/usr/bin/git\" | /usr/bin/sha256sum --check --strict --quiet\nstaged=\"$(manifest \"$stage\")\"\nprintf 'staged git tree %s (%s entries)\\n' \"$(digest \"$staged\")\" \"$(printf '%s\\n' \"$staged\" | /usr/bin/wc -l)\"\ntest \"$(digest \"$staged\")\" = \"$TREE_SHA256\"\ntest -z \"$(/usr/bin/find \"$stage/usr\" \\( ! -user 0 -o ! -group 0 \\) -print)\"\ntest -z \"$(/usr/bin/find \"$stage/usr/bin/git\" \"$stage/usr/lib/git-core\" ! -type l -perm /6022 -print)\"\nprintf 'image git tree before provisioning %s\\n' \"$(digest \"$(manifest /)\")\"\n/usr/bin/cp -a -- \"$stage/usr/lib/git-core\" /usr/lib/git-core.dg16-new\n/usr/bin/install -o root -g root -m 0755 -- \"$stage/usr/bin/git\" /usr/bin/git.dg16-new\n/usr/bin/mv -T -- /usr/lib/git-core \"$work/image-git-core\"\n/usr/bin/mv -T -- /usr/lib/git-core.dg16-new /usr/lib/git-core\n/usr/bin/mv -f -T -- /usr/bin/git.dg16-new /usr/bin/git\nlive=\"$(manifest /)\"\ntest \"$live\" = \"$staged\"\ntest \"$(digest \"$live\")\" = \"$TREE_SHA256\"\ntest -z \"$(/usr/bin/find /usr/bin/git /usr/lib/git-core \\( ! -user 0 -o ! -group 0 \\) -print)\"\ntest -z \"$(/usr/bin/find /usr/bin/git /usr/lib/git-core ! -type l -perm /6022 -print)\"\nprintf '%s  %s\\n' \"$GIT_SHA256\" /usr/bin/git | /usr/bin/sha256sum --check --strict\n/usr/bin/stat -c '%a %U %G %s %h %n' /usr/bin/git /usr/lib/git-core /usr/lib/git-core/git\nprintf 'provisioned git tree %s\\n' \"$TREE_SHA256\"\nDG16_PROVISION_GIT\n"
        },
        {
          "name": "Observe host tools",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/host_tool_observe_entry.py\" | sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/public_export.py\" tools\n"
        },
        {
          "name": "Retain actual host tool observation",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "dg16-core-host-tools-${{ github.run_id }}-a1",
            "if-no-files-found": "error",
            "retention-days": 3,
            "compression-level": 9,
            "path": "${{ runner.temp }}/dg16-g1-public-${{ github.run_id }}-a1/tools/HOST_TOOL_OBSERVATION.json"
          }
        },
        {
          "name": "Receive separate actual root tool adoption",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  DG16_CARRIER_READ_TOKEN=\"$DG16_CARRIER_READ_TOKEN\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/host_tool_adopt_entry.py\"\n",
          "env": {
            "DG16_CARRIER_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Create fresh recipient request",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  DG16_CARRIER_READ_TOKEN=\"$DG16_CARRIER_READ_TOKEN\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/host_request_entry.py\" | sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/public_export.py\" recipient\n",
          "env": {
            "DG16_CARRIER_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Retain fresh recipient request",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "dg16-core-private-recipient-${{ github.run_id }}-a1",
            "if-no-files-found": "error",
            "retention-days": 3,
            "compression-level": 9,
            "path": "${{ runner.temp }}/dg16-g1-public-${{ github.run_id }}-a1/recipient/REQUEST.json\n${{ runner.temp }}/dg16-g1-public-${{ github.run_id }}-a1/recipient/RECIPIENT.pem"
          }
        },
        {
          "name": "Receive authenticated private inputs after actual root sender/control",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  DG16_CARRIER_READ_TOKEN=\"$DG16_CARRIER_READ_TOKEN\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/host_receive_entry.py\"\n",
          "env": {
            "DG16_CARRIER_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Require private readiness and prepare original core",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  DG16_CARRIER_READ_TOKEN=\"$DG16_CARRIER_READ_TOKEN\" \\\n  /usr/bin/python3.12 -I -S -B \"$GITHUB_WORKSPACE/packet/qualification/dg16-r5-g1-hosted-entry/core_prepare_entry.py\"\n",
          "env": {
            "DG16_CARRIER_READ_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Core initialize",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"/dg16-g1-$GITHUB_RUN_ID/packet/run.py\" --step initialize --source \"/dg16-g1-$GITHUB_RUN_ID/source\" --output \"/dg16-g1-$GITHUB_RUN_ID/output\"\n"
        },
        {
          "name": "Core discover",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"/dg16-g1-$GITHUB_RUN_ID/packet/run.py\" --step discover --source \"/dg16-g1-$GITHUB_RUN_ID/source\" --output \"/dg16-g1-$GITHUB_RUN_ID/output\"\n"
        },
        {
          "name": "Core invalidate",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$GITHUB_RUN_ATTEMPT\" = 1\nsudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" \\\n  GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" \\\n  GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" \\\n  GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" \\\n  GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" \\\n  RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" \\\n  ImageVersion=\"$ImageVersion\" \\\n  /usr/bin/python3.12 -I -S -B \"/dg16-g1-$GITHUB_RUN_ID/packet/run.py\" --step invalidate --source \"/dg16-g1-$GITHUB_RUN_ID/source\" --output \"/dg16-g1-$GITHUB_RUN_ID/output\"\n"
        },
        {
