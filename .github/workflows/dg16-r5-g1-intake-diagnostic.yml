      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dg16-g1-intake-diagnostic-${{ github.run_id }}-1
        if-no-files-found: error
        retention-days: 3
        compression-level: 9
        path: '${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/RESULT.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/HOST.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/SOURCE.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/DIAGNOSTIC.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/CURRENTNESS.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/NSS.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/CLEANUP.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/FAILURE.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public/ARTIFACT_MANIFEST.json

          '
    - name: Observe validated fallback eligibility
      id: fallback_public
      if: always()
      shell: bash
      run: "set -euo pipefail\nmarker=\"$RUNNER_TEMP/dg16-g1-intake-diagnostic-$GITHUB_RUN_ID-1/FAILURE_ELIGIBLE\"\nif test -f \"$marker\" &&\
        \ test \"$(cat \"$marker\")\" = true; then\n  echo 'eligible=true' >> \"$GITHUB_OUTPUT\"\nelse\n  echo 'eligible=false' >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: Retain only validated fallback files
      if: always() && steps.fallback_public.outputs.eligible == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dg16-g1-intake-fallback-${{ github.run_id }}-1
        if-no-files-found: error
        retention-days: 3
        compression-level: 9
        path: '${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public-failure/RETENTION_FAILURE.json

          ${{ runner.temp }}/dg16-g1-intake-diagnostic-${{ github.run_id }}-1/public-failure/ARTIFACT_MANIFEST.json

          '
