name: DG16 fixed public metadata categories
on:
  push:
    branches: [pro/dg16-public-xattr-categories-01-20261110]
    paths: [.github/workflows/dg16-public-xattr-categories.yml]
permissions:
  contents: read
jobs:
  fixed-public-categories:
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Read fixed categories on five public prefixes once
        shell: bash
        run: |
          set -euo pipefail
          test "$ImageOS" = ubuntu24
          test "$ImageVersion" = 20261101.360.1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 19c222a2db624de15b77415481f34f3d7a4475a7
          test "$(sha256sum qualification/dg16-public-prefix-categories/observe.py | cut -d' ' -f1)" = 10ba292edbff5d42ce2d02d9c5847ccd5ad9bdc7713b941582bcb764d82049b1
          umask 077
          set +e
          sudo /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /usr/bin/python3.12 -I -S -B qualification/dg16-public-prefix-categories/observe.py > "$RUNNER_TEMP/dg16-fixed-categories.json"
          code=$?
          set -e
          /usr/bin/python3.12 -I -B - "$RUNNER_TEMP/dg16-fixed-categories.json" "$code" <<'PY'
          import json,os,sys,hashlib
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes(); assert 0<len(raw)<=16384
          v=json.loads(raw);assert v['schema']=='dg16.fixed-public-prefix-xattr-categories.v1' and not v['effect_grant'] and not v['original_awards']
          assert v['status'] in ('OBSERVED_FIXED_CATEGORIES','INCOMPLETE','REFUSED_TIMEOUT','REFUSED_BOUND_OR_SHAPE','REFUSED_PRECONDITION')
          print('DG16_FIXED_PUBLIC_CATEGORIES '+json.dumps(dict(run=os.environ['GITHUB_RUN_ID'],attempt=os.environ['GITHUB_RUN_ATTEMPT'],head=os.environ['GITHUB_SHA'],image=os.environ['ImageVersion'],uid_profile='source-enforced 0/0/0/0',exit=int(sys.argv[2]),observation=v,output_sha256=hashlib.sha256(raw).hexdigest()),sort_keys=True))
          raise SystemExit(int(sys.argv[2]))
          PY
