name: DG18 A4 separate native compiler memory successor R3

on:
  push:
    branches: [pro/dg18-a4-compiler-memory-51416-20261122-03]
    paths:
      - .github/workflows/dg18-a4-compiler-memory-r3.yml
      - handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3/compile_memory.py
      - handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3/compile_adapter.py
      - handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3/observed_tool_profile.py
      - handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3/conhost_custody.py

permissions:
  contents: read

concurrency:
  group: dg18-a4-compiler-memory-51416-20261122-03
  cancel-in-progress: false

jobs:
  compile-only-native-diagnostic:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg18-a4-compiler-memory-51416-20261122-03' &&
      github.run_attempt == '1' &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.created == true &&
      github.event.deleted == false
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Check out exact additive diagnostic without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Check out exact unchanged product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 51416b2f156b341c4a5f09029e2c6ceb5b30b1e7
          path: qualified-source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Select exact retained Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Run three bounded compile-only diagnostic workers once
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:GITHUB_WORKSPACE 'packet/handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3'
          $helper = Join-Path $folder 'compile_memory.py'
          $adapter = Join-Path $folder 'compile_adapter.py'
          $profile = Join-Path $folder 'observed_tool_profile.py'
          $conhostSource = Join-Path $folder 'conhost_custody.py'
          if ((Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant() -ne '34506ab7513c70bb32f595182a29b372cc3889e98ee6793f0edd30ef5b791ebc') { throw 'Reviewed diagnostic helper differs' }
          if ((Get-FileHash -LiteralPath $adapter -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4baffb9fdadde5333a1bf535593d4aa794936578be297b1ce723e1f0bd1683b2') { throw 'Exact R2 adapter differs' }
          if ((Get-FileHash -LiteralPath $profile -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'aa61123993614898f8d731352d04862a5a8fe9b77d1811f640e40870e8bf09b5') { throw 'Exact observed native profile helper differs' }
          if ((Get-FileHash -LiteralPath $conhostSource -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3f6f724f87fa2b09d081ba4ce3ed3c8600cebf39de6443b2958eee8c1a8aa67d') { throw 'Reviewed console-host custody differs' }
          $physicalPython = 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
          & $physicalPython -I -B $helper --step execute --source (Join-Path $env:GITHUB_WORKSPACE 'qualified-source') --output (Join-Path $env:RUNNER_TEMP "dg18-a4-compiler-memory-r3-$env:GITHUB_RUN_ID-1")
          if ($LASTEXITCODE -ne 0) { throw "Bounded diagnostic failed with exit $LASTEXITCODE" }

      - name: Seal exact retained diagnostic without replay
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'packet/handoff/pro-executor-results-20261115/dg18-a4-compiler-memory-r3/compile_memory.py'
          if ((Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant() -ne '34506ab7513c70bb32f595182a29b372cc3889e98ee6793f0edd30ef5b791ebc') { throw 'Reviewed diagnostic helper differs before sealing' }
          $physicalPython = 'C:\hostedtoolcache\windows\Python\3.12.10\x64\python.exe'
          & $physicalPython -I -B $helper --step finalize --source (Join-Path $env:GITHUB_WORKSPACE 'qualified-source') --output (Join-Path $env:RUNNER_TEMP "dg18-a4-compiler-memory-r3-$env:GITHUB_RUN_ID-1")
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic sealing failed with exit $LASTEXITCODE" }

      - name: Retain raw native measurements and complete cleanup records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg18-a4-compiler-memory-r3-${{ github.run_id }}-1
          path: |
            ${{ runner.temp }}/dg18-a4-compiler-memory-r3-${{ github.run_id }}-1/DIAGNOSTIC.zip
            ${{ runner.temp }}/dg18-a4-compiler-memory-r3-${{ github.run_id }}-1/ZIP_RECEIPT.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
