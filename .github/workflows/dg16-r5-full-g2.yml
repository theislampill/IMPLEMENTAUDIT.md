      - name: Execute the complete current registry legacy then DAG once
        id: pair
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg16-r5-full-g2/run.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != 'f8185cdfe55669677b9172d0de34bcce64b2888ce386c8b889a544d0894fbfae' ]]; then
            echo 'DG16_FULL_REGISTRY {"status":"UNQUALIFIED","code":"ADAPTER_DIGEST_REFUSED"}'
