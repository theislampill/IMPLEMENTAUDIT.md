            --source "$GITHUB_WORKSPACE/qualified-source" \
            --output "$RUNNER_TEMP/dg16-full-g2-episode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Independently re-read actual sealed captures in the live job
        id: receive
        if: always() && steps.require.outcome == 'success' && steps.pair.outcome != 'skipped' && steps.pair.outcome != 'cancelled'
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg16-r5-full-g2/run.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != 'f8185cdfe55669677b9172d0de34bcce64b2888ce386c8b889a544d0894fbfae' ]]; then
