name: R5 full current registry raw pair and same-job receiving

on:
  push:
    branches:
      - pro/dg16-r5-full-g2-02-20261105
    paths:
      - .github/workflows/dg16-r5-full-g2.yml
      - qualification/dg16-r5-full-g2/run.py
      - qualification/dg16-r5-full-g2/pair_driver.py
      - qualification/dg16-r5-full-g2/host_utility.py
      - qualification/dg16-r5-full-g2/SOURCE_MANIFEST.json
      - qualification/dg16-r5-full-g2/EARNED_PREREQUISITE.json

permissions:
  contents: read

concurrency:
  group: dg16-r5-full-g2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-registry-raw-pair:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg16-r5-full-g2-02-20261105' &&
      github.event.deleted == false && github.run_attempt == '1'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Check out the exact reviewed packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Check out the exact published capture source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35bf9823856eb4efe254b882954120480632230e
          path: qualified-source
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Provision the ordinary release dependency and verifier tools
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg16-r5-full-g2/run.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != 'f8185cdfe55669677b9172d0de34bcce64b2888ce386c8b889a544d0894fbfae' ]]; then
            echo 'DG16_FULL_REGISTRY {"status":"UNQUALIFIED","code":"ADAPTER_DIGEST_REFUSED"}'
            exit 1
          fi
          /usr/bin/python3 -I -S -B "$adapter" --step provision \
            --source "$GITHUB_WORKSPACE/qualified-source" \
            --output "$RUNNER_TEMP/dg16-full-g2-episode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Bind exact source and earned native prerequisite host facts
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg16-r5-full-g2/run.py"
