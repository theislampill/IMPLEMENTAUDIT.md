name: R5 isolated Windows source identity observation

on:
  push:
    branches:
      - pro/dg18-r5-win-stat-20261105
    paths:
      - .github/workflows/dg18-r5-windows-stat.yml
      - qualification/dg18-r5-windows-stat/**

permissions:
  contents: read

concurrency:
  group: dg18-r5-windows-stat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-stat-observation:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg18-r5-win-stat-20261105' &&
      github.run_attempt == '1'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed workflow packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Check out exact qualified source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 539aa846e37eab2dd527912d5e5eaa95f69d61cf
          path: qualified-source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Select physical Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Observe exact source and owned file metadata once
        shell: pwsh
        env:
          DG18_PHYSICAL_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $adapter = Join-Path $env:GITHUB_WORKSPACE 'packet/qualification/dg18-r5-windows-stat/probe.py'
          if ((Get-FileHash -Algorithm SHA256 $adapter).Hash.ToLowerInvariant() -ne '6547182d304fd5fc17475b5c75e657624efd945d35b1d60ea45c20cc163c8f2f') { throw 'Reviewed observer digest differs' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'qualified-source'
          $out = Join-Path $env:RUNNER_TEMP ('dg18-win-stat-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path $out) { throw 'Owned output exists; no retry' }
          & $env:DG18_PHYSICAL_PYTHON -I -X utf8 -B $adapter --source $source --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
