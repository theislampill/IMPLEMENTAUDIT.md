name: DG17 structural acceptance

on:
  push:
    branches:
      - engineering/sol-dg17-20261122
    # This workflow always checks out its explicit product pin.
    paths:
      - '.github/workflows/dg17-structural.yml'

permissions:
  contents: read

env:
  DG17_PRODUCT_COMMIT: b30ef328c9a22f68ab420c84dc87e849fd4e4599
  DG17_PRODUCT_TREE: d79487990b4fcad5fac823c76c48406822732f13
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  op-s:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DG17_PRODUCT_COMMIT }}
      - name: Verify frozen product checkout
        run: |
          test "$(git rev-parse HEAD)" = "$DG17_PRODUCT_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DG17_PRODUCT_TREE"
      - name: Provision the existing scoped Bubblewrap launcher
        timeout-minutes: 2
        run: sudo /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-launcher
      - name: Provision the existing job-owned Bubblewrap policy
        timeout-minutes: 2
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-bwrap-policy
      - name: Install declared package dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements-release.txt
      - name: Check package reserve and clean-source provenance
        run: |
          python -B scripts/package-contract.py --build "$RUNNER_TEMP/dg17-package"
          python -B scripts/package-contract.py --require-clean-source --verify-artifact canonical_plugin "$RUNNER_TEMP/dg17-package/IMPLEMENTAUDIT.plugin.zip"
          python -B scripts/package-contract.py --require-clean-source --verify-artifact standalone_compatibility "$RUNNER_TEMP/dg17-package/IMPLEMENTAUDIT.skill"
          wc -c "$RUNNER_TEMP/dg17-package/"*
          sha256sum "$RUNNER_TEMP/dg17-package/"*
      - name: Check current and historical package budget boundaries
        run: bash tests/package-contract.test.sh
      - name: Check the canonical release-asset oracle
        run: bash tests/plugin-release-asset.test.sh
        if: always()
      - name: Check the standalone release-asset oracle
        run: bash tests/release-asset.test.sh
        if: always()
      - name: Check the Stop route and semantic preservation
        if: always()
        run: |
          bash tests/helper-reachability.test.sh
          bash tests/skill-bootstrap-budget.test.sh
          bash fixtures/semantic-preservation/test-cases.sh
      - name: Run Op S suites
        if: always()
        run: python -B handoff/sol-dg17-20261122/op-s-runner/op_s_runner.py --repo . --suites
      - name: Run Stop disposition and activation controls
        if: always()
        run: |
          python -B tests/host_session_terminal.py SelectedStopDiagnosticsTests
          python -B tests/host_session_binding_hardening.py
      - name: Observe the retained job-owned Bubblewrap policy
        if: always()
        timeout-minutes: 2
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --finalize-hosted-bwrap-policy
