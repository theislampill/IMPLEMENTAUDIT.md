          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: prepare
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg17-isolated-episode/episode.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != '553fb9ca9a489dcc9ba893482112a23ecadcd8e15e992193cfb1a05ad6ab4a98' ]]; then
            echo 'DG17 {"status":"ADAPTER_DIGEST_REFUSED"}'
            exit 1
          fi
          /usr/bin/python3 -I -S -B "$adapter" --step prepare \
            --source "$GITHUB_WORKSPACE/dg17-qualified-source" \
            --output "$RUNNER_TEMP/dg17-episode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

