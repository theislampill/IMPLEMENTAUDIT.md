    timeout-minutes: 20
    steps:
      - name: Check out the exact reviewed episode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: prepare
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg17-isolated-episode/episode.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != '1f02e6b837749f2d59d1392ea62798526ed81ed8091730872b9baf3d793f0146' ]]; then
            echo 'DG17 {"status":"ADAPTER_DIGEST_REFUSED"}'
            exit 1
          fi
          /usr/bin/python3 -I -S -B "$adapter" --step prepare \
            --source "$GITHUB_WORKSPACE/dg17-qualified-source" \
            --output "$RUNNER_TEMP/dg17-episode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

