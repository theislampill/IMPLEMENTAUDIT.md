    paths:
      - .github/workflows/dg17-isolated-episode.yml
      - qualification/dg17-isolated-episode/**

permissions:
  contents: read

concurrency:
  group: dg17-isolated-episode-${{ github.ref }}
  cancel-in-progress: false

