name: DG17 exact Ubuntu package data acquisition

on:
  push:
    branches:
      - pro/dg17-isolated-episode-01-20261106
    paths:
      - .github/workflows/dg17-isolated-episode.yml
      - qualification/dg17-bwrap-data01/**

permissions:
  contents: read

concurrency:
  group: dg17-isolated-episode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dg17-package-data:
    # Deliberately unlaunchable until the root binds a separately reviewed predecessor.
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg17-isolated-episode-01-20261106' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '6deda792226545a03286f2cc0a534f99ba2d9726' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed acquisition sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Acquire one pinned official package as data
        id: acquire
        shell: bash
        env:
          DG17_DATA_INPUTS_SHA256: '18fc6662de42849dab7120a4664a5f3c4d9e24d3e1b9ae6eb4aa6ceb96f35381'
        run: |
          set -euo pipefail
          lane="$GITHUB_WORKSPACE/packet/qualification/dg17-bwrap-data01"
          actual="$(/usr/bin/sha256sum "$lane/acquire.py")"
          actual="${actual%% *}"
          if [[ "$actual" != '04937d168228e081dc809212a0087c8fa953e47f75bd2d1cd631e073a53e96e0' ]]; then
            echo 'DG17 {"status":"ACQUISITION_DRIVER_DIGEST_REFUSED"}'
            exit 1
          fi
          actual="$(/usr/bin/sha256sum "$lane/INPUTS.json")"
          actual="${actual%% *}"
          if [[ "$actual" != '18fc6662de42849dab7120a4664a5f3c4d9e24d3e1b9ae6eb4aa6ceb96f35381' ]]; then
            echo 'DG17 {"status":"ACQUISITION_INPUT_DIGEST_REFUSED"}'
            exit 1
          fi
          /usr/bin/python3 -I -S -B "$lane/acquire.py" --output "$RUNNER_TEMP/dg17-bwrap-data-$GITHUB_RUN_ID-a1"

      - name: Retain only closed public acquisition evidence and verified package data
        if: ${{ always() && steps.acquire.outputs.publication_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DG17_BWRAP_DATA_${{ github.run_id }}_a1
          path: |
            ${{ runner.temp }}/dg17-bwrap-data-${{ github.run_id }}-a1/public/RESULT.json
            ${{ runner.temp }}/dg17-bwrap-data-${{ github.run_id }}-a1/public/CAPTURE.json
            ${{ runner.temp }}/dg17-bwrap-data-${{ github.run_id }}-a1/public/ARTIFACT_MANIFEST.json
            ${{ runner.temp }}/dg17-bwrap-data-${{ github.run_id }}-a1/public/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          if-no-files-found: warn
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
