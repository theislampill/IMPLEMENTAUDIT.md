name: DG17 isolated Claude source-candidate metadata

on:
  push:
    branches:
      - pro/dg17-isolated-episode-01-20261106
    paths:
      - .github/workflows/dg17-isolated-episode.yml
      - qualification/dg17-isolated-episode/**

permissions:
  contents: read

concurrency:
  group: dg17-isolated-episode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dg17-bounded:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
