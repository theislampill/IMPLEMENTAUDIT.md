name: DG21 rsyslog attachment capture

on:
  push:
    branches:
      - pro/dg21-common-qualification-20261101

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Record source identity
        run: |
          git rev-parse HEAD HEAD^{tree}
          sha256sum scripts/qualify-work-graph-c5-setup.py docs/integration/pro-dg21-diagnostics-20261101/capture-rsyslog.py
          git status --porcelain=v1

      - name: Capture the exact rsyslogd refusal without policy operations
        timeout-minutes: 1
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B docs/integration/pro-dg21-diagnostics-20261101/capture-rsyslog.py

      - name: Observe that no owned policy was added
        if: always()
        timeout-minutes: 1
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B - <<'PY'
          import json
          import runpy
          owner = runpy.run_path('scripts/qualify-work-graph-c5-setup.py')
          owner['_bwrap_root']()
          inventory = owner['hosted_bwrap_policy_inventory']()
          owned = sorted(set(inventory).intersection(owner['HOSTED_BWRAP_NAMES']))
          print(json.dumps({'owned_profiles': owned, 'policy_operations': 0,
                            'cleanup_boundary': 'EPHEMERAL_VM_DISPOSAL'}), flush=True)
          if owned:
              raise ValueError('unexpected owned policy in read-only diagnostic')
          PY
