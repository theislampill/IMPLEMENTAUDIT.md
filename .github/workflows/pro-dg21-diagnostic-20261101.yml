name: DG21 scoped AppArmor qualification

on:
  push:
    branches:
      - pro/dg21-common-qualification-20261101

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact qualification source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Record source identity
        run: |
          git rev-parse HEAD HEAD^{tree}
          sha256sum scripts/qualify-work-graph-c5-setup.py tests/composite-source-cases.py
          git status --porcelain=v1

      - name: Run affected AppArmor positive and adverse controls
        timeout-minutes: 1
        run: |
          /usr/bin/python3.12 -I -S -B - <<'PY'
          import json
          import runpy
          import unittest
          case = runpy.run_path('tests/composite-source-cases.py')['CompositeSourceCases']
          prefixes = ('test_c5_bwrap_policy_', 'test_c5_selected_policy_export_',
                      'test_c5_compiled_opaque_', 'test_c5_approved_compilation_',
                      'test_c5_provision_consumes_', 'test_c5_differential_attachment_')
          names = sorted(name for name in dir(case) if name.startswith(prefixes))
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(case(name) for name in names))
          print(json.dumps({'scope': 'FOCUSED_APPARMOR_CONTROLS_ONLY', 'tests': result.testsRun,
                            'skipped': len(result.skipped), 'successful': result.wasSuccessful()}))
          raise SystemExit(0 if names and result.wasSuccessful() and not result.skipped else 1)
          PY

      - name: Provision the maintained pinned hosted launcher
        timeout-minutes: 1
        run: sudo /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-launcher

      - name: Provision the unchanged scoped AppArmor policy
        timeout-minutes: 1
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --provision-hosted-bwrap-policy

      - name: Observe the ordinary constructed continuity transport
        timeout-minutes: 1
        run: /usr/bin/python3.12 -I -S -B -c 'import runpy; probe=runpy.run_path("tests/work-graph-continuity-cases.py"); probe["require_host"]()' --require-supported-host

      - name: Observe retained job-owned AppArmor policy
        if: always()
        timeout-minutes: 1
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3.12 -I -S -B scripts/qualify-work-graph-c5-setup.py --finalize-hosted-bwrap-policy
