name: Pro5 combined portable qualification

on:
  push:
    branches:
      - pro/dg16-dg21-dg22-dg31-integration-receiving-20261102
    paths:
      - .github/workflows/pro5-combined-portable.yml

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact disposable qualification commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Receive source equality with the qualified parent
        id: source_binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4aedfeb74d77288491318ef21dcee1f2b9636c2f'
          test "$(git rev-parse HEAD~2)" = '123089d1f1b9cc3650a2fba8260d322741c53070'
          test "$(git rev-parse 'HEAD~2^{tree}')" = 'bb09e710455ef7b76de3ef7c0c836a20433c6524'
          git diff --exit-code HEAD~2 HEAD -- . ':!.github/workflows/pro5-combined-portable.yml'
          git status --porcelain=v1
      - name: Portable composed source controls
        run: python3 -B tests/composite-source-cases.py -v
      - name: Streaming and deterministic source controls
        if: ${{ always() && steps.source_binding.outcome == 'success' }}
        run: >-
          python3 -B tests/work-graph-c5-input-cases.py
          C5PublicStreamingSourceRevisionCases C5TaskEntropyCases C5TaskResourceCases
          C5CurrentnessWitnessCases
          C5CorrespondenceLiveCases.test_correspondence_actual_source_contract_uses_separate_current_base
          C5CorrespondenceLiveCases.test_correspondence_stale_producer_field_refuses
          C5CorrespondenceLiveCases.test_closed_shared_profile_buffers_and_source_drift_refuse -v
      - name: Ordinary disposable correspondence fixtures
        if: ${{ always() && steps.source_binding.outcome == 'success' }}
        run: >-
          python3 -B tests/work-graph-c5-input-cases.py
          C5CorrespondenceLiveCases.test_two_actual_profiles_share_one_wait_and_refuse_copy_or_window_omission
          C5CorrespondenceLiveCases.test_failed_or_unreleased_first_actual_child_never_starts_suffix
          C5CorrespondenceLiveCases.test_pre_event_abort_retains_actual_first_clone_exit -v
      - name: Receive unchanged source after tests
        if: always()
        run: |
          git diff --exit-code HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
