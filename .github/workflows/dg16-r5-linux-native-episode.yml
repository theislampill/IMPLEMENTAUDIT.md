          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Bind real host, exact source and absence of prior controller refs
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          adapter="$GITHUB_WORKSPACE/packet/qualification/dg16-r5-linux-native-episode/run.py"
          actual="$(/usr/bin/sha256sum "$adapter")"
          actual="${actual%% *}"
          if [[ "$actual" != '3db5cf750f693d432ff24912215cef01d81809e426e194f251ae3141acd915f1' ]]; then
            echo 'DG16_LINUX_NATIVE_EPISODE {"status":"UNQUALIFIED","code":"ADAPTER_DIGEST_REFUSED"}'
            exit 1
          fi
          /usr/bin/python3 -I -S -B "$adapter" --step preflight \
            --source "$GITHUB_WORKSPACE/qualified-source" \
            --output "$RUNNER_TEMP/dg16-linux-native-episode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

