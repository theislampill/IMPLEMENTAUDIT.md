name: DG18 original C11 current installed consumers

on:
  push:
    branches: [pro/dg18-c11-current-51416-20261120-01]
    paths:
      - .github/workflows/dg18-c11-current-51416.yml
      - handoff/pro-executor-results-20261115/dg18-c11-current-51416-20261120/**

permissions:
  contents: read

concurrency:
  group: dg18-c11-current-51416-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installed-current:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg18-c11-current-51416-20261120-01' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact installed-consumer instructions and retained archives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: packet
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Check out the exact archive source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 51416b2f156b341c4a5f09029e2c6ceb5b30b1e7
          path: qualified-source
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Install the retained packages and initialize fresh actual tasks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DG18_INSTALLED_OUTPUT="$RUNNER_TEMP/dg18-installed-$GITHUB_RUN_ID-1"
          printf 'DG18_INSTALLED_OUTPUT=%s\n' "$DG18_INSTALLED_OUTPUT" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/packet/handoff/pro-executor-results-20261115/dg18-c11-current-51416-20261120/qualify.py" \
            --step prepare --source "$GITHUB_WORKSPACE/qualified-source" --output "$DG18_INSTALLED_OUTPUT"

      - name: Read each actual STATE
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/packet/handoff/pro-executor-results-20261115/dg18-c11-current-51416-20261120/qualify.py" \
            --step read-state --source "$GITHUB_WORKSPACE/qualified-source" --output "$DG18_INSTALLED_OUTPUT"

      - name: Read each actual ROADMAP
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/packet/handoff/pro-executor-results-20261115/dg18-c11-current-51416-20261120/qualify.py" \
            --step read-roadmap --source "$GITHUB_WORKSPACE/qualified-source" --output "$DG18_INSTALLED_OUTPUT"

      - name: Receive actual installed receipts and currentness
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/packet/handoff/pro-executor-results-20261115/dg18-c11-current-51416-20261120/qualify.py" \
            --step consume --source "$GITHUB_WORKSPACE/qualified-source" --output "$DG18_INSTALLED_OUTPUT"

      - name: Retain actual installed-consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg18-installed-current-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: ${{ env.DG18_INSTALLED_OUTPUT }}/evidence/**
