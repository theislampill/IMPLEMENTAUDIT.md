name: DG16 one unchanged D48-C02 observation

on:
  push:
    branches: [engineering/dg16-g2-d48-c02-discriminator-20261117]
    paths: [.github/workflows/dg16-g2-d48-c02-discriminator.yml]

permissions:
  contents: read

concurrency:
  group: dg16-d48-c02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selected-observation:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/engineering/dg16-g2-d48-c02-discriminator-20261117' &&
      github.event.created == true && github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == '1'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Acquire the unchanged exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7b1424420f8616d163a7ef1826999f2392840648
          path: source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Capture one unchanged D48-C02 invocation
        shell: bash
        env:
          PATH: /usr/bin:/bin
          PYTHON: /usr/bin/python3
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import signal
          import subprocess
          import sys
          import time

          ROOT = pathlib.Path("source").resolve()
          OUT = pathlib.Path("evidence").resolve()
          OUT.mkdir()
          COMMAND = ["bash", "tests/distributed-runtime-contract.test.sh", "--cell", "D48-C02"]
          BRANCH = "engineering/dg16-g2-d48-c02-discriminator-20261117"
          SOURCE_EXPECTED = {
              "commit": "7b1424420f8616d163a7ef1826999f2392840648",
              "tree": "136af0838a63be674fcdf8a65cf80dd4bedb9ea1",
              "status": "",
          }
          SOURCE_NAMES = (
              "tests/distributed-runtime-contract.test.sh",
              "tests/distributed_generation_fence.py",
              "fixtures/distributed-runtime/r48-fencing-cases.json",
              "fixtures/distributed-runtime/r48-admission-cases.json",
              "skills/implementaudit/scripts/claim-run.sh",
              "skills/implementaudit/scripts/claim-run-rotation.py",
              "skills/implementaudit/scripts/apply-observed-mutation.sh",
              "fixtures/controller-initialization/author_checkpoint.py",
              "scripts/verify-package.sh",
          )
          PREFIX = b"claim-run.sh: initialization pending; token=refs/implementaudit/controller-initializations/d48-c02/"
          PATTERN = re.compile(re.escape(PREFIX) +
              rb"(?P<claim_id>[0-9a-f]{32})@(?P<record_oid>[0-9a-f]{40}); no currentness authority")


          def write(name, value):
              (OUT / name).write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")


          def digest(raw):
              return {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}


          def git(*args):
              return subprocess.check_output(
                  ["/usr/bin/git", "--no-optional-locks", *args],
                  cwd=ROOT, text=True, timeout=30).strip()


          def source():
              return {
                  "identity": {
                      "commit": git("rev-parse", "HEAD"),
                      "tree": git("rev-parse", "HEAD^{tree}"),
                      "status": git("status", "--porcelain=v1", "--untracked-files=all"),
                  },
                  "files": {name: digest((ROOT / name).read_bytes()) for name in SOURCE_NAMES},
              }


          def runtime():
              executables = {}
              for name in ("bash", "git", "python", "python3"):
                  path = shutil.which(name)
                  executables[name] = None if path is None else {
                      "path": path,
                      "physical_path": str(pathlib.Path(path).resolve()),
                      **digest(pathlib.Path(path).read_bytes()),
                  }
              return {
                  "uname": list(os.uname()),
                  "os_release": pathlib.Path("/etc/os-release").read_text(),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
                  "image_os": os.environ.get("ImageOS"),
                  "image_version": os.environ.get("ImageVersion"),
                  "python_executable": sys.executable,
                  "python_version": sys.version,
                  "executables": executables,
                  "path": os.environ["PATH"],
                  "python": os.environ["PYTHON"],
                  "python_dont_write_bytecode": os.environ["PYTHONDONTWRITEBYTECODE"],
              }


          def bookend():
              return {"observed_unix_ns": time.time_ns(), "source": source(), "runtime": runtime()}


          def session_members(session):
              rows = []
              for path in pathlib.Path("/proc").glob("[0-9]*/stat"):
                  try:
                      raw = path.read_text()
                      fields = raw[raw.rindex(") ") + 2:].split()
                  except (FileNotFoundError, ProcessLookupError):
                      continue
                  if int(fields[3]) == session:
                      rows.append({
                          "pid": int(path.parent.name), "state": fields[0],
                          "ppid": int(fields[1]), "process_group": int(fields[2]),
                          "session": int(fields[3]), "starttime_ticks": int(fields[19]),
                      })
              return sorted(rows, key=lambda row: row["pid"])


          def cleanup_session(process):
              before = session_members(process.pid)
              attempts = []
              if process.returncode is not None:
                  deadline = time.monotonic() + 1
                  while session_members(process.pid) and time.monotonic() < deadline:
                      time.sleep(0.05)
              for sig in (signal.SIGTERM, signal.SIGKILL):
                  members = session_members(process.pid)
                  if not members:
                      break
                  for group in sorted({row["process_group"] for row in members}):
                      attempt = {"signal": sig.name, "process_group": group}
                      try:
                          os.killpg(group, sig)
                          attempt["result"] = "SENT"
                      except ProcessLookupError:
                          attempt["result"] = "ALREADY_ABSENT"
                      attempts.append(attempt)
                  deadline = time.monotonic() + 10
                  while time.monotonic() < deadline:
                      process.poll()
                      if not session_members(process.pid):
                          break
                      time.sleep(0.1)
              process.poll()
              after = session_members(process.pid)
              return {
                  "basis": "NEW_SESSION_CREATED_FOR_THIS_COMMAND",
                  "scope": "OWNED_COMMAND_SESSION_ONLY_NOT_NATIVE_CONTAINMENT",
                  "session": process.pid, "before": before,
                  "signal_attempts": attempts, "after": after,
                  "leader_reaped": process.returncode is not None,
                  "no_session_members_observed": not after,
                  "observed_unix_ns": time.time_ns(),
              }


          def inspect_diagnostics(raw):
              diagnostics = []
              offset = 0
              for line_number, raw_line in enumerate(raw.splitlines(keepends=True), 1):
                  line = raw_line.rstrip(b"\r\n")
                  if line.startswith(PREFIX):
                      match = PATTERN.fullmatch(line)
                      diagnostics.append({
                          "line": line_number, "byte_offset": offset,
                          "first_claim_byte_offset": offset + len(PREFIX),
                          "raw_line_hex": raw_line.hex(),
                          "framing_matches": match is not None,
                          "actual_fields": None if match is None else {
                              key: value.decode("ascii") for key, value in match.groupdict().items()
                          },
                      })
                  offset += len(raw_line)
              return {
                  "schema": "dg16.d48-emitted-initialization-diagnostics.v1",
                  "authority": "NONE", "stream": "COMMAND.stderr",
                  "count": len(diagnostics), "diagnostics": diagnostics,
                  "live_claim_or_ref_assertion_performed": False,
                  "original_full25_byte_or_emitter_join_claimed": False,
                  "interpretation": "Exact focused-run bytes only; source chain is bound separately. No old private stream is reconstructed.",
              }


          initial = None
          process = None
          cleanup = None
          temporary = None
          complete = False
          timed_out = None
          write("SOURCE.json", {
              "schema": "dg16.ordinary-d48-c02-discriminator.v1",
              "authority": "NONE",
              "scope": "ONE_UNCHANGED_SYNTHETIC_FIXTURE_INVOCATION_ONLY",
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "branch": BRANCH,
              "source_expected": SOURCE_EXPECTED,
              "command": COMMAND,
              "stdin": "DEVNULL",
              "planned_invocations": 1,
              "command_timeout_seconds": 600,
              "automatic_retry": False,
              "full_G2_acceptance": False,
              "original_acceptance": False,
              "source_tests_modified": False,
              "private_full25_streams_used": False,
              "runtime_precedent": {
                  "run_id": "44045757411",
                  "commit": "3ff47f1a20312a5a87dde26f907a17f15d880fa0",
                  "path": ".github/workflows/dg16-g2-two-stream-discriminator.yml",
              },
          })
          try:
              initial = bookend()
              write("BEFORE.json", initial)
              event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              write("EVENT.json", {
                  key: event.get(key) for key in ("ref", "before", "after", "created", "deleted", "forced")
              })
              assert initial["source"]["identity"] == SOURCE_EXPECTED, "exact source identity refused"
              release = dict(
                  line.split("=", 1) for line in initial["runtime"]["os_release"].splitlines() if "=" in line)
              assert release.get("ID", "").strip('"') == "ubuntu", "ordinary Ubuntu host required"
              assert release.get("VERSION_ID", "").strip('"') == "26.04", "Ubuntu 26.04 required"
              assert os.environ["GITHUB_REPOSITORY"] == "theislampill/IMPLEMENTAUDIT.md"
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "no repeated attempt"
              assert event["created"] is True and event["deleted"] is False and event["forced"] is False
              assert event["before"] == "0" * 40 and event["after"] == os.environ["GITHUB_SHA"]
              assert event["ref"] == "refs/heads/" + BRANCH

              temporary = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
                  "dg16-d48-c02-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
              temporary.mkdir(mode=0o700)
              env = dict(os.environ)
              env["TMPDIR"] = str(temporary)
              started = time.monotonic()
              started_ns = time.time_ns()
              timed_out = False
              with (OUT / "COMMAND.stdout").open("wb") as stdout, (OUT / "COMMAND.stderr").open("wb") as stderr:
                  process = subprocess.Popen(
                      COMMAND, cwd=ROOT, env=env, stdin=subprocess.DEVNULL,
                      stdout=stdout, stderr=stderr, start_new_session=True)
                  try:
                      process.wait(timeout=600)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                  finally:
                      cleanup = cleanup_session(process)
                      write("CLEANUP.json", cleanup)
              cleanup["temporary_residue_before_removal"] = sorted(path.name for path in temporary.iterdir())
              cleanup["temporary_removed"] = False
              if cleanup["no_session_members_observed"] and cleanup["leader_reaped"]:
                  shutil.rmtree(temporary)
                  cleanup["temporary_removed"] = not temporary.exists()
              write("CLEANUP.json", cleanup)

              streams = {name: (OUT / ("COMMAND." + name)).read_bytes() for name in ("stdout", "stderr")}
              write("DIAGNOSTICS.json", inspect_diagnostics(streams["stderr"]))
              marker = b"D48-C02=PASS cases=3/3"
              boundary_reports = [
                  line.decode("ascii") for line in streams["stdout"].splitlines()
                  if re.fullmatch(rb"D48-C02 boundary controls: [0-9]+/[0-9]+", line)
              ]
              after = bookend()
              write("AFTER.json", after)
              predicates = [
                  ("NO_TIMEOUT", not timed_out),
                  ("EXIT_ZERO", process.returncode == 0),
                  ("OWNED_SESSION_ABSENT", cleanup["no_session_members_observed"] and cleanup["leader_reaped"]),
                  ("NO_CLEANUP_SIGNAL_REQUIRED", not cleanup["signal_attempts"]),
                  ("TEMPORARY_REMOVED", cleanup["temporary_removed"]),
                  ("EXISTING_CELL_MARKER", streams["stdout"].splitlines().count(marker) == 1),
                  ("EXISTING_BOUNDARY_REPORT", len(boundary_reports) == 1),
                  ("SOURCE_UNCHANGED", after["source"] == initial["source"]),
                  ("RUNTIME_UNCHANGED", after["runtime"] == initial["runtime"]),
              ]
              complete = all(value for _, value in predicates)
              write("OBSERVATION.json", {
                  "ordinal": 1, "command": COMMAND, "stdin": "DEVNULL",
                  "returncode": process.returncode, "timed_out": timed_out,
                  "timeout_seconds": 600, "pid_and_session": process.pid,
                  "started_unix_ns": started_ns, "finished_unix_ns": time.time_ns(),
                  "elapsed_seconds": time.monotonic() - started,
                  "tmpdir": str(temporary),
                  "streams": {name: digest(raw) for name, raw in streams.items()},
                  "all_captured_bytes_retained": True,
                  "capture_complete": not timed_out and cleanup["no_session_members_observed"] and cleanup["leader_reaped"],
                  "cell_marker_count": streams["stdout"].splitlines().count(marker),
                  "boundary_reports": boundary_reports,
                  "predicates": dict(predicates),
                  "first_failing_predicate": next((name for name, value in predicates if not value), None),
              })
          except Exception as error:
              write("HARNESS_ERROR.json", {"type": type(error).__name__, "message": str(error)})
          finally:
              if process is not None and cleanup is None:
                  try:
                      cleanup = cleanup_session(process)
                      write("CLEANUP.json", cleanup)
                  except Exception as error:
                      write("CLEANUP_ERROR.json", {"type": type(error).__name__, "message": str(error)})
              if temporary is not None and temporary.exists() and cleanup is not None:
                  if cleanup["leader_reaped"] and cleanup["no_session_members_observed"]:
                      try:
                          shutil.rmtree(temporary)
                          cleanup["temporary_removed"] = not temporary.exists()
                          write("CLEANUP.json", cleanup)
                      except Exception as error:
                          write("TEMPORARY_CLEANUP_ERROR.json", {"type": type(error).__name__, "message": str(error)})
              if not (OUT / "AFTER.json").exists():
                  try:
                      write("AFTER.json", bookend())
                  except Exception as error:
                      write("AFTER_ERROR.json", {"type": type(error).__name__, "message": str(error)})
              write("RESULT.json", {
                  "schema": "dg16.ordinary-d48-c02-discriminator-result.v1",
                  "authority": "NONE",
                  "planned_invocations": 1, "observed_invocations": int(process is not None),
                  "actual_returncode": None if process is None else process.returncode,
                  "timed_out": timed_out,
                  "complete_zero_exit_invocation_with_bookends_and_cleanup": complete,
                  "status": "COMPLETE_FOCUSED_OBSERVATION" if complete else "INCOMPLETE_OR_FAILED_FOCUSED_OBSERVATION",
                  "stderr_is_not_required_to_be_empty": True,
                  "equality_comparison_performed": False,
                  "source_correction_performed": False,
                  "original_acceptance": False, "full_G2_acceptance": False,
                  "interpretation": "One unchanged focused command. Actual volatile diagnostics remain evidence; this is neither a correction demonstration nor full25 emitter attribution.",
              })
              write("MANIFEST.json", {
                  path.name: digest(path.read_bytes()) for path in sorted(OUT.iterdir())
                  if path.is_file() and path.name != "MANIFEST.json"
              })
          raise SystemExit(0 if complete else 1)
          PY

      - name: Retain complete raw streams and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg16-d48-c02-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
