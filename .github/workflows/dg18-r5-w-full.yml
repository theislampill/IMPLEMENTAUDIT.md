name: R5 Windows04 exact capture and whole-owner receiving

on:
  push:
    branches:
      - pro/dg18-r5-w-full-04-20261105
    paths:
      - .github/workflows/dg18-r5-w-full.yml
      - qualification/dg18-r5-w-full/**

permissions:
  contents: read

concurrency:
  group: dg18-r5-w-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-windows-owner:
    if: >-
      github.repository == 'theislampill/IMPLEMENTAUDIT.md' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pro/dg18-r5-w-full-04-20261105' &&
      github.run_attempt == '1'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out exact reviewed workflow packet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: packet
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Check out exact qualified source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 35bf9823856eb4efe254b882954120480632230e
          path: qualified-source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false

      - name: Select physical Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Prepare one new subject and execute the maintained runner once
        shell: pwsh
        env:
          DG18_PHYSICAL_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packet = Join-Path $env:GITHUB_WORKSPACE 'packet/qualification/dg18-r5-w-full'
          $adapter = Join-Path $packet 'prepare_and_execute.py'
          $manifest = Join-Path $packet 'SOURCE_MANIFEST.json'
          if ((Get-FileHash -Algorithm SHA256 $adapter).Hash.ToLowerInvariant() -ne '9c0d13092d0e1aa5b7e9876a73f9530ac4cebb3aa793c9382cca64c6fcd689e2') { throw 'Reviewed adapter digest differs' }
          if ((Get-FileHash -Algorithm SHA256 $manifest).Hash.ToLowerInvariant() -ne 'defde207f195525fff4c4188ce1e60031d1f5689b896a8b05362770cfa674ef6') { throw 'Reviewed source manifest digest differs' }
          $native = Join-Path $packet 'native_checks.py'
          if ((Get-FileHash -Algorithm SHA256 $native).Hash.ToLowerInvariant() -ne '9e306d3f3609bb38a1e7571d74fd670cabce116b3c73b0726c7f0741ec10d2ec') { throw 'Reviewed native companion digest differs' }
          $entitlement = Join-Path $packet 'entitlement-reference.txt'
          if ((Get-FileHash -Algorithm SHA256 $entitlement).Hash.ToLowerInvariant() -ne 'a0db3791d8c9ff3fec64936d2c01be4c35338aa2f9c5b1806e673ca63743fce0') { throw 'Reviewed entitlement reference differs' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'qualified-source'
          $out = Join-Path $env:RUNNER_TEMP ('dg18-w-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $log = $out + '.console.log'
          if ((Test-Path $out) -or (Test-Path $log)) { throw 'Owned output already exists; no retry' }
          & $env:DG18_PHYSICAL_PYTHON -I -X utf8 -B $adapter --source $source --python $env:DG18_PHYSICAL_PYTHON --output $out 1> $log 2>&1
          $code = $LASTEXITCODE
          Write-Host ('Fresh Windows adapter exit: ' + $code)
          Write-Host 'Only explicitly selected new-subject evidence is eligible for upload.'
          if ($code -ne 0) { exit $code }

      - name: Validate and emit bounded public projections before upload
        id: public_evidence
        if: always()
        shell: pwsh
        env:
          DG18_PHYSICAL_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $adapter = Join-Path $env:GITHUB_WORKSPACE 'packet/qualification/dg18-r5-w-full/prepare_and_execute.py'
          $out = Join-Path $env:RUNNER_TEMP ('dg18-w-full-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path (Join-Path $out 'public/ARTIFACT_MANIFEST.json')) {
            if ((Get-FileHash -Algorithm SHA256 $adapter).Hash.ToLowerInvariant() -ne '9c0d13092d0e1aa5b7e9876a73f9530ac4cebb3aa793c9382cca64c6fcd689e2') { throw 'Reviewed adapter digest differs' }
            & $env:DG18_PHYSICAL_PYTHON -I -X utf8 -B $adapter --emit-public --output $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'public_eligible=true' -Encoding utf8
          } else {
            Write-Host 'DG18_PUBLIC_REFUSAL {"status":"UNQUALIFIED_PUBLICATION_REFUSED","code":"PUBLIC_MANIFEST_UNAVAILABLE","authority":"NONE","automatic_retry":false}'
          }

      - name: Retain explicitly selected fresh public evidence
        if: always() && steps.public_evidence.outcome == 'success' && steps.public_evidence.outputs.public_eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/RESULT.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/SOURCE.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/TOOLS.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/CONTROL.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/MEASUREMENT.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/TRANSITION.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/RECEIVING.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/NATIVE_CAPTURE.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/NATIVE_RECEIVING.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/FAILURE.json
            ${{ runner.temp }}/dg18-w-full-${{ github.run_id }}-${{ github.run_attempt }}/public/ARTIFACT_MANIFEST.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 6

