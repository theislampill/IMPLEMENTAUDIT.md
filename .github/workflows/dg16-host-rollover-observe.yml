          "run": "set -euo pipefail\numask 077\nsetup=\"$GITHUB_WORKSPACE/source/scripts/qualify-work-graph-c5-setup.py\"\nprintf '%s  %s\\n' '90c1ac53f6aa7a6346b7e88bb782a942c2c76868ce5b4be5d992af040f31c1f7' \"$setup\" | /usr/bin/sha256sum --check --status\nif [[ ! -e /usr/bin/bwrap && ! -L /usr/bin/bwrap ]]; then\n  /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/sudo /usr/bin/env -i \\\n    PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n    /usr/bin/python3.12 -I -S -B \"$setup\" --provision-hosted-launcher >/dev/null 2>&1 || {\n      printf '%s\\n' 'REFUSED: FIXED_LAUNCHER_PROVISION' >&2; exit 1;\n    }\n  printf '%s\\n' 'Pinned absent launcher provision completed; no launcher execution.'\nelse\n  printf '%s\\n' 'Existing launcher path retained for read-only measurement.'\nfi\n",
          "shell": "bash",
          "timeout-minutes": 2
