        {
          "id": "observe",
          "name": "Read bounded host and runtime facts",
          "run": "set -euo pipefail\nset -C\numask 077\nout=\"$RUNNER_TEMP/dg16-host-rollover-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\nmkdir -- \"$out\"\nobserver=\"$GITHUB_WORKSPACE/packet/engineering/dg16-host-rollover-observation/observe.py\"\nprintf '%s  %s\\n' 'c03d139d6e3299dad8d0001ee15ef37357cfb8dea6b9b5744dab80d11af5ce3b' \"$observer\" | /usr/bin/sha256sum --check --status\nrc=0\n/usr/bin/timeout --signal=TERM --kill-after=5s 130s /usr/bin/sudo /usr/bin/env -i \\\n  PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \\\n  GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \\\n  GITHUB_REPOSITORY=\"$GITHUB_REPOSITORY\" GITHUB_EVENT_NAME=\"$GITHUB_EVENT_NAME\" \\\n  DG16_FRESH_BRANCH_PUSH=\"$DG16_FRESH_BRANCH_PUSH\" GITHUB_REF=\"$GITHUB_REF\" \\\n  GITHUB_RUN_ATTEMPT=\"$GITHUB_RUN_ATTEMPT\" GITHUB_RUN_ID=\"$GITHUB_RUN_ID\" \\\n  GITHUB_SHA=\"$GITHUB_SHA\" GITHUB_JOB=\"$GITHUB_JOB\" \\\n  GITHUB_WORKFLOW_SHA=\"$GITHUB_WORKFLOW_SHA\" GITHUB_WORKFLOW_REF=\"$GITHUB_WORKFLOW_REF\" \\\n  GITHUB_WORKSPACE=\"$GITHUB_WORKSPACE\" RUNNER_TEMP=\"$RUNNER_TEMP\" \\\n  ImageOS=\"$ImageOS\" ImageVersion=\"$ImageVersion\" \\\n  EXPECTED_OBSERVER_SHA256=c03d139d6e3299dad8d0001ee15ef37357cfb8dea6b9b5744dab80d11af5ce3b \\\n  /usr/bin/python3.12 -I -S -B \"$observer\" >\"$out/observer-output.raw\" 2>/dev/null || rc=$?\n/usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3.12 -I -S -B - \\\n  \"$out/observer-output.raw\" \"$out/HOST_RUNTIME.json\" \"$rc\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$ImageVersion\" <<'PY'\nimport hashlib, json, os, re, stat, sys\nfrom pathlib import PurePosixPath\n\nMAXIMUM = 98304\nALLOWED_IMAGES = ('20261116.376.1', '20261116.133.1', '20261122.23.1')\nBASELINE = json.loads('[{\"core_tool_sha256\":{\"bwrap\":\"52231e1caf55bcbc667b269f49c63599a6f7db4767ae6a039580d0ff853db712\",\"git\":\"824d5b2fffef332ec7ba053e579659bb12f26a0b4747da6f9c6dc0e71d36f235\",\"python3.12\":\"e50d468e8b0adfb05733f5b87b3cff34829c4a8c1aea50c865aa8bdfe4bb150f\"},\"facts\":{\"archit