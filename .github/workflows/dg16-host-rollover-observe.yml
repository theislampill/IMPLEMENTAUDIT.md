6a039580d0ff853db712\",\"git\":\"08ca4d2ee4d8915e86f1faaa52603752507c57af1d16d451dec9992bc9b6d801\",\"python3.12\":\"e50d468e8b0adfb05733f5b87b3cff34829c4a8c1aea50c865aa8bdfe4bb150f\"},\"facts\":{\"architecture\":\"x86_64\",\"egid\":0,\"euid\":0,\"gid\":0,\"image_os\":\"ubuntu24\",\"image_version\":\"20261116.376.1\",\"os\":{\"ID\":\"ubuntu\",\"VERSION_ID\":\"24.04\"},\"platform\":\"linux\",\"python_version\":[3,12,3],\"uid\":0},\"id\":\"G1_UBUNTU24_20261116_376_1\"}]')\nEXECUTING_PINS = {'engineering/dg16-host-rollover-observation/profile_reader.py': '15a0be03138e3d6767a20d17c3d9066c6f7ba27c47024f6494729b7c4da62b62', 'qualification/dg16-r5-g1-hosted-episode-v21/packet/operation.py': 'ac0760a9f1d124d29df9fd282df689ac8aeb0336fc11e6bb6a2b9e4aa453f13f', 'qualification/dg16-r5-g1-hosted-episode-v21/packet/runtime_preflight.py': '8d6ff960139767c333714bf951cb79bb4205b8c61bbf9df8c578d2ff37cc5a40', 'qualification/dg16-r5-g1-hosted-episode-v21/packet/host_utility.py': '51a88c08bbea3fd82986aaa6028aa16b92f5500de48950300398e542d5701b5a', 'qualification/dg16-r5-g1-hosted-episode-v21/packet/SOURCE_MANIFEST.json': '06a8cd9b2e4ab37c71784342f7d83e58b6d879c58fee0649d88273f5a96ecc28', 'engineering/dg16-host-rollover-observation/observe.py': 'c03d139d6e3299dad8d0001ee15ef37357cfb8dea6b9b5744dab80d11af5ce3b'}\nHELD_BODY_BYTES = 694555\nRUNTIME_PATHS = ('/etc/ld.so.cache', '/lib/x86_64-linux-gnu/libc.so.6', '/lib/x86_64-linux-gnu/libgcc_s.so.1', '/lib/x86_64-linux-gnu/libpthread.so.0', '/lib/x86_64-linux-gnu/libstdc++.so.6', '/lib64/ld-linux-x86-64.so.2', '/usr/bin/python3.12', '/usr/lib/python3.12/_sysconfigdata__linux_x86_64-linux-gnu.py', '/usr/lib/python3.12/posixpath.py', '/usr/lib/python3.12/site.py', '/usr/lib/python3.12/sitecustomize.py', '/usr/lib/python3.12/sysconfig.py')\nRUNTIME_PIN_SHA256 = '22f697fa5ef3e10fb535dbf6d519d4eb5eaa259d5dda1797a8b2c4ad95d45672'\nTOOLS = ('python3.12', 'git', 'bash', 'bwrap', 'env', 'openssl')\nFACT_FIELDS = {'platform', 'architecture', 'os', 'python_version', 'image_os', 'image_version',\n               'uid', 'euid', 'gid', 'egid'}\nSTAT_FIELDS = {'dev', 'ino', 'mode', 'nlink', 'uid', 'gid', 'size', 'mtime_ns', 'ctime_ns'}\nFILE_FIELDS = {'requested', 'canonical', 'requested_stat', 'bytes', 'sha256', 'stat',\n               'ancestors', 'xattrs', 'capability'}\nTOOL_FLAGS = {'available', 'root_owned_nonwritable_chain', 'setid_or_file_capabilities',\n              'executable_mode', 'execute_access', 'trusted_file_custody'}\nCLONE_ALIAS = '/usr/bin/git-upload-pack'\nCLONE_ALIAS_EXPECTED = {'bytes': 4640352, 'link': 'git', 'mode': 493, 'resolved': '/usr/bin/git', 'sha256': '824d5b2fffef332ec7ba053e579659bb12f26a0b4747da6f9c6dc0e71d36f235'}\nGIT_FILES_SHA256 = 'a7a96fbd6a3144abb6d2d5efd26d48630336dc29c38f9d0e0c7beff2fb90f436'\nRUNTIME_FIELDS = {'bytes', 'sha256', 'mode', 'resolved', 'link'}\n\ndef encode(value):\n    return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True,\n                       allow_nan=False) + '\\n').encode('ascii')\n\ndef same(actual, expected):\n    assert encode(actual) == encode(expected)\n\ndef keys(value, population):\n    assert type(value) is dict and set(value) == population\n\ndef integer(value, maximum=2**63 - 1, minimum=0):\n    assert type(value) is int and minimum <= value <= maximum\n\ndef digest(value):\n    assert type(value) is str and re.fullmatch('[0-9a-f]{64}', value)\n\ndef sha(raw):\n    return hashlib.sha256(raw).hexdigest()\n\ndef absolute(value):\n    assert type(value) is str and 1 <= len(value) <= 4096 and '\\x00' not in value\n    path = PurePosixPath(value)\n    assert path.is_absolute() and str(path) == value and '..' not in path.parts\n    assert not value.startswith('//')\n    return path\n\ndef file_stat(value, kinds):\n    keys(value, STAT_FIELDS)\n    for name in STAT_FIELDS:\n        integer(value[name], 2**64 - 1)\n    assert stat.S_IFMT(value['mode']) in kinds and value['mode'] <= 0xffff\n    assert value['nlink'] >= 1 and value['uid'] < 2**32 and value['gid'] < 2**32\n\ndef xattrs(value):\n    keys(value, {'count', 'name_sha256', 'posix_acl_present', 'security_capability_present'})\n    integer(value['count'], 32)\n    names = value['name_sha256']\n    assert type(names) is list and len(names) == value['count']\n    for name in names: digest(name)\n    assert names == sorted(set(names))\n    same(value['posix_acl_present'], any(sha(name) in names for name in\n         (b'system.posix_acl_access', b'system.posix_acl_default')))\n    same(value['security_capability_present'], sha(b'security.capability') in names)\n\ndef file_measurement(row, requested, maximum, roots, extra=frozenset()):\n    keys(row, FILE_FIELDS | extra)\n    assert row['requested'] == requested\n    canonical = absolute(row['canonical'])\n    assert any(canonical.is_relative_to(root) for root in map(PurePosixPath, roots))\n    file_stat(row['stat'], {stat.S_IFREG})\n    file_stat(row['requested_stat'], {stat.S_IFREG, stat.S_IFLNK})\n    if row['requested'] == row['canonical']: same(row['requested_stat'], row['stat'])\n    integer(row['bytes'], maximum); digest(row['sha256'])\n    assert row['bytes'] == row['stat']['size']\n    xattrs(row['xattrs'])\n    ancestors = row['ancestors']\n    assert type(ancestors) is list and len(ancestors) == len(canonical.parents)\n    for ancestor, path in zip(ancestors, canonical.parents):\n        keys(ancestor, {'path', 'stat', 'xattrs'})\n        assert ancestor['path'] == str(path)\n        file_stat(ancestor['stat'], {stat.S_IFDIR}); xattrs(ancestor['xattrs'])\n    cap = row['capability']\n    keys(cap, {'observed', 'present', 'bytes', 'sha256'})\n    assert cap['observed'] is True\n    integer(cap['bytes'], 65536); digest(cap['sha256'])\n    same(cap['present'], cap['bytes'] > 0)\n    if cap['present']: assert row['xattrs']['security_capability_present'] is True\n    else: assert cap['sha256'] == sha(b'')\n\ndef tool_measurement(row, name):\n    assert type(row) is dict and type(row.get('available')) is bool\n    if not row['available']:\n        same(row, dict(requested='/usr/bin/' + name, available=False, code='FILE_UNAVAILABLE', errno=2))\n        return\n    file_measurement(row, '/usr/bin/' + name, 64 * 1024**2, ('/usr',), TOOL_FLAGS)\n    info = row['stat']\n    chain = info['uid'] == 0 and not info['mode'] & 0o022 and all(\n        p['stat']['uid'] == 0 and not p['stat']['mode'] & 0o022 for p in row['ancestors'])\n    privileged = bool(info['mode'] & 0o6000 or row['capability']['present'])\n    executable = bool(info['mode'] & 0o111)\n    assert type(row['execute_access']) is bool\n    same({key: row[key] for key in TOOL_FLAGS}, dict(available=True,\n        root_owned_nonwritable_chain=bool(chain), setid_or_file_capabilities=privileged,\n        executable_mode=executable, execute_access=row['execute_access'],\n        trusted_file_custody=bool(chain and not privileged and executable and row['execute_access'])))\n\ndef runtime_fields(row, capture=False):\n    keys(row, RUNTIME_FIELDS | ({'kind', 'capture_sha256', 'error_class', 'error_sha256'} if capture else set()))\n    integer(row['bytes'], 32 * 1024**2); digest(row['sha256'])\n    integer(row['mode'], 4095); absolute(row['resolved'])\n    assert row['link'] is None or type(row['link']) is str and 0 < len(row['link']) <= 4096 and '\\x00' not in row['link']\n    if capture:\n        assert row['kind'] == 'FILE' and row['error_class'] is None and row['error_sha256'] is None\n        digest(row['capture_sha256'])\n\ndef runtime_measurement(value, tools):\n    keys(value, {'schema', 'source_revision', 'status', 'selector_count', 'source_current',\n                 'source_failure_sha256', 'selectors', 'complete_runtime_qualification', 'automatic_adoption'})\n    rows = value['selectors']\n    assert type(rows) is list and len(rows) == 12\n    rebuilt = []; expected = {}\n    for row, name in zip(rows, RUNTIME_PATHS):\n        keys(row, {'path', 'expected', 'opening', 'closing', 'opening_match',\n                   'closing_match', 'bookends_equal', 'match'})\n        assert row['path'] == name\n        runtime_fields(row['expected']); runtime_fields(row['opening'], True); runtime_fields(row['closing'], True)\n        same(row['opening'], row['closing'])\n        expected[name] = row['expected']\n        match = all(row['opening'][key] == row['expected'][key] for key in RUNTIME_FIELDS)\n        rebuilt.append(dict(path=name, expected=row['expected'], opening=row['opening'], closing=row['closing'],\n                            opening_match=match, closing_match=match, bookends_equal=True, match=match))\n        if name == '/usr/bin/python3.12':\n            tool = tools['python3.12']\n            same({key: row['opening'][key] for key in ('bytes', 'sha256', 'mode', 'resolved')},\n                 dict(bytes=tool['bytes'], sha256=tool['sha256'], mode=stat.S_IMODE(tool['stat']['mode']),\n                      resolved=tool['canonical']))\n    assert sha(encode(expected)) == RUNTIME_PIN_SHA256\n    same(value, dict(schema='dg16.early-fixed-runtime-selectors.v1',\n        source_revision='R5_HOSTED_UBUNTU24_STAGE_B_HOST02_RUNTIME_SOURCE_20261126_V23',\n        status='MATCH' if all(row['match'] for row in rebuilt) else 'REFUSED', selector_count=12,\n        source_current=True, source_failure_sha256=None, selectors=rebuilt,\n        complete_runtime_qualification=False, automatic_adoption=False))\n\ndef clone_alias_measurement(value, tools):\n    keys(value, {'schema','source_revision','requested','selected_git_files_sha256','expected',\n        'opening','closing','opening_match','closing_match','bookends_equal','match','status',\n        'source_current','complete_runtime_qualification','automatic_adoption'})\n    a, b = value['opening'], value['closing']\n    runtime_fields(a, True); runtime_fields(b, True); same(a, b)\n    match = all(a[key] == CLONE_ALIAS_EXPECTED[key] for key in RUNTIME_FIELDS)\n    same(value, dict(schema='dg16.fixed-git-clone-alias-observation.v1',\n        source_revision='R5_HOSTED_UBUNTU24_STAGE_B_HOST02_RUNTIME_SOURCE_20261126_V23',\n        requested=CLONE_ALIAS, selected_git_files_sha256=GIT_FILES_SHA256,\n        expected=CLONE_ALIAS_EXPECTED, opening=a, closing=b,\n        opening_match=match, closing_match=match, bookends_equal=True, match=match,\n        status='MATCH' if match else 'REFUSED', source_current=True,\n        complete_runtime_qualification=False, automatic_adoption=False))\n    assert len(encode(value)) <= 32768\n    git = tools['git']\n    if git['available'] and a['resolved'] == git['canonical']:\n        same({key:a[key] for key in ('bytes','sha256','mode')},\n             dict(bytes=git['bytes'],sha256=git['sha256'],mode=stat.S_IMODE(git['stat']['mode'])))\n\n\ndef success(value, head, run, actual_image):\n    keys(value, {'schema', 'authority', 'status', 'context', 'allowed_image_versions', 'observed_image_version',\n        'requested_image_observed', 'facts', 'boot_identity_sha256', 'os_release', 'tools',\n        'prior_finite_profile_policy_sha256', 'profile_comparison', 'core_tool_comparison',\n        'runtime_selectors', 'git_clone_alias', 'source', 'executing_body_pins', 'opening_unix_ns', 'closing_unix_ns',\n        'limits', 'closing_unchanged', 'automatic_adoption', 'commands_executed', 'observer_network_calls',\n        'provider_setup', 'native_execution', 'private_inputs_read', 'original_awards'})\n    image = value['observed_image_version']\n    assert type(image) is str and image in ALLOWED_IMAGES and image == actual_image\n    assert re.fullmatch('[0-9a-f]{40}', head) and re.fullmatch('[1-9][0-9]{0,19}', run)\n    same(value['context'], dict(repository='theislampill/IMPLEMENTAUDIT.md',\n        branch='engineering/pro-dg16-host-rollover-observe-20261126-05',\n        workflow='.github/workflows/dg16-host-rollover-observe.yml', job='observe', run_id=run,\n        run_attempt=1, workflow_commit=head, fresh_branch_push=True, image_version=image))\n    same({key: value[key] for key in ('schema', 'authority', 'status', 'allowed_image_versions', 'observed_image_version',\n         'requested_image_observed', 'closing_unchanged', 'automatic_adoption', 'commands_executed',\n         'observer_network_calls', 'provider_setup', 'native_execution', 'private_inputs_read', 'original_awards')},\n         dict(schema='dg16.host-rollover-observation.v3', authority='NONE', status='CAPTURED_UNQUALIFIED',\n         allowed_image_versions=list(ALLOWED_IMAGES), observed_image_version=image,\n         requested_image_observed=True, closing_unchanged=True,\n         automatic_adoption=False, commands_executed=[], observer_network_calls=0, provider_setup=False,\n         native_execution=False, private_inputs_read=False, original_awards=[]))\n    facts = value['facts']; keys(facts, FACT_FIELDS)\n    version = facts['python_version']\n    assert type(version) is list and len(version) == 3\n    for component in version: integer(component, 9999)\n    same(facts, dict(platform='linux', architecture='x86_64', os={'ID': 'ubuntu', 'VERSION_ID': '24.04'},\n        python_version=version, image_os='ubuntu24', image_version=image, uid=0, euid=0, gid=0, egid=0))\n    digest(value['boot_identity_sha256'])\n    file_measurement(value['os_release'], '/etc/os-release', 16384, ('/etc', '/usr/lib'))\n    tools = value['tools']; keys(tools, set(TOOLS))\n    for name in TOOLS: tool_measurement(tools[name], name)\n    assert tools['python3.12']['available'] is True\n    runtime_measurement(value['runtime_selectors'], tools)\n    clone_alias_measurement(value['git_clone_alias'], tools)\n    source = value['source']; keys(source, {'commit', 'tree', 'opening', 'closing'})\n    assert type(source['opening']) is dict\n    bookend_hash = source['opening']['physical_bookend_sha256']; digest(bookend_hash)\n    bookend = dict(files=1991, bytes=175658093, entries=2536, physical_bookend_sha256=bookend_hash,\n        all_manifest_members_match=True, includes_ignored_files=True, git_head_checked_separately=True)\n    same(source, dict(commit='6d2c0c3522ce128ea8143d7fc93e1180f46227f8',\n        tree='a0c86d6a71e1f8b9ac3aed2d7c984ac79aeef26e', opening=bookend, closing=bookend))\n    same(value['executing_body_pins'], EXECUTING_PINS)\n    assert value['prior_finite_profile_policy_sha256'] == sha(encode(BASELINE))\n    comparisons = [dict(profile_id=p['id'], different_fields=sorted(key for key in FACT_FIELDS\n        if type(facts[key]) is not type(p['facts'][key]) or facts[key] != p['facts'][key])) for p in BASELINE]\n    matches = [row['profile_id'] for row in comparisons if not row['different_fields']]\n    same(value['profile_comparison'], dict(classification='MATCHES_REVIEWED_PROFILE' if len(matches) == 1\n        else 'OUTSIDE_REVIEWED_PROFILES', matching_profile_ids=matches, profiles=comparisons,\n        native_qualification=False, original_acceptance=False, original_awards=[]))\n    same(value['core_tool_comparison'], {name: dict(observed_sha256=tools[name].get('sha256'),\n        matches_profile_ids=[p['id'] for p in BASELINE if tools[name]['available']\n            and tools[name]['sha256'] == p['core_tool_sha256'][name]]) for name in ('python3.12', 'git', 'bwrap')})\n    actual_read = 2 * 175658093 + HELD_BODY_BYTES + 2 * 41 + 4 * 37 + 2 * value['os_release']['bytes'] \\\n        + 2 * sum(row['bytes'] for row in tools.values() if row['available'])\n    integer(actual_read, 512 * 1024**2)\n    same(value['limits'], dict(deadline_seconds=120, cpu_seconds=60, address_space_bytes=768 * 1024**2,\n        maximum_profile_and_source_read_bytes=512 * 1024**2, actual_profile_and_source_read_bytes=actual_read,\n        runtime_selector_count=12, runtime_capture_count=24,\n        clone_alias_selector_count=1, clone_alias_capture_count=2, total_selector_count=13, total_capture_count=26,\n        maximum_runtime_selector_bytes=32 * 1024**2,\n        maximum_runtime_capture_bytes=26 * 32 * 1024**2, source_owner_maximum_member_bytes=1024**2,\n        source_owner_read_bytes_metered=False, maximum_open_files=64, maximum_output_file_bytes=MAXIMUM,\n        maximum_public_bytes=MAXIMUM))\n    integer(value['opening_unix_ns']); integer(value['closing_unix_ns'])\n\ndef refusal():\n    return dict(schema='dg16.host-rollover-observation-refusal.v1', authority='NONE',\n                status='REFUSED', code='WORKFLOW_OUTPUT_REFUSED', automatic_adoption=False, original_awards=[])\n\nvalue = refusal()\ncaptured = False\ntry:\n    assert len(sys.argv) == 7\n    info = os.stat(sys.argv[1], follow_symlinks=False)\n    assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= MAXIMUM\n    fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n    with os.fdopen(fd, 'rb') as stream: raw = stream.read(MAXIMUM + 1)\n    parsed = json.loads(raw)\n    assert len(raw) <= MAXIMUM and encode(parsed) == raw\n    if parsed['schema'] == 'dg16.host-rollover-observation.v3':\n        assert sys.argv[3] == '0'\n        success(parsed, sys.argv[4], sys.argv[5], sys.argv[6])\n        captured = True\n    else:\n        assert sys.argv[3] != '0'\n        assert type(parsed['code']) is str and re.fullmatch('[A-Z0-9_]{1,64}', parsed['code'])\n        same(parsed, dict(schema='dg16.host-rollover-observation-refusal.v1', authority='NONE',\n             status='REFUSED', code=parsed['code'], automatic_adoption=False, original_awards=[]))\n    value = parsed\nexcept (AssertionError, KeyError, TypeError, ValueError, OSError, RecursionError, OverflowError):\n    pass\npublic = encode(value)\nassert len(public) <= MAXIMUM\nwith open(sys.argv[2], 'xb') as stream: stream.write(public)\nprint('Bounded public observation captured.' if captured else 'REFUSED: OBSERVATION_NOT_CAPTURED')\nraise SystemExit(0 if captured else 1)\nPY\n",
