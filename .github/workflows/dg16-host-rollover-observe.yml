      "steps": [
        {
          "id": "guard",
          "name": "Guard exact fresh observation context",
          "run": "set -euo pipefail\nrefuse() { printf '%s\\n' \"REFUSED: OBSERVATION_$1\" >&2; exit 1; }\n[[ \"${GITHUB_ACTIONS-}\" == true ]] || refuse GITHUB_ACTIONS\n[[ \"${RUNNER_ENVIRONMENT-}\" == github-hosted ]] || refuse RUNNER_ENVIRONMENT\n[[ \"${GITHUB_REPOSITORY-}\" == theislampill/IMPLEMENTAUDIT.md ]] || refuse GITHUB_REPOSITORY\n[[ \"${GITHUB_REF-}\" == refs/heads/engineering/pro-dg16-host-rollover-observe-20261126-05 ]] || refuse GITHUB_REF\n[[ \"${GITHUB_EVENT_NAME-}\" == push ]] || refuse GITHUB_EVENT_NAME\n[[ \"${DG16_FRESH_BRANCH_PUSH-}\" == true ]] || refuse DG16_FRESH_BRANCH_PUSH\n[[ \"${GITHUB_RUN_ATTEMPT-}\" == 1 ]] || refuse GITHUB_RUN_ATTEMPT\n[[ \"${GITHUB_JOB-}\" == observe ]] || refuse GITHUB_JOB\n[[ \"${GITHUB_SHA-}\" =~ ^[0-9a-f]{40}$ ]] || refuse GITHUB_SHA\n[[ \"${GITHUB_WORKFLOW_SHA-}\" == \"$GITHUB_SHA\" ]] || refuse GITHUB_WORKFLOW_SHA\n[[ \"${GITHUB_RUN_ID-}\" =~ ^[1-9][0-9]{0,19}$ ]] || refuse GITHUB_RUN_ID\n[[ \"${GITHUB_WORKFLOW_REF-}\" == theislampill/IMPLEMENTAUDIT.md/.github/workflows/dg16-host-rollover-observe.yml@refs/heads/engineering/pro-dg16-host-rollover-observe-20261126-05 ]] || refuse GITHUB_WORKFLOW_REF\n[[ \"${ImageOS-}\" == ubuntu24 ]] || refuse IMAGE_OS\n[[ \"${ImageVersion-}\" == 20261116.376.1 || \"${ImageVersion-}\" == 20261116.133.1 || \"${ImageVersion-}\" == 20261122.23.1 ]] || refuse IMAGE_VERSION\nprintf 'Allowed diagnostic image: %s\\n' \"$ImageVersion\"\n",
