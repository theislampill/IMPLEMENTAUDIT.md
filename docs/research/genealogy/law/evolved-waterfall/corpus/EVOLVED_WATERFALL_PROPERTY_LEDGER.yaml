- PROPERTY_ID: EW-P013
  PROPERTY_NAME: Qualification envelope and margin evidence
  HISTORICAL_ORIGIN: Aerospace test traditions; environmental qualification; safety-critical hardware/software assurance.
  ORIGINAL_FORM: Qualification test articles exposed to environmental/performance extremes, often once per design type.
  PROBLEM_IT_ADDRESSED: A design may pass nominal tests yet fail across required environmental, load, timing or durability
    envelopes.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Field failure outside nominal conditions; manufacturing/design margin unknown; certification
    basis unsupported.
  MECHANISM: Demonstrate that a design or type meets a defined envelope and margin using analysis, test, similarity or inspection
    on representative configurations.
  TRIGGER_OR_CONTEXT: Safety/mission-critical product; physical environment; production of multiple units; scarce opportunities
    for field correction; certification requirement.
  NON_TRIGGER_OR_CHEAP_PATH: Ordinary web/software features with reversible deployment do not need a separate qualification
    programme; targeted performance/security tests may suffice.
  DEPENDENCIES_OR_PRECONDITIONS: Defined envelope and margins; representative article; validated models; configuration control;
    calibrated equipment; anomaly disposition.
  EXPECTED_ENGINEERING_PAYOFF: Confidence that the design, not merely one unit, can tolerate required conditions; reusable
    basis for accepting later units.
  KNOWN_FAILURE_MODES: Over-testing unrepresentative articles; destructive expense; qualification invalidated by design drift;
    passing envelope treated as proof of all use.
  IMPORTANT_CRITICISMS: Domain-specific and expensive; qualification can delay safer incremental improvements and is not synonymous
    with validation.
  HOW_THE_PROPERTY_EVOLVED: From one terminal campaign to staged component/system qualification, model-supported evidence
    and incremental requalification after bounded change.
  MATURE_OR_EVOLVED_FORM: Configuration-linked evidence for a defined design envelope, with explicit assumptions, margins
    and change-trigger rules.
  CEREMONY_VS_PROPERTY: The property is demonstrated capability over an envelope; a fixed test campaign or one qualification
    document is domain-specific.
