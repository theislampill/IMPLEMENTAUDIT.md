  EXPECTED_ENGINEERING_PAYOFF: Transparent reasoning, focused evidence gaps, through-life risk decisions and better communication
    across disciplines and authority.
  KNOWN_FAILURE_MODES: Persuasive brief rather than inquiry; confirmation bias; after-the-fact rationalisation; static report;
    duplicated document warehouse; graphical complexity.
  IMPORTANT_CRITICISMS: Direct comparative outcome evidence is weak; a polished argument can launder weak premises and consume
