- PROPERTY_ID: EW-P014
  PROPERTY_NAME: Acceptance criteria, authority and provenance
  HISTORICAL_ORIGIN: Contractual acceptance, acceptance testing, flight-unit acceptance and transition-to-service practices.
  ORIGINAL_FORM: Formal customer acceptance test and signed delivery against a specified baseline.
  PROBLEM_IT_ADDRESSED: Delivery status can be ambiguous when technical evidence, contractual scope, exceptions and authority
    are disconnected.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Unauthorised declaration of completion; acceptance of wrong configuration; unresolved
    exceptions hidden; later dispute over obligations.
  MECHANISM: Name the acceptance authority, criteria, evidence, accepted configuration, exceptions/waivers and effective transition
    of responsibility.
  TRIGGER_OR_CONTEXT: External acquirer/operator; regulated or safety system; contractual deliverable; irreversible cutover;
    transfer between organisations.
  NON_TRIGGER_OR_CHEAP_PATH: Internal reversible software release can use automated release criteria and product-owner/operational
    approval without a separate ceremony.
  DEPENDENCIES_OR_PRECONDITIONS: Identified deliverable; criteria agreed before decision; verification/validation evidence;
    authority; exception disposition; audit trail.
  EXPECTED_ENGINEERING_PAYOFF: Clear transfer of custody and obligations, fewer disputes, operational accountability and evidence
    provenance.
  KNOWN_FAILURE_MODES: Signature without technical understanding; acceptance used to force schedule; criteria changed retrospectively;
    accepted documents differ from deployed system.
  IMPORTANT_CRITICISMS: Acceptance can be legal/formal rather than engineering truth; buyer sign-off does not prove fitness
    or certification.
  HOW_THE_PROPERTY_EVOLVED: From one final event to incremental acceptance of capability/configurations and continuous service-level
    acceptance evidence.
  MATURE_OR_EVOLVED_FORM: Explicit, configuration-specific decision by empowered authority, based on current evidence and
    recorded residual obligations.
