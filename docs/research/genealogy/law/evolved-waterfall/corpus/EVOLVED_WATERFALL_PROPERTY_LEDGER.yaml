- PROPERTY_ID: EW-P026
  PROPERTY_NAME: Supplier, long-lead and dependency coordination
  HISTORICAL_ORIGIN: Aerospace/defence systems integration, acquisition/supply processes, interface/configuration management
    and production planning.
  ORIGINAL_FORM: Contract specifications, supplier reviews, data-item deliveries, interface boards and long-lead procurement
    approvals.
  PROBLEM_IT_ADDRESSED: Independent organisations and physical lead times create commitments and information boundaries that
    local team practices cannot dissolve.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Supplier builds to obsolete baseline; data rights missing; long-lead purchase before design
    maturity; integration mismatch; single-source obsolescence.
  MECHANISM: Identify external dependencies, owners, lead times, data/rights, interface and evidence obligations; synchronise
    baselines and stage procurement by demonstrated knowledge.
  TRIGGER_OR_CONTEXT: Multiple legal organisations/suppliers; custom hardware; long lead; scarce materials; safety evidence
    from vendors; sustainment dependence.
  NON_TRIGGER_OR_CHEAP_PATH: Single-team commodity/software dependencies can use lockfiles, service contracts, automated compatibility
    tests and normal vendor management.
  DEPENDENCIES_OR_PRECONDITIONS: Commercial/legal authority; accessible technical data; interface/configuration identity;
    supplier incentives; alternative/contingency analysis.
  EXPECTED_ENGINEERING_PAYOFF: Reduced integration and schedule surprise, clearer accountability, protected sustainment and
    less premature procurement commitment.
  KNOWN_FAILURE_MODES: Prime-contractor bureaucracy; data-item overload; supplier lock-in; approvals conceal poor technical
    visibility; local autonomy destroyed.
  IMPORTANT_CRITICISMS: Heavy supplier governance can reduce innovation and competition; requirements may be frozen to protect
    contracts.
