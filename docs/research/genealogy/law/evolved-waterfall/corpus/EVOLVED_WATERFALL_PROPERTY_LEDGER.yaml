- PROPERTY_ID: EW-P012
  PROPERTY_NAME: Intended-use and operational-context validation
  HISTORICAL_ORIGIN: Early customer/operational evaluation; Royce customer involvement; Boehm V&V distinction; NASA/IEEE validation.
  ORIGINAL_FORM: Formal validation or acceptance testing after implementation against a concept of operations.
  PROBLEM_IT_ADDRESSED: A system can satisfy its specification yet fail stakeholder need, mission, workflow or actual environment.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Correct implementation of wrong requirements; unusable or operationally unsuitable system;
    hidden human/environment assumptions.
  MECHANISM: Evaluate representative users, missions, workflows, environments and outcomes throughout development and again
    on the integrated system.
  TRIGGER_OR_CONTEXT: Novel user need; socio-technical change; safety/mission consequence; operational environment unlike
    development; procurement handoff.
  NON_TRIGGER_OR_CHEAP_PATH: For familiar low-risk changes, telemetry, user tests and rapid reversible deployment can supply
    continuous validation.
  DEPENDENCIES_OR_PRECONDITIONS: Real stakeholders and operators; representative context; explicit intended use; outcome measures;
    ability to change requirements.
  EXPECTED_ENGINEERING_PAYOFF: Reduced wrong-system risk, better operational fit and clearer distinction between conformance
    and usefulness.
  KNOWN_FAILURE_MODES: Proxy users; scripted demonstration; confirmation bias; validation too late; stakeholder sign-off obtained
    without representative use.
  IMPORTANT_CRITICISMS: Users may ask for local preferences rather than system value; validation can become acceptance theatre.
  HOW_THE_PROPERTY_EVOLVED: From final customer demonstration to continuous discovery, simulation, operational experiments
    and independent operational evaluation.
  MATURE_OR_EVOLVED_FORM: Repeated context-validity evidence, with final claims tied to an identified configuration and intended-use
    envelope.
  CEREMONY_VS_PROPERTY: The property is evidence of fitness for intended purpose; a UAT meeting or customer signature alone
    is not enough.
