- PROPERTY_ID: EW-P030
  PROPERTY_NAME: Digital authoritative engineering environment and model governance
  HISTORICAL_ORIGIN: Technical-data management, CAD/CAE, MBSE, digital engineering and authoritative-source initiatives.
  ORIGINAL_FORM: Replace or supplement document sets with integrated models and a designated authoritative source of truth.
  PROBLEM_IT_ADDRESSED: Disconnected documents and tools produce handoff loss, duplicate data and inconsistent views of system
    state.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Different disciplines act on incompatible models; model is stale or unvalidated; authority
    is ambiguous; proprietary tool blocks access; model approval substitutes for reality.
  MECHANISM: Govern authoritative data/model domains, semantics, ownership, versioning, validation, interoperability, access
    and reconciliation to built/deployed state.
  TRIGGER_OR_CONTEXT: Many disciplines/models; complex interfaces; long lifecycle; supplier data exchange; expensive manual
    consistency checking.
  NON_TRIGGER_OR_CHEAP_PATH: Small software products can use source, tests, schemas and deployment manifests as native authoritative
    artefacts without an MBSE platform.
  DEPENDENCIES_OR_PRECONDITIONS: Clear authority boundaries; common identifiers/semantics; tool interoperability; model validation;
    configuration management; culture/workflow adoption; physical readback.
  EXPECTED_ENGINEERING_PAYOFF: Earlier consistency checks, reusable data, reduced handoff duplication, computational analysis
    and more current evidence.
  KNOWN_FAILURE_MODES: '''Single source of truth'' slogan; federated models silently disagree; visual completeness; vendor
    lock-in; access barriers; model/data debt.'
  IMPORTANT_CRITICISMS: Systematic reviews find many benefits are perceived rather than measured; digital models can become
    more opaque ceremony than documents.
  HOW_THE_PROPERTY_EVOLVED: From one central database ideal to governed federations of authoritative sources, digital threads
    and explicit confidence/reconciliation.
  MATURE_OR_EVOLVED_FORM: A configuration-controlled, queryable engineering evidence environment with scoped authority and
    verified correspondence to reality.
  CEREMONY_VS_PROPERTY: The property is governed authoritative information and consistency; buying an MBSE tool, drawing SysML
    or declaring an ASoT is not the property.
