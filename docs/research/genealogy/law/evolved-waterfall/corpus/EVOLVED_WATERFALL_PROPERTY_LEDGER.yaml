- PROPERTY_ID: EW-P007
  PROPERTY_NAME: As-designed, as-built, as-tested and as-deployed reconciliation
  HISTORICAL_ORIGIN: Configuration audits, acceptance data packages, installation/checkout, operational readiness and digital-authority
    initiatives.
  ORIGINAL_FORM: Physical configuration audits, release records, installation audits and as-built drawings.
  PROBLEM_IT_ADDRESSED: Controlled plans or models can diverge from the item actually fabricated, tested, installed or operating.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Evidence proves a different system; field modifications are invisible; operations use
    unknown state; rollback or incident analysis is unreliable.
  MECHANISM: Continuously or at commitment points reconcile intended, realised, tested and deployed states; record deviations,
    waivers and environment identity.
  TRIGGER_OR_CONTEXT: Physical construction; fielded fleets; infrastructure; data migrations; certified releases; complex
    deployment environments.
  NON_TRIGGER_OR_CHEAP_PATH: For stateless, automatically deployed services, deployment manifests, telemetry and immutable
    image identity may supply the cheap path.
  DEPENDENCIES_OR_PRECONDITIONS: Observable deployed state; trustworthy inventory/telemetry; configuration identifiers; authority
    to resolve drift; environment capture.
  EXPECTED_ENGINEERING_PAYOFF: Acceptance evidence applies to reality, safer operations and maintenance, faster incident reconstruction,
    fewer undocumented modifications.
  KNOWN_FAILURE_MODES: Digital twin/model assumed correct without readback; inventory lag; manual audits only; uncontrolled
    emergency fixes; environment excluded.
  IMPORTANT_CRITICISMS: Reconciliation can be expensive or impossible under partial observability; excessive audit frequency
    can become theatre.
  HOW_THE_PROPERTY_EVOLVED: From occasional physical audits to automated provenance, software bills of materials, deployment
    attestations, telemetry and periodic physical confirmation.
  MATURE_OR_EVOLVED_FORM: Evidence-backed correspondence among authoritative models/data and actual built, tested and operating
    configurations, with explicit residual unknowns.
  CEREMONY_VS_PROPERTY: The property is correspondence to reality; an 'as-built' document or authoritative-source label is
    insufficient.
