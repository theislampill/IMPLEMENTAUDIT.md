- PROPERTY_ID: EW-P037
  PROPERTY_NAME: Uniform exhaustive manual traceability and central change-board control
  HISTORICAL_ORIGIN: Document-heavy defence/regulated implementations of traceability and configuration control.
  ORIGINAL_FORM: Trace every artefact to every neighbouring artefact in spreadsheets and route every baseline change through
    a standing CCB.
  PROBLEM_IT_ADDRESSED: Attempted to guarantee coverage, impact visibility and authority.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Link decay, matrix maintenance burden, rubber-stamp approval, workarounds, delayed remediation
    and false completeness.
  MECHANISM: Maximise explicit links and central approvals regardless of consequence or reversibility.
  TRIGGER_OR_CONTEXT: No general trigger; selective traceability and risk-proportional authorisation survive separately as
    EW-P017 and EW-P008.
  NON_TRIGGER_OR_CHEAP_PATH: Native version/test/dependency links and pre-authorised change paths for reversible work.
  DEPENDENCIES_OR_PRECONDITIONS: Would require low maintenance cost and uniformly high consequence, conditions not generally
    present.
  EXPECTED_ENGINEERING_PAYOFF: May provide coverage in a bounded certification scope, but exhaustive/manual/central form is
    not independently justified.
  KNOWN_FAILURE_MODES: Stale links, approval queues, change avoidance, link-count compliance, authority disconnected from
    actual deployment.
  IMPORTANT_CRITICISMS: Traceability studies expose maintenance cost and ideal-link assumptions; nuclear practice itself uses
    graded change thresholds.
  HOW_THE_PROPERTY_EVOLVED: Replaced by selective automated relations, policy-based promotion and risk-triggered escalation.
  MATURE_OR_EVOLVED_FORM: EW-P008 and EW-P017.
  CEREMONY_VS_PROPERTY: Manual matrix and standing board are artefacts, not universal properties.
  CURRENT_STATUS: CEREMONY_NOT_GENERAL_PROPERTY
  EVIDENCE_STRENGTH: A_STRONG_MIXED_EMPIRICAL_AND_DOMAIN_SUPPORT
  PRIMARY_SOURCES:
  - S031
  - S041
  - S042
  - S044
  CRITICAL_SOURCES:
  - S044
  - S048
  EMPIRICAL_OR_DOMAIN_EVIDENCE: Traceability has task benefits under good links, but maintenance is its main cost; graded
    nuclear change control disproves universal prior approval.
  OPEN_QUESTIONS: Certain certification schemas may still require dense explicit traces; the general artefact claim remains
    rejected.
  REVERSIBILITY_PROFILE: Disproportionate in R0–R1; selective value rises R2–R4.
  LINEAGE_CLASSIFICATION:
  - REAL_DEPLOYED_PRACTICE
  - CEREMONIAL_COMPLIANCE
  RELATION_TO_ADAPTIVE_METHODS: REPLACED
  QUESTIONS_FOR_REPOSITORY_AUDIT:
  - Are trace and approval obligations selected by a concrete decision/failure mode, or applied uniformly?
  - Could automation and delegated policy preserve authority with less latency?
  POSSIBLE_CONFLICTING_PROPERTY: Conflicts with EW-P008, EW-P017, EW-P024 and EW-P031.
- PROPERTY_ID: EW-P038
  PROPERTY_NAME: Universal exponential late-change cost rule
  HISTORICAL_ORIGIN: Popularised lifecycle cost-of-change curves and retrospective defect-cost claims.
  ORIGINAL_FORM: Assume every change or defect becomes exponentially more expensive with each later phase, justifying maximal
    up-front control.
  PROBLEM_IT_ADDRESSED: Attempted to motivate early defect prevention and planning.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Misallocates control, discourages cheap late improvement, confuses code edit with propagation,
    commitment-unwind and failure/recovery cost.
  MECHANISM: Use calendar lateness or phase as a universal proxy for change cost.
  TRIGGER_OR_CONTEXT: None; context-specific commitment and consequence evidence must be measured instead.
  NON_TRIGGER_OR_CHEAP_PATH: Assess edit, propagation, commitment-unwind and failure/recovery cost separately.
  DEPENDENCIES_OR_PRECONDITIONS: A universal law would require stable cross-domain cost definitions and effects, which evidence
    does not supply.
  EXPECTED_ENGINEERING_PAYOFF: The warning is directionally useful in some hardware/certification contexts, but the universal
    curve is false.
  KNOWN_FAILURE_MODES: BDUF, sunk-cost protection, avoidance of beneficial change, inflated process burden.
  IMPORTANT_CRITICISMS: Aerospace-like studies show large but wildly variable escalation; 171 software projects found no consistent
    substantial delayed-issue effect.
  HOW_THE_PROPERTY_EVOLVED: Replaced by EW-P033's multidimensional reversibility/commitment profile.
  MATURE_OR_EVOLVED_FORM: No universal curve; use domain-specific evidence and tested recovery.
  CEREMONY_VS_PROPERTY: Citing a generic cost curve is not engineering evidence for a control.
  CURRENT_STATUS: REJECTED_OR_DISFAVOURED
  EVIDENCE_STRENGTH: A_STRONG_DIRECT_COUNTEREVIDENCE_TO_UNIVERSALITY
  PRIMARY_SOURCES:
  - S047
  - S048
  CRITICAL_SOURCES:
  - S048
  EMPIRICAL_OR_DOMAIN_EVIDENCE: Haskins et al. support escalation in aerospace-like systems with multipliers varying from
    29 to over 1,500 by method; Menzies et al. reject a global software effect.
  OPEN_QUESTIONS: Domain-specific thresholds remain open and are retained under EW-P033.
  REVERSIBILITY_PROFILE: Replaced by R0–R4 profiles; calendar phase alone is not a trigger.
  LINEAGE_CLASSIFICATION:
  - LATER_SIMPLIFICATION
  - PREDICTIVE_ESTIMATION
  RELATION_TO_ADAPTIVE_METHODS: REJECTED
  QUESTIONS_FOR_REPOSITORY_AUDIT:
  - Is a control justified by measured commitment/consequence, or by an uncited generic late-change curve?
  - Are edit, propagation, unwind and failure/recovery costs distinguished?
  POSSIBLE_CONFLICTING_PROPERTY: Conflicts with EW-P033 and EW-P024.
