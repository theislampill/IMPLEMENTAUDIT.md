  EMPIRICAL_OR_DOMAIN_EVIDENCE: Bell–Thayer and the Ericsson case show requirements defects and version confusion; aerospace
    and regulated regimes retain identified requirement states but permit iteration.
  OPEN_QUESTIONS: How much structure pays off at each scale? When should an exploratory statement acquire authoritative status?
  REVERSIBILITY_PROFILE: 'R1–R4: value rises with shared scope, external commitment, coupling and evidence obligations; R0
    generally needs only lightweight versioned intent.'
