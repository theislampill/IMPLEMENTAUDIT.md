- PROPERTY_ID: EW-P004
  PROPERTY_NAME: Executable risk retirement through prototypes, pilots, simulation and thin increments
  HISTORICAL_ORIGIN: Benington/SAGE prototype; NATO simulation; Royce 'do it twice'; Boehm spiral; evolutionary acquisition.
  ORIGINAL_FORM: A separate pilot or prototype before the delivered system, sometimes a substantial miniature lifecycle.
  PROBLEM_IT_ADDRESSED: Critical operational, performance, interface and usability assumptions may remain invisible in documents
    and component tests.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Late discovery of infeasibility, wrong user need, integration behaviour or operational
    mismatch after most options are gone.
  MECHANISM: 'Choose the cheapest representative executable experiment that can discriminate the material risk: prototype,
    simulation, hardware-in-the-loop, pilot, test article or thin deployed increment.'
  TRIGGER_OR_CONTEXT: Novelty, uncertainty, difficult integration, unproven technology, weak requirements confidence, expensive
    final test or high consequence.
  NON_TRIGGER_OR_CHEAP_PATH: For known repeat builds or low-risk local changes, ordinary automated tests or a small spike
    may suffice; avoid a ceremonial prototype that cannot affect the design.
  DEPENDENCIES_OR_PRECONDITIONS: Explicit hypothesis and decision; representative enough environment; protected budget/time;
    criteria for learning; no confusion between prototype evidence and qualified product evidence.
  EXPECTED_ENGINEERING_PAYOFF: Earlier risk retirement, better requirements and architecture, reduced late surprise and preserved
    options.
  KNOWN_FAILURE_MODES: Prototype becomes production without hardening; demo optimism; unrepresentative environment; pilot
    treated as schedule theatre; repeated experimentation without decision.
  IMPORTANT_CRITICISMS: A prototype may create false confidence and duplicate cost; not every project needs a separate full
    pilot.
  HOW_THE_PROPERTY_EVOLVED: From Royce's formal second pass to continuous risk-targeted experiments and incremental operational
    learning.
  MATURE_OR_EVOLVED_FORM: Executable evidence is selected by risk and commitment, with clear limits on what the experiment
    proves and explicit promotion criteria.
  CEREMONY_VS_PROPERTY: The property is empirical discrimination before commitment; a mandated prototype phase or 'MVP' label
    is not required.
