- PROPERTY_ID: EW-P029
  PROPERTY_NAME: Sustainment, obsolescence and support continuity
  HISTORICAL_ORIGIN: Full-lifecycle systems engineering, logistics/product support, configuration management and maintenance.
  ORIGINAL_FORM: Logistics support plans, technical manuals, spares, depot arrangements and periodic sustainment reviews.
  PROBLEM_IT_ADDRESSED: Delivery/acceptance is not the end of system life; support data, skills, suppliers and components
    decay.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Unsupportable fielded system, obsolete components, missing data rights, unknown fleet
    configurations, cost growth invisible without baseline.
  MECHANISM: Plan and monitor support concept, technical data, configuration fleet state, skills, obsolescence, supply chain,
    service levels and retirement; update from operations.
  TRIGGER_OR_CONTEXT: Long-lived asset; fleet; regulated/safety system; custom hardware; external supplier; high replacement/cutover
    cost.
  NON_TRIGGER_OR_CHEAP_PATH: Short-lived commodity software can rely on maintained dependencies, observability and explicit
    end-of-life policy.
  DEPENDENCIES_OR_PRECONDITIONS: Lifecycle ownership/funding; operational data; configuration baseline; supplier/data rights;
    retirement authority.
  EXPECTED_ENGINEERING_PAYOFF: Higher availability, controlled lifecycle cost, safer maintenance, upgradeability and deliberate
    retirement.
  KNOWN_FAILURE_MODES: Support plan written before real operations; cost baseline absent; sustainment deferred to future owner;
    vendor lock-in; obsolete documentation.
  IMPORTANT_CRITICISMS: Long-range sustainment plans are highly uncertain and may entrench legacy systems; review metrics
    can be gamed.
  HOW_THE_PROPERTY_EVOLVED: From static logistics plans to telemetry-informed product support, modular/open systems, continuous
    patching and explicit decommissioning.
  MATURE_OR_EVOLVED_FORM: Through-life ownership and evidence for maintaining, modifying and retiring the actual fielded configuration.
  CEREMONY_VS_PROPERTY: The property is continuing capability and authority; a logistics document or annual review alone is
    not sufficient.
