- PROPERTY_ID: EW-P006
  PROPERTY_NAME: Configuration identification and baseline authority
  HISTORICAL_ORIGIN: Military/aerospace configuration management; formal baselines; later IEEE/NASA CM; software version and
    release engineering.
  ORIGINAL_FORM: Named configuration items, approved baselines, status accounting, audits and formal change control.
  PROBLEM_IT_ADDRESSED: Teams must know exactly which requirement, design, component, build and evidence set constitutes a
    proposed, tested, released or accepted system.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Wrong or unapproved item released; incompatible evidence; inability to reproduce a build;
    hidden drift; version disputes.
  MECHANISM: Identify configuration items and immutable or reproducible versions; record baseline purpose/status; control
    promotion and preserve provenance.
  TRIGGER_OR_CONTEXT: Multiple deployable versions; supplier or physical items; safety/certification; regulated evidence;
    long-lived support; distributed teams.
  NON_TRIGGER_OR_CHEAP_PATH: For ephemeral local work, ordinary version control branches and automated build identity are
    enough; not every intermediate file needs formal CI status.
  DEPENDENCIES_OR_PRECONDITIONS: Versionable artefacts; reproducible build/deployment process; named authority; status model;
    access control; retention policy.
  EXPECTED_ENGINEERING_PAYOFF: Reproducibility, controlled release, reliable evidence attribution, safer change and clearer
    responsibility.
  KNOWN_FAILURE_MODES: Baseline becomes freeze; documents controlled but live system not; too many configuration items; manual
    status accounting; shadow releases.
  IMPORTANT_CRITICISMS: Heavy CM can impede harmless change and create bureaucratic latency without preserving actual integrity.
  HOW_THE_PROPERTY_EVOLVED: From document baselines and boards to version control, immutable builds, signed artefacts, automated
    inventories and risk-triggered approval.
  MATURE_OR_EVOLVED_FORM: Authoritative identity across intent, source/model, build, test evidence and release, with proportionate
    promotion controls.
  CEREMONY_VS_PROPERTY: The property is identifiable authoritative state; a paper baseline, standing CCB or universal freeze
    is not required.
