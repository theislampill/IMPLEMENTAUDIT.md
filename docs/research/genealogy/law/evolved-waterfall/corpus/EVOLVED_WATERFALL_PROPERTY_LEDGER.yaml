- PROPERTY_ID: EW-P023
  PROPERTY_NAME: Incremental, concurrent and recursive lifecycle application
  HISTORICAL_ORIGIN: Early iterative practice; spiral; incremental Vee; MIL-STD-498; modern ISO lifecycle standards.
  ORIGINAL_FORM: Apply one sequence of requirements, design, implementation and test once to the whole system.
  PROBLEM_IT_ADDRESSED: Systems contain levels, increments and elements at different maturity; a single project-wide phase
    order batches learning and hides recursive dependencies.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: One giant final integration, subsystem handoffs, local completion without system progress
    and inability to adapt lifecycle to element risk.
  MECHANISM: Apply lifecycle responsibilities concurrently, iteratively and recursively at system, element, increment and
    sustainment levels; coordinate their baselines and evidence.
  TRIGGER_OR_CONTEXT: Any non-trivial system with elements/increments, especially differing technologies, suppliers or release
    cadences.
  NON_TRIGGER_OR_CHEAP_PATH: A tiny product need not model recursive lifecycle structure explicitly; normal iterative work
    can realise the property.
  DEPENDENCIES_OR_PRECONDITIONS: Clear system boundaries; integration cadence; shared configuration/evidence; ownership across
    levels; tailored coordination.
  EXPECTED_ENGINEERING_PAYOFF: Earlier learning, parallel progress, repeated integration and preservation of assurance responsibilities
    without a fixed global phase sequence.
  KNOWN_FAILURE_MODES: Fractal process bureaucracy; each subsystem creates full document stack; asynchronous increments drift;
    local optimisation.
  IMPORTANT_CRITICISMS: Concurrency can create rework and coordination load; recursion is not free and does not eliminate
    architecture dependencies.
  HOW_THE_PROPERTY_EVOLVED: Explicitly incorporated into ISO 15288/12207, incremental Vee and hybrid safety/DevSecOps practice.
  MATURE_OR_EVOLVED_FORM: Lifecycle processes are obligations and feedback loops applied where needed, not calendar phases
    traversed once.
  CEREMONY_VS_PROPERTY: The property is repeated/recursive fulfilment of responsibilities; separate mini-waterfalls and duplicated
    stage artefacts are not required.
