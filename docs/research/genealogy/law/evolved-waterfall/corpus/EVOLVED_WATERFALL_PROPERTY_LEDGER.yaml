- PROPERTY_ID: EW-P019
  PROPERTY_NAME: Assurance or safety case as a living claims–argument–evidence structure
  HISTORICAL_ORIGIN: UK goal-setting safety regulation; nuclear/offshore/defence safety cases; assurance-case research.
  ORIGINAL_FORM: Large safety-case report or dossier submitted at programme milestones.
  PROBLEM_IT_ADDRESSED: Complex safety/assurance conclusions depend on many heterogeneous claims, assumptions and evidence
    that a checklist cannot expose.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Evidence warehouse without a coherent claim; unsupported leaps; hidden assumptions; authority
    cannot see why evidence is sufficient.
  MECHANISM: Maintain an explicit, challengeable argument linking top claims, contexts, defeaters/uncertainty and configuration-specific
