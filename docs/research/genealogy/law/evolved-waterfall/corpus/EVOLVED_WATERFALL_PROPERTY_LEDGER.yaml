- PROPERTY_ID: EW-P010
  PROPERTY_NAME: Verification planning and requirement testability
  HISTORICAL_ORIGIN: Royce early test planning; Boehm V-chart; V-model traditions; IEEE/NASA V&V.
  ORIGINAL_FORM: Verification plans and procedures prepared against baselined requirements before final test.
  PROBLEM_IT_ADDRESSED: Requirements may be ambiguous, infeasible or unevaluable until too late; environments, fixtures and
    data may have long lead times.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Unverifiable requirements, missing evidence, late test redesign, false pass criteria and
    qualification schedule collapse.
  MECHANISM: For each consequential requirement, define evaluation method, level, article/configuration, environment, success
    criteria and independence early enough to change the requirement/design.
  TRIGGER_OR_CONTEXT: Acceptance/certification obligation; difficult environment; scarce facility; performance/safety margin;
    supplier evidence; long test lead.
  NON_TRIGGER_OR_CHEAP_PATH: Low-risk software can encode acceptance examples and automated tests alongside implementation
    without a separate verification plan document.
  DEPENDENCIES_OR_PRECONDITIONS: Testable requirement; representative environment; instrumentation; configuration identity;
    resources; ownership; anomaly process.
  EXPECTED_ENGINEERING_PAYOFF: Earlier ambiguity detection, planned evidence coverage, lower late test surprise and more meaningful
    completion criteria.
  KNOWN_FAILURE_MODES: Test plan mirrors bad requirements; test design overfits expected behaviour; coverage matrix substitutes
    for challenge; expensive plans become stale.
  IMPORTANT_CRITICISMS: Planning tests early can prematurely lock the design or optimise only for stated requirements.
  HOW_THE_PROPERTY_EVOLVED: From a final test phase to evaluation planning during definition and continuous updating of executable
    evidence.
  MATURE_OR_EVOLVED_FORM: Risk-proportional verification design integrated with requirements and architecture, with automated
    evidence where appropriate.
  CEREMONY_VS_PROPERTY: The property is planned evaluability and evidence sufficiency; a monolithic master test plan is not
    universally required.
