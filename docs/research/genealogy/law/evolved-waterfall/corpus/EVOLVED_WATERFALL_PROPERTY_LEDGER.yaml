- PROPERTY_ID: EW-P009
  PROPERTY_NAME: Interface definition, ownership and compatibility control
  HISTORICAL_ORIGIN: SAGE interface policing; aerospace/defence ICD traditions; systems engineering interface management;
    modular/open systems.
  ORIGINAL_FORM: Formal interface requirements and ICDs controlled by interface-control working groups or boards.
  PROBLEM_IT_ADDRESSED: Components developed by different teams, suppliers or disciplines must agree on semantics, units,
    timing, physical, data and operational contracts.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Late integration incompatibility, unsafe assumptions, responsibility gaps, local optimisation
    and cascading redesign.
  MECHANISM: Identify externally consequential interfaces, their semantics and owners; verify both sides; version changes;
    test compatibility in representative integration environments.
  TRIGGER_OR_CONTEXT: Organisational/supplier boundary; independently released components; fixed physical interfaces; long
    integration latency; safety or interoperability consequence.
  NON_TRIGGER_OR_CHEAP_PATH: Private local interfaces can evolve through code, types and tests without formal cross-organisational
    approval.
  DEPENDENCIES_OR_PRECONDITIONS: Two-sided ownership and access; semantic precision; change notification; configuration links;
    integration testability; dispute authority.
  EXPECTED_ENGINEERING_PAYOFF: Fewer integration surprises, parallel work with clearer contracts and contained change impact.
  KNOWN_FAILURE_MODES: ICD becomes stale; unanimous approval blocks evolution; interface is specified syntactically but not
    behaviourally; undocumented operational coupling.
