- PROPERTY_ID: EW-P003
  PROPERTY_NAME: Early architecture and feasibility before hard commitment
  HISTORICAL_ORIGIN: Royce preliminary programme design; SAGE interface discipline; systems Vee and knowledge-based acquisition.
  ORIGINAL_FORM: Preliminary and critical design work before full implementation or production commitment.
  PROBLEM_IT_ADDRESSED: Some cross-cutting constraints—timing, mass, power, safety, data, interfaces, manufacturability—cannot
    be resolved by local implementation alone.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Committing requirements, suppliers, tooling or production before the system concept can
    satisfy dominant constraints.
  MECHANISM: Perform enough cross-disciplinary architecture, trade study, modelling and interface analysis to falsify high-cost
    assumptions and expose system budgets.
  TRIGGER_OR_CONTEXT: High coupling; hardware/physical constraints; scarce test facilities; safety; long lead items; multiple
    suppliers; expensive migration or platform commitment.
  NON_TRIGGER_OR_CHEAP_PATH: Local, modular, quickly deployable software can use a thin architecture sketch, automated fitness
    functions and evolutionary design.
  DEPENDENCIES_OR_PRECONDITIONS: Representative constraints/data; accountable system architect or integrator; willingness
    to change requirements; prototypes/models validated for the question asked.
  EXPECTED_ENGINEERING_PAYOFF: Earlier discovery of infeasible combinations, protected interfaces and reduced commitment-unwind
    cost.
  KNOWN_FAILURE_MODES: Big Design Up Front; architecture prestige without executable evidence; premature standardisation;
    models detached from implementation.
  IMPORTANT_CRITICISMS: Up-front architecture can delay learning and lock in wrong abstractions; architecture documents may
    become authority without reality.
  HOW_THE_PROPERTY_EVOLVED: From complete design before coding to risk-targeted architecture before specific irreversible
    commitments, revisited incrementally.
  MATURE_OR_EVOLVED_FORM: Minimum sufficient architecture and constraint evidence, paired with prototypes and continuously
    reconciled with the realised system.
  CEREMONY_VS_PROPERTY: The property is early falsification of system-level constraints; a fixed CDR package or months-long
    architecture phase is not inherently required.
