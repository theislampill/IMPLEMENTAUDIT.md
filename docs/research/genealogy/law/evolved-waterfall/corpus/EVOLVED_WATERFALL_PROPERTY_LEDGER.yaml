- PROPERTY_ID: EW-P021
  PROPERTY_NAME: Evidence-backed, event-driven commitment reviews
  HISTORICAL_ORIGIN: Design reviews, phase gates, acquisition milestones and technical review traditions.
  ORIGINAL_FORM: Calendar-scheduled preliminary/critical design reviews and phase-gate meetings approving documents before
    the next phase.
  PROBLEM_IT_ADDRESSED: Large commitments need explicit decisions, but calendar progress and document completion are weak
    proxies for technical readiness.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Production, deployment, procurement or certification commitment without enough knowledge;
    gate passes because stopping is politically impossible.
  MECHANISM: Define the irreversible decision, entrance/exit evidence, residual risks and decision rights; review when evidence
    is ready and preserve a real stop/redirect option.
  TRIGGER_OR_CONTEXT: Capital, production, long-lead procurement, fleet deployment, irreversible migration, safety authority,
    major supplier or contractual commitment.
  NON_TRIGGER_OR_CHEAP_PATH: Continuous low-risk software work can use automated promotion rules and lightweight asynchronous
    review; no milestone meeting is needed.
  DEPENDENCIES_OR_PRECONDITIONS: Decision authority able to stop/change course; independent challenge; current actual-state
    evidence; transparent criteria; no automatic schedule pass.
  EXPECTED_ENGINEERING_PAYOFF: Better-timed commitment, risk visibility, option preservation and accountability for residual
    uncertainty.
  KNOWN_FAILURE_MODES: Milestone gaming; slideware; sunk-cost escalation; duplicate boards; criteria waived at the meeting;
    gate after commitment already made.
  IMPORTANT_CRITICISMS: Phase gates can certify documents rather than products, batch feedback and reward concealment; the
    review may add no new decision information.
  HOW_THE_PROPERTY_EVOLVED: From fixed phase completion to event-driven, risk-based knowledge points, continuous evidence
    and overlapping work.
  MATURE_OR_EVOLVED_FORM: A commitment decision—not a lifecycle phase—whose strength matches the cost and consequence of being
    wrong.
