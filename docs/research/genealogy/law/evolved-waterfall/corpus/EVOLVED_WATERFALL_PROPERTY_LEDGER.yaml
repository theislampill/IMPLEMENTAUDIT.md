- PROPERTY_ID: EW-P008
  PROPERTY_NAME: Change visibility, impact analysis and risk-proportional authorisation
  HISTORICAL_ORIGIN: Formal change control and CCBs; configuration management; nuclear graded-change rules; modern automated
    dependency analysis.
  ORIGINAL_FORM: Change requests evaluated and approved by a standing board before baseline modification.
  PROBLEM_IT_ADDRESSED: Consequential changes can propagate across interfaces, evidence, suppliers, operations and regulatory
    commitments.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Unseen side effects, invalidated qualification/certification, incompatible releases, unauthorised
    risk acceptance or loss of provenance.
  MECHANISM: Expose proposed change, affected configurations/dependencies/evidence, consequence and rollback; route authority
    according to thresholds rather than uniformly.
  TRIGGER_OR_CONTEXT: Shared baselines; high coupling; external interfaces; safety/security/privacy; certified state; expensive
    recovery; contractual commitments.
  NON_TRIGGER_OR_CHEAP_PATH: Local reversible changes with strong automated tests can be pre-authorised under policy and merged
    through normal peer review/CI.
  DEPENDENCIES_OR_PRECONDITIONS: Dependency/trace information; clear delegated authority; risk criteria; timely reviewers;
    emergency path; audit trail.
  EXPECTED_ENGINEERING_PAYOFF: Safer consequential change, less surprise, preserved external commitments and clearer accountability.
  KNOWN_FAILURE_MODES: Standing board bottleneck; rubber-stamp approvals; impact analysis based on stale links; hidden workarounds;
    change avoidance; security patch delay.
  IMPORTANT_CRITICISMS: Change control can cost more than the change and can turn adaptation into exception processing.
  HOW_THE_PROPERTY_EVOLVED: From universal board approval to delegated, automated and risk-triggered control with post-change
    monitoring.
  MATURE_OR_EVOLVED_FORM: Policy-based change classes, automated impact evidence, named escalation thresholds and explicit
    acceptance of residual risk.
  CEREMONY_VS_PROPERTY: The property is visible authorised consequence management; a standing committee and meeting are not
    generally required.
  CURRENT_STATUS: RETAINED_IN_EVOLVED_FORM
  EVIDENCE_STRENGTH: A_STRONG_CROSS_DOMAIN_NORMATIVE_SUPPORT
