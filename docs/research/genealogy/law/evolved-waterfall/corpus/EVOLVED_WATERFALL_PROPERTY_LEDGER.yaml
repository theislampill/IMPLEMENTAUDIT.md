- PROPERTY_ID: EW-P005
  PROPERTY_NAME: Current, transferable engineering knowledge and decision rationale
  HISTORICAL_ORIGIN: Royce documentation; Benington records; Parnas/Clements rational design records; modern technical-data/model
    practices.
  ORIGINAL_FORM: Large specifications, design descriptions, review records and manuals.
  PROBLEM_IT_ADDRESSED: Complex systems outlive individuals and cross organisational boundaries; decisions and constraints
    must remain understandable.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Tacit rationale loss, repeated mistakes, unsafe maintenance, inability to review or transfer
    responsibility, and divergence between intent and implementation.
  MECHANISM: Capture current decisions, rationale, assumptions, interfaces, evidence and operating constraints in accessible
    forms linked to the relevant configuration.
  TRIGGER_OR_CONTEXT: Long-lived systems; turnover; suppliers; safety/certification; difficult maintenance; asynchronous or
    geographically distributed work.
  NON_TRIGGER_OR_CHEAP_PATH: Small co-located reversible work can rely on tests, code, short decision records and version
    history; document only durable or non-obvious knowledge.
  DEPENDENCIES_OR_PRECONDITIONS: Information ownership; update triggers; integration with work; discoverability; configuration
    links; deletion/retirement discipline.
  EXPECTED_ENGINEERING_PAYOFF: Faster review and maintenance, continuity across handoffs, auditable decisions and less reconstruction
    error.
  KNOWN_FAILURE_MODES: Documentation debt; write-only repositories; prose duplicated from code/models; volume obscures critical
    facts; rationale rationalised after the fact.
  IMPORTANT_CRITICISMS: Documentation can consume resources, slow feedback and create false assurance if it is approved but
    stale.
  HOW_THE_PROPERTY_EVOLVED: From prescribed volumes to information-item outcomes, living models/data, concise records and
    automated evidence.
  MATURE_OR_EVOLVED_FORM: Minimum sufficient, current and configuration-linked engineering knowledge whose maintenance cost
    is justified by future decisions.
  CEREMONY_VS_PROPERTY: The property is durable usable knowledge; page count, template completion and separate document ownership
    are not the property.
  CURRENT_STATUS: USEFUL_BUT_EASILY_BUREAUCRATISED
