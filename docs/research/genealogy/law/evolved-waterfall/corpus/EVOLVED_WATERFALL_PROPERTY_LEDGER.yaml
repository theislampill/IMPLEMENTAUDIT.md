- PROPERTY_ID: EW-P015
  PROPERTY_NAME: Certification basis and regulatory-authority coupling
  HISTORICAL_ORIGIN: Airworthiness, nuclear licensing, medical-device regulation, rail safety and other external assurance
    regimes.
  ORIGINAL_FORM: Evidence package and formal application demonstrating compliance with prescribed objectives to an empowered
    authority.
  PROBLEM_IT_ADDRESSED: Some systems create public/third-party risk that cannot be accepted solely by the developer or acquirer.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Operating without legal authority; evidence not aligned to certification basis; changes
    invalidate approval; authority sees changes too late.
  MECHANISM: Identify applicable certification basis, means of compliance, authority interfaces, evidence/configuration boundaries
    and change/reapproval triggers.
  TRIGGER_OR_CONTEXT: Legally regulated system; safety or environmental externality; airworthiness/type approval/licensing;
    public infrastructure.
  NON_TRIGGER_OR_CHEAP_PATH: No trigger where no empowered external certification regime applies; do not invent an internal
    'certification' label.
  DEPENDENCIES_OR_PRECONDITIONS: Correct legal/domain expertise; early authority agreement; configuration/evidence trace;
    independent assessment where required; change visibility.
  EXPECTED_ENGINEERING_PAYOFF: Reduced approval surprise, lawful operation, clearer public-risk accountability and reusable
    compliance evidence.
  KNOWN_FAILURE_MODES: Compliance theatre; regulator capture; certification treated as proof of zero risk; excessive conservatism;
    obsolete rules; duplicated evidence.
  IMPORTANT_CRITICISMS: Domain-specific obligations cannot be generalised; authority approval may lag technical reality or
    inhibit beneficial change.
  HOW_THE_PROPERTY_EVOLVED: From terminal dossiers toward early authority engagement, modular/incremental evidence, update-management
    systems and continuous monitoring—without eliminating legal decisions.
  MATURE_OR_EVOLVED_FORM: Lifecycle-neutral engineering that satisfies a specific certification basis for identified configurations
    and maintains authority after change.
  CEREMONY_VS_PROPERTY: The property is alignment with an actual empowered regime; an internal badge, generic compliance checklist
    or 'certified' document is not general engineering.
