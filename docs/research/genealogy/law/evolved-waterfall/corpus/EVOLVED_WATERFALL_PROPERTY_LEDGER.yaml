  NON_TRIGGER_OR_CHEAP_PATH: Stable low-risk products can use concise control/evidence summaries; do not construct a graphical
    assurance case merely to satisfy a style.
  DEPENDENCIES_OR_PRECONDITIONS: Claims with scope; credible evidence; independent challenge; configuration/version links;
