- PROPERTY_ID: EW-P017
  PROPERTY_NAME: Demonstrable bidirectional traceability
  HISTORICAL_ORIGIN: Requirements-to-design/code/test matrices in defence/aerospace; V-model correspondence; modern linked
    lifecycle data.
  ORIGINAL_FORM: Manual traceability matrices showing forward and backward links among requirements, design, implementation
    and tests.
  PROBLEM_IT_ADDRESSED: Authorities and maintainers need to know why an element exists, what a change affects and whether
    obligations have evidence.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Orphan requirements, unexplained implementation, untested obligations, missed impact and
    evidence attached to wrong requirement/configuration.
  MECHANISM: Maintain decision-useful, queryable and configuration-aware relations among consequential intent, design, implementation,
    hazards, changes and evidence; monitor link quality and decay.
  TRIGGER_OR_CONTEXT: Certification; high coupling; long-lived system; supplier handoff; safety/hazard chains; expensive impact
    analysis; many variants.
  NON_TRIGGER_OR_CHEAP_PATH: For small rapidly changing software, issue/commit/test naming, executable specifications, types
    and dependency graphs may provide sufficient native trace.
  DEPENDENCIES_OR_PRECONDITIONS: Stable identifiers; clear semantics; automated capture where possible; ownership; quality
    checks; actual use in decisions; cost budget.
  EXPECTED_ENGINEERING_PAYOFF: Faster and more correct maintenance/impact tasks, coverage visibility, evidence provenance
    and defect prevention in some settings.
  KNOWN_FAILURE_MODES: Stale or false links; exhaustive matrices no one uses; high creation/maintenance cost; link-count compliance;
    generated links overwhelm users.
  IMPORTANT_CRITICISMS: Laboratory benefits assume correct complete traces; industrial causal evidence and net lifecycle return
    remain limited.
  HOW_THE_PROPERTY_EVOLVED: From manual matrices to selective, automated, queryable graph relations with staleness detection
    and use-based scope.
  MATURE_OR_EVOLVED_FORM: Trace the claims whose loss would impair a real decision; maintain evidence of link quality rather
    than maximising link count.
  CEREMONY_VS_PROPERTY: The property is demonstrable relation for a decision; a spreadsheet or universal end-to-end matrix
    is not required.
