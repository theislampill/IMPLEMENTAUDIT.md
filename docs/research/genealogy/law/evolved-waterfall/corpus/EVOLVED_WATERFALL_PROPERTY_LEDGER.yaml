- PROPERTY_ID: EW-P011
  PROPERTY_NAME: Multi-level verification and integration evidence
  HISTORICAL_ORIGIN: Independent staged testing in SAGE; Royce integrated-test concern; software V-chart; systems Vee.
  ORIGINAL_FORM: Unit, component, subsystem, integration and system tests conducted in progressively broader environments.
  PROBLEM_IT_ADDRESSED: Local conformance does not establish interactions, timing, load, emergent behaviour or end-to-end
    correctness.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Components pass alone but fail together; local phase completion is mistaken for system
    readiness; integration arrives too late.
  MECHANISM: Evaluate at the level where the relevant failure can manifest, integrate early and repeatedly, and preserve evidence
    linking failures to configuration and interfaces.
  TRIGGER_OR_CONTEXT: Distributed components; cyber-physical behaviour; performance/load; external services; multiple suppliers;
    system-of-systems.
  NON_TRIGGER_OR_CHEAP_PATH: For a small monolith or local change, one automated end-to-end path plus focused component tests
    may be enough.
  DEPENDENCIES_OR_PRECONDITIONS: Integration environment; representative data/load; observability; version identity; interface
    contracts; anomaly handling.
  EXPECTED_ENGINEERING_PAYOFF: Earlier cross-component failure detection, credible system evidence and reduced final-integration
    surprise.
  KNOWN_FAILURE_MODES: Test pyramid dogma; duplicated evidence; brittle environments; integration theatre with mocks; system
    tests too slow to guide development.
  IMPORTANT_CRITICISMS: More levels do not automatically add information; slow suites can delay feedback and encourage batching.
  HOW_THE_PROPERTY_EVOLVED: From terminal integration/test phases to continuous integration plus staged representative system
    and operational evaluation.
  MATURE_OR_EVOLVED_FORM: Layered evidence selected by failure observability, with fast lower-level feedback and periodic
    higher-fidelity integration.
  CEREMONY_VS_PROPERTY: The property is evaluation at the correct system level; a fixed number of test phases or a V diagram
    is not required.
