- PROPERTY_ID: EW-P034
  PROPERTY_NAME: Fixed one-pass lifecycle sequencing
  HISTORICAL_ORIGIN: Later simplifications of staged development and some real contract/organisation implementations.
  ORIGINAL_FORM: Requirements complete, then design complete, then implementation, then testing, with phases closed against
    return.
  PROBLEM_IT_ADDRESSED: Attempted to create management order and contractual predictability in large projects.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Its own failure mode is late feedback, late integration, frozen error, handoff loss and
    inability to learn.
  MECHANISM: Predetermine one global phase order and treat return as exception.
  TRIGGER_OR_CONTEXT: No general trigger established; logical dependencies may exist, but they do not justify one global calendar
    sequence.
  NON_TRIGGER_OR_CHEAP_PATH: Use iterative, concurrent and recursive lifecycle obligations; preserve only real dependency/commitment
    order.
  DEPENDENCIES_OR_PRECONDITIONS: Would require stable complete knowledge and negligible learning value—conditions rarely true
    for non-trivial novel development.
  EXPECTED_ENGINEERING_PAYOFF: Can simplify scheduling for genuinely repeatable production, but that is production planning
    rather than a general development lifecycle.
  KNOWN_FAILURE_MODES: All canonical sequentiality failures; local phase completion without system evidence; change suppression.
  IMPORTANT_CRITICISMS: Royce himself called the unmodified form risky; current ISO standards do not prescribe it; empirical
    cases show requirements/testing/handoff problems.
  HOW_THE_PROPERTY_EVOLVED: Rejected as a universal development model; replaced by tailored iterative/incremental lifecycles
    and event-driven commitments.
  MATURE_OR_EVOLVED_FORM: No mature general form. Preserve actual causal dependencies and commitment boundaries, not the phase
    diagram.
  CEREMONY_VS_PROPERTY: The Waterfall diagram is not a surviving engineering property.
