- PROPERTY_ID: EW-P028
  PROPERTY_NAME: Rollback, contingency and recovery readiness
  HISTORICAL_ORIGIN: Contingency planning, mission abort/backup, disaster recovery and modern progressive-delivery practice.
  ORIGINAL_FORM: Contingency plans, backup systems and recovery procedures prepared before operation.
  PROBLEM_IT_ADDRESSED: Some failures cannot be prevented economically; control value depends on whether damage can be contained
    and service restored.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Change is labelled reversible but rollback loses data, worsens hazard, depends on unavailable
    people/tools or has never been tested.
  MECHANISM: Define recovery objectives, backups, fallback/abort paths, state reconciliation and decision authority; test
    them under representative conditions.
  TRIGGER_OR_CONTEXT: Operational/data change; service dependency; cyber threat; migration; remote/physical operation; significant
    outage or safety consequence.
  NON_TRIGGER_OR_CHEAP_PATH: Truly stateless low-impact experiments may need only one-click revert and normal version history.
  DEPENDENCIES_OR_PRECONDITIONS: Known state model; backups/alternate capability; observability; access; rehearsals; ownership;
    time and safety limits.
  EXPECTED_ENGINEERING_PAYOFF: Reduced failure/recovery cost, safer experimentation, bounded outages and honest reversibility
    classification.
  KNOWN_FAILURE_MODES: Untested plan; backup corrupt or inaccessible; rollback incompatible with migrated data; fallback shares
    same failure; recovery metrics unrealistic.
  IMPORTANT_CRITICISMS: Redundancy and rehearsal cost can be high; fallback can increase complexity and attack surface.
  HOW_THE_PROPERTY_EVOLVED: From static disaster-recovery binders to automated rollback, canary/progressive delivery, chaos
    exercises and continuously tested recovery.
  MATURE_OR_EVOLVED_FORM: Demonstrated recovery capability whose evidence is tied to the current architecture, data and operational
    configuration.
  CEREMONY_VS_PROPERTY: The property is working recoverability; a contingency document, checkbox backup or claimed rollback
    is not enough.
