- PROPERTY_ID: EW-P002
  PROPERTY_NAME: Explicit requirements uncertainty, assumptions and learning obligations
  HISTORICAL_ORIGIN: NATO-era simulation/prototyping; Bell–Thayer defect evidence; Parnas/Clements; spiral risk management.
  ORIGINAL_FORM: Uncertainty was often hidden inside provisional specifications or handled through informal redesign.
  PROBLEM_IT_ADDRESSED: Teams must distinguish known obligations from hypotheses, assumptions, unresolved choices and environmental
    uncertainty.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: False completeness, premature contractual/design commitment, unplanned rework and validation
    against assumptions nobody remembers.
  MECHANISM: Record uncertainty, confidence, assumptions, decision deadlines, owners and planned evidence-generating activities;
    promote items to baseline only when warranted.
  TRIGGER_OR_CONTEXT: Novel problem, volatile environment, ambiguous user need, uncertain technology, emergent operations
    or weak observability.
  NON_TRIGGER_OR_CHEAP_PATH: Routine replacement with stable, externally specified behaviour can use a short assumption list
    and normal change handling.
  DEPENDENCIES_OR_PRECONDITIONS: Psychological safety to admit uncertainty; decision owners; access to prototypes/users/data;
    expiry and review mechanisms.
  EXPECTED_ENGINEERING_PAYOFF: Better experiment selection, preserved options, less false precision and earlier discovery
    of invalid premises.
  KNOWN_FAILURE_MODES: An uncertainty register that never changes decisions; endless analysis; treating every requirement
    as tentative; unowned assumptions.
  IMPORTANT_CRITICISMS: Can become administrative risk-register theatre or an excuse to avoid commitment.
  HOW_THE_PROPERTY_EVOLVED: From pretending specification completion to making uncertainty an explicit governed engineering
    object tied to evidence and decisions.
  MATURE_OR_EVOLVED_FORM: An assumption/uncertainty ledger integrated with requirements, architecture, hazards and experiments,
    with expiry and promotion/retirement rules.
  CEREMONY_VS_PROPERTY: The property is explicit epistemic status and planned learning; a standing risk meeting or large spreadsheet
    is optional.
  CURRENT_STATUS: CONTEXT_DEPENDENT
  EVIDENCE_STRENGTH: B_STRONG_HISTORICAL_AND_MECHANISTIC_SUPPORT
