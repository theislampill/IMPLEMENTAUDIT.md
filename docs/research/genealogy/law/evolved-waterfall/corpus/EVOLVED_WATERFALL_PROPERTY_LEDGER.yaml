- PROPERTY_ID: EW-P020
  PROPERTY_NAME: Anomaly, problem-report, deviation, waiver and corrective-action provenance
  HISTORICAL_ORIGIN: SAGE problem records; Royce test control; defence problem reports; quality/safety corrective-action systems.
  ORIGINAL_FORM: Formal problem reports, discrepancy review boards, waivers/deviations and corrective-action records.
  PROBLEM_IT_ADDRESSED: Failures, accepted exceptions and recurring causes must remain visible across releases and authority
    changes.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Defect silently deferred; waiver applied to wrong configuration; recurring failure; test
    pass obtained by changing expectation; root cause never addressed.
  MECHANISM: Give each material anomaly identity, affected configuration, severity, evidence, disposition, authority, corrective
    action and verification of closure; retain accepted residuals.
  TRIGGER_OR_CONTEXT: Safety/mission/quality consequence; repeated releases; supplier defects; certification/acceptance exceptions;
    operational incidents.
  NON_TRIGGER_OR_CHEAP_PATH: Low-risk local bugs can use an issue tracker and automated regression test; do not convene a
    discrepancy board for every defect.
  DEPENDENCIES_OR_PRECONDITIONS: Non-punitive reporting; configuration identity; severity criteria; closure authority; root-cause
    competence; feedback into requirements/hazards/tests.
  EXPECTED_ENGINEERING_PAYOFF: Prevents silent loss, supports recurrence analysis, preserves exceptions and demonstrates closure
    on the correct state.
  KNOWN_FAILURE_MODES: Ticket closure without fix; backlog graveyard; root-cause theatre; excessive paperwork; waiver normalisation;
    metrics gaming.
  IMPORTANT_CRITICISMS: Formal corrective-action systems can prioritise closure statistics over learning and impose disproportionate
    burden.
  HOW_THE_PROPERTY_EVOLVED: From paper discrepancy boards to integrated issue/evidence/provenance systems, automated regression
    and risk-triggered escalation.
  MATURE_OR_EVOLVED_FORM: One material problem identity from detection through authorised disposition and verified correction,
    linked to configuration and evidence.
  CEREMONY_VS_PROPERTY: The property is durable problem/exception provenance and closure; a standing board or mandatory form
    is not required.
