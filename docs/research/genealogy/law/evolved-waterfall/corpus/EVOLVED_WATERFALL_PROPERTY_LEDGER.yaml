- PROPERTY_ID: EW-P016
  PROPERTY_NAME: Independent technical challenge and IV&V
  HISTORICAL_ORIGIN: Independent testing in SAGE; defence/nuclear IV&V; IEEE 1012; independent operational test and safety
    assessment.
  ORIGINAL_FORM: Separate organisation performs verification/validation with technical, managerial and financial independence.
  PROBLEM_IT_ADDRESSED: Developer incentives, familiarity and group assumptions can suppress or miss consequential defects
    and invalid claims.
  FAILURE_MODE_IT_TRIES_TO_PREVENT: Self-confirming evidence, conflicted risk acceptance, unchallenged assumptions, management
    pressure and false closure.
  MECHANISM: Provide technically competent challenge with sufficient separation of responsibility and authority, focused on
    critical claims, while preserving timely access and feedback.
  TRIGGER_OR_CONTEXT: High criticality; novel or complex system; public/third-party risk; strong schedule incentives; many
    suppliers; opaque evidence; regulatory mandate.
  NON_TRIGGER_OR_CHEAP_PATH: Low-consequence reversible work can use peer review, rotation, automated checks and occasional
    external review rather than a standing IV&V organisation.
  DEPENDENCIES_OR_PRECONDITIONS: Access to products/data; competence; protected escalation; technical/managerial/financial
    independence proportionate to risk; coordination and feedback channel.
  EXPECTED_ENGINEERING_PAYOFF: Unique defect discovery, reduced confirmation bias, stronger evidence credibility and independent
    information for authorities.
  KNOWN_FAILURE_MODES: 10–30% added cost in older studies; duplicate work; paperwork; late findings; adversarial separation;
    reviewers lack context; nominal independence without authority.
  IMPORTANT_CRITICISMS: Comparative outcome and return-on-cost evidence are mixed; independence can reduce feedback speed
    and may not improve reliability.
  HOW_THE_PROPERTY_EVOLVED: From universal separate organisation to integrity/risk-scaled scopes, embedded-independent roles,
    focused IV&V and continuous independent operational evaluation.
  MATURE_OR_EVOLVED_FORM: Independence is a designed property—responsibility, incentives, funding, reporting and corrective-action
    authority—scaled to consequence and integrated early.
  CEREMONY_VS_PROPERTY: The property is credible independent challenge; a different team name, audit meeting or mandatory
    full duplicate lifecycle is not sufficient.
