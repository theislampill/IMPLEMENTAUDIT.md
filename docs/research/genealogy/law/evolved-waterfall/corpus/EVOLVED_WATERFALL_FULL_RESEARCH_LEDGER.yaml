  - PROPERTY_ID: EW-P032
    PROPERTY_NAME: Risk ownership, residual-risk decision and operational authority
    HISTORICAL_ORIGIN: Safety cases, acquisition decision authority, acceptance/certification, nuclear readiness and ATO/cATO.
    ORIGINAL_FORM: Named programme manager, safety authority, certification authority or operational commander signs risk/acceptance
      decision.
    PROBLEM_IT_ADDRESSED: Evidence cannot eliminate all uncertainty; someone empowered and accountable must decide whether
      remaining risk is tolerable for a specific use/configuration.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: Risk implicitly accepted by developers, responsibility diffused, authority signs without
      evidence, or operation continues outside approved context.
    MECHANISM: Name risk owners and decision authority; state scope/configuration, residual risk, conditions, expiry and monitoring;
      separate evidence production from acceptance where warranted.
    TRIGGER_OR_CONTEXT: Material safety, security, privacy, mission, financial or public risk; operation beyond local team;
      conditional/temporary approval.
    NON_TRIGGER_OR_CHEAP_PATH: Low-consequence reversible changes can operate under pre-authorised risk tolerances with automated
      monitoring.
    DEPENDENCIES_OR_PRECONDITIONS: Authority actually controls operation/resources; current evidence; transparent criteria;
      escalation/stop power; operational monitoring; independence where needed.
    EXPECTED_ENGINEERING_PAYOFF: Clear accountability, explicit residuals, bounded authority and faster action when conditions
      change.
    KNOWN_FAILURE_MODES: Signature shield; authority too remote; risk language vague; ownership without power; permanent temporary
      waivers; risk accepted after de facto deployment.
    IMPORTANT_CRITICISMS: Individual sign-off can centralise power, encourage blame and add latency; no authority can make
