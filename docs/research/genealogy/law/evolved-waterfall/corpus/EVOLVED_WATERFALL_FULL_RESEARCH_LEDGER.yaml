  WATERFALL_CARICATURE_VS_HISTORY:
  - CLAIM: Royce prescribed a single pass with no iteration.
    HISTORY: False. The bare sequence is explicitly diagnosed as risky; Royce adds feedback, pilot development, preliminary
      design, early testing and customer involvement.
    CATEGORY: LATER_TEXTBOOK_CARICATURE
    SOURCES:
    - S003
  - CLAIM: All later Waterfall criticism is therefore a straw man.
    HISTORY: False. Real contracts, milestones, handoffs and review structures created long-latency sequential practice even
      where standards allowed iteration.
    CATEGORY: CRITIQUE_OF_REAL_DEPLOYED_PRACTICE
    SOURCES:
    - S009
    - S016
    - S017
  - CLAIM: Iteration appeared only as a later Agile correction.
    HISTORY: False. Prototypes, simulation, limited releases and iterative/incremental programmes pre-date Royce and Agile.
    CATEGORY: HISTORICAL_SOURCE
    SOURCES:
    - S001
    - S002
    - S015
  - CLAIM: The V-model is one direct Waterfall descendant.
    HISTORY: False as a general claim. Software V/V charts, the systems Vee and German V-Modell are distinct families with
      different purposes and partially separate genealogies.
    CATEGORY: GENEALOGICAL_CORRECTION
    SOURCES:
    - S005
    - S010
    - S011
    - S012
    - S013
  - CLAIM: V-shaped models necessarily defer testing until the right side.
    HISTORY: Misleading. Their useful idea is early pairing of claims with evaluation; mature forms can integrate and evaluate
      incrementally.
    CATEGORY: CRITIQUE_OF_CARICATURE
    SOURCES:
    - S005
    - S012
    - S020
  - CLAIM: Plan-driven engineering requires a fixed phase order.
    HISTORY: False in current lifecycle standards. ISO 15288 and 12207 explicitly allow concurrent, iterative, recursive and
      incremental application and prescribe no lifecycle model.
    CATEGORY: LATER_DESCENDANT
    SOURCES:
    - S018
    - S019
  - CLAIM: Documentation, traceability, baselines and review are either all Waterfall or all bureaucracy.
    HISTORY: False dichotomy. Their underlying properties can be valuable, while fixed document/meeting/manual forms can be
      ceremony.
    CATEGORY: PROPERTY_VS_ARTEFACT
    SOURCES:
    - S006
    - S014
    - S021
    - S041
    - S044
  - CLAIM: High-assurance standards require Waterfall.
    HISTORY: Overgeneralised. RTCA's DO-178C informational paper says no lifecycle method is mandated, but certification objectives
      still require baseline-specific evidence, change impact and traceability.
    CATEGORY: HYBRID_RESOLUTION
    SOURCES:
    - S026
  - CLAIM: Late changes are universally exponentially expensive.
    HISTORY: False. Aerospace-like systems show large but variable escalation; a 171-project software study found no consistent
      substantial global delay effect.
    CATEGORY: REJECTED_GENERALISATION
    SOURCES:
    - S047
    - S048
  - CLAIM: Digital engineering removes documentation and authority problems.
    HISTORY: False. It changes representation; model authority, validation, interoperability, access, staleness and as-deployed
      reconciliation remain.
    CATEGORY: MODERN_CARICATURE
    SOURCES:
    - S038
    - S039
    - S040
  PROPERTIES:
  - PROPERTY_ID: EW-P001
    PROPERTY_NAME: Authoritative, revisable intent and requirements state
    HISTORICAL_ORIGIN: Early large-system specifications; Royce; defence/aerospace requirements management; modern ISO/NASA
      lifecycle processes.
    ORIGINAL_FORM: Approved requirements specifications and controlled revisions, often document-centred.
    PROBLEM_IT_ADDRESSED: Multiple groups need to know what behaviour, constraints and obligations currently govern.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: Conflicting interpretations, invisible requirement drift, implementation against obsolete
      intent, or unowned requirements.
    MECHANISM: Identify the current authoritative requirement state, its version, owners, rationale, assumptions, status and
      approved changes; preserve history without treating the baseline as immutable truth.
    TRIGGER_OR_CONTEXT: Shared or externally committed intent; multiple teams or suppliers; long-lived product; acceptance,
      safety or regulatory obligations; non-local change impact.
    NON_TRIGGER_OR_CHEAP_PATH: For a single team exploring a local reversible feature, a lightweight backlog item, executable
      example and version history may be enough; do not baseline speculative detail merely to appear complete.
    DEPENDENCIES_OR_PRECONDITIONS: Named authority; accessible current representation; change path; stakeholder participation;
      ability to mark uncertainty and supersession; configuration linkage.
    EXPECTED_ENGINEERING_PAYOFF: Fewer version disputes, clearer design/test basis, visible scope change and more reliable
      impact analysis.
    KNOWN_FAILURE_MODES: Baselining wrong or premature requirements; stale authorised documents; shadow requirements in chat
      or tickets; authority so centralised that learning stalls.
    IMPORTANT_CRITICISMS: Requirements cannot be fully known up front; a stable baseline can preserve error and create political
      resistance to change.
    HOW_THE_PROPERTY_EVOLVED: From presumed-complete giant specifications to incremental, revisable, uncertainty-aware requirement
      authority linked to evidence and releases.
    MATURE_OR_EVOLVED_FORM: A living authoritative requirement state that distinguishes proposed, approved, implemented, verified
      and retired obligations and allows risk-proportional change.
    CEREMONY_VS_PROPERTY: The property is authority and state identity; a single giant requirements document, fixed template
      or requirements-complete gate is not required.
    CURRENT_STATUS: RETAINED_IN_EVOLVED_FORM
    EVIDENCE_STRENGTH: B_STRONG_PRIMARY_AND_DOMAIN_SUPPORT
    PRIMARY_SOURCES:
    - S001
    - S003
    - S004
    - S018
    - S019
    - S022
    CRITICAL_SOURCES:
    - S006
    - S007
    - S016
    - S017
    EMPIRICAL_OR_DOMAIN_EVIDENCE: Bell–Thayer and the Ericsson case show requirements defects and version confusion; aerospace
      and regulated regimes retain identified requirement states but permit iteration.
    OPEN_QUESTIONS: How much structure pays off at each scale? When should an exploratory statement acquire authoritative
      status?
    REVERSIBILITY_PROFILE: 'R1–R4: value rises with shared scope, external commitment, coupling and evidence obligations;
      R0 generally needs only lightweight versioned intent.'
    LINEAGE_CLASSIFICATION:
    - DIRECT_LINEAGE
    - RELATED_PLAN_DRIVEN_TRADITION
    - HYBRID
    RELATION_TO_ADAPTIVE_METHODS: HYBRID_RESOLUTION
    QUESTIONS_FOR_REPOSITORY_AUDIT:
    - Is there one discoverable authoritative intent state, or do specifications, tickets and implementation disagree?
    - Does the system distinguish proposed, approved, implemented and retired requirements without freezing discovery?
    POSSIBLE_CONFLICTING_PROPERTY: EW-P002 adaptability; EW-P024 tailoring; excessive stability can conflict with rapid learning.
  - PROPERTY_ID: EW-P002
    PROPERTY_NAME: Explicit requirements uncertainty, assumptions and learning obligations
    HISTORICAL_ORIGIN: NATO-era simulation/prototyping; Bell–Thayer defect evidence; Parnas/Clements; spiral risk management.
    ORIGINAL_FORM: Uncertainty was often hidden inside provisional specifications or handled through informal redesign.
    PROBLEM_IT_ADDRESSED: Teams must distinguish known obligations from hypotheses, assumptions, unresolved choices and environmental
      uncertainty.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: False completeness, premature contractual/design commitment, unplanned rework and validation
      against assumptions nobody remembers.
    MECHANISM: Record uncertainty, confidence, assumptions, decision deadlines, owners and planned evidence-generating activities;
      promote items to baseline only when warranted.
    TRIGGER_OR_CONTEXT: Novel problem, volatile environment, ambiguous user need, uncertain technology, emergent operations
      or weak observability.
    NON_TRIGGER_OR_CHEAP_PATH: Routine replacement with stable, externally specified behaviour can use a short assumption
      list and normal change handling.
    DEPENDENCIES_OR_PRECONDITIONS: Psychological safety to admit uncertainty; decision owners; access to prototypes/users/data;
      expiry and review mechanisms.
    EXPECTED_ENGINEERING_PAYOFF: Better experiment selection, preserved options, less false precision and earlier discovery
      of invalid premises.
    KNOWN_FAILURE_MODES: An uncertainty register that never changes decisions; endless analysis; treating every requirement
      as tentative; unowned assumptions.
    IMPORTANT_CRITICISMS: Can become administrative risk-register theatre or an excuse to avoid commitment.
    HOW_THE_PROPERTY_EVOLVED: From pretending specification completion to making uncertainty an explicit governed engineering
      object tied to evidence and decisions.
    MATURE_OR_EVOLVED_FORM: An assumption/uncertainty ledger integrated with requirements, architecture, hazards and experiments,
      with expiry and promotion/retirement rules.
    CEREMONY_VS_PROPERTY: The property is explicit epistemic status and planned learning; a standing risk meeting or large
      spreadsheet is optional.
    CURRENT_STATUS: CONTEXT_DEPENDENT
    EVIDENCE_STRENGTH: B_STRONG_HISTORICAL_AND_MECHANISTIC_SUPPORT
    PRIMARY_SOURCES:
    - S002
    - S004
    - S006
    - S008
    CRITICAL_SOURCES:
    - S016
    - S050
    EMPIRICAL_OR_DOMAIN_EVIDENCE: Historical and case evidence repeatedly shows requirements continue to change; spiral and
      modern iterative standards operationalise risk-driven learning.
    OPEN_QUESTIONS: Empirical thresholds for the optimal amount of uncertainty bookkeeping remain weak.
    REVERSIBILITY_PROFILE: 'R0–R3: most valuable before hard commitment; should shrink or change form as evidence and external
      obligations accumulate.'
    LINEAGE_CLASSIFICATION:
    - REACTION_TO_WATERFALL
    - HYBRID
    RELATION_TO_ADAPTIVE_METHODS: ADAPTIVE_IMPORT
    QUESTIONS_FOR_REPOSITORY_AUDIT:
    - Are assumptions and unknowns visible as such, or silently encoded as requirements?
    - Does each material uncertainty have a decision owner and an economical path to evidence?
    POSSIBLE_CONFLICTING_PROPERTY: EW-P001 baseline authority; EW-P022 staged commitment; too much tentativeness can undermine
      coordination.
  - PROPERTY_ID: EW-P003
    PROPERTY_NAME: Early architecture and feasibility before hard commitment
    HISTORICAL_ORIGIN: Royce preliminary programme design; SAGE interface discipline; systems Vee and knowledge-based acquisition.
    ORIGINAL_FORM: Preliminary and critical design work before full implementation or production commitment.
    PROBLEM_IT_ADDRESSED: Some cross-cutting constraints—timing, mass, power, safety, data, interfaces, manufacturability—cannot
      be resolved by local implementation alone.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: Committing requirements, suppliers, tooling or production before the system concept
      can satisfy dominant constraints.
    MECHANISM: Perform enough cross-disciplinary architecture, trade study, modelling and interface analysis to falsify high-cost
      assumptions and expose system budgets.
    TRIGGER_OR_CONTEXT: High coupling; hardware/physical constraints; scarce test facilities; safety; long lead items; multiple
      suppliers; expensive migration or platform commitment.
    NON_TRIGGER_OR_CHEAP_PATH: Local, modular, quickly deployable software can use a thin architecture sketch, automated fitness
      functions and evolutionary design.
    DEPENDENCIES_OR_PRECONDITIONS: Representative constraints/data; accountable system architect or integrator; willingness
      to change requirements; prototypes/models validated for the question asked.
