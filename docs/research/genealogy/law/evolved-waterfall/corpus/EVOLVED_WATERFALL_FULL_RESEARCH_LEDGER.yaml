    claim_supported: No consistent, substantial global delayed-issue effect was found; late discovery is not automatically
      exponentially expensive.
    relation: COUNTEREVIDENCE_TO_UNIVERSAL_COST_OF_CHANGE
    contrary_evidence_or_limit: Issue-tracker measures do not capture every physical, certification, contractual or operational
      consequence.
  - id: S049
    author_organisation: Robert G. Cooper
    title: What's Next? After Stage-Gate
    date_version: '2014'
    source_class: PRIMARY_METHOD_EVOLUTION_ARTICLE
    stable_locator: https://media.transformanceadvisors.com/pdfs/After-Stage-Gate.pdf
    exact_locator: Critique of traditional linear/bureaucratic Stage-Gate and next-generation overlapping, adaptive, risk-based
      forms
    claim_supported: Even the Stage-Gate tradition recognised bureaucratic linearity and evolved toward context-specific,
      overlapping, build-test-feedback operation.
    relation: EVOLUTION_UNDER_CRITICISM
    contrary_evidence_or_limit: Written by the method's principal advocate; outcome evidence is not independently established
      by the article.
  - id: S050
    author_organisation: Mark Keil, Joan Mann and Arun Rai
    title: 'Why Software Projects Escalate: An Empirical Analysis and Test of Four Theoretical Models'
    date_version: '2000'
    source_class: PEER_REVIEWED_EMPIRICAL_STUDY
    stable_locator: https://doi.org/10.2307/3250950
    exact_locator: MIS Quarterly 24(4), escalation-model tests
    claim_supported: Sunk cost, project factors and psychological/social dynamics can sustain failing software projects.
    relation: CRITIQUE_OF_GATE_AND_PREDICTIVE_GOVERNANCE
    contrary_evidence_or_limit: Does not show that all formal reviews increase escalation; effective stop authority may reduce
      it.
  - id: S051
    author_organisation: Magne Jørgensen and Martin Shepperd
    title: A Systematic Review of Software Development Cost Estimation Studies
    date_version: '2007'
    source_class: SYSTEMATIC_LITERATURE_REVIEW
    stable_locator: https://doi.org/10.1109/TSE.2007.256943
    exact_locator: Review of 304 estimation papers
    claim_supported: Software-estimation research is fragmented and context-dependent; no single predictive technique warrants
      universal confidence.
    relation: CRITIQUE_OF_FALSE_PREDICTIVE_CERTAINTY
    contrary_evidence_or_limit: Literature through 2004; does not imply that forecasting is useless.
  - id: S052
    author_organisation: Magne Jørgensen
    title: Evidence-Based Guidelines for Assessment of Software Development Cost Uncertainty
    date_version: '2005'
    source_class: PEER_REVIEWED_SYNTHESIS
    stable_locator: https://web-backend.simula.no/sites/default/files/publications/Jorgensen.2005.5.pdf
    exact_locator: Guidelines and empirical basis for overconfidence, outside views, multiple sources and feedback
    claim_supported: Point estimates and narrow intervals are often overconfident; structured uncertainty, independent views
      and feedback improve decision quality.
    relation: EVOLVED_PREDICTIVE_PLANNING
    contrary_evidence_or_limit: Guidelines improve epistemic discipline but do not eliminate political or irreducible uncertainty.
  - id: S053
    author_organisation: U.S. Government Accountability Office
    title: 'GAO Cost Estimating and Assessment Guide: Best Practices for Developing and Managing Program Costs'
    date_version: GAO-20-195G, 2020
    source_class: AUTHORITATIVE_GOVERNMENT_GUIDE
    stable_locator: https://www.gao.gov/products/gao-20-195g
    exact_locator: Risk/sensitivity analysis, assumptions, independent estimate and update-with-actuals practices
    claim_supported: Mature predictive planning uses explicit assumptions, uncertainty, risk, independent challenge and actuals
      rather than treating one baseline estimate as truth.
    relation: EVOLVED_PREDICTIVE_PLANNING
    contrary_evidence_or_limit: Best-practice guidance; compliance with the guide does not assure forecast accuracy.
