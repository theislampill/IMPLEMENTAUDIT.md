      and defect prevention in some settings.
    KNOWN_FAILURE_MODES: Stale or false links; exhaustive matrices no one uses; high creation/maintenance cost; link-count
      compliance; generated links overwhelm users.
    IMPORTANT_CRITICISMS: Laboratory benefits assume correct complete traces; industrial causal evidence and net lifecycle
