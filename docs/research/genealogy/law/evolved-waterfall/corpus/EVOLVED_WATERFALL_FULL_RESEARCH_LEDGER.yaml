  REVERSIBILITY_BANDS:
  - BAND: R0_EXPLORATORY_LOCAL
    DESCRIPTION: Local, low-consequence, no external promise, rapidly observable and trivially discarded.
    DEFAULT_CONTROL: Version history, focused test, peer feedback; no formal baseline/gate/board.
    ESCALATORS: Privacy/security exposure, irreversible external transaction, hidden shared dependency.
    EXAMPLES: Local spike, disposable simulation, feature experiment with isolated data.
  - BAND: R1_SHARED_REVERSIBLE_SOFTWARE
    DESCRIPTION: Shared code/service state with automated rollback but non-trivial coupling.
    DEFAULT_CONTROL: Immutable build/release identity, CI tests, peer/policy approval, telemetry and tested rollback.
    ESCALATORS: Large blast radius, customer/data migration, security boundary, independent consumers.
    EXAMPLES: Service release, shared API, internal platform change.
  - BAND: R2_OPERATIONAL_OR_DATA_COMMITMENT
    DESCRIPTION: Users, operations, persistent data, external interfaces or service continuity make rollback incomplete or
      costly.
    DEFAULT_CONTROL: Impact analysis, staged rollout/canary, readiness, recovery evidence, acceptance/operational authority.
    ESCALATORS: Safety/public impact, legal commitment, long observability latency, cross-organisation dependency.
    EXAMPLES: Production migration, public API change, infrastructure cutover.
  - BAND: R3_EXTERNAL_CONTRACTUAL_REGULATORY_LONG_LEAD
    DESCRIPTION: Supplier contracts, long-lead purchases, certification evidence, fixed interfaces or scarce facilities create
      costly unwind.
    DEFAULT_CONTROL: Authoritative baselines, interface/configuration control, staged commitment, qualification planning,
      independent challenge and formal authority.
    ESCALATORS: Physical irreversibility, major safety consequence, no representative test opportunity.
    EXAMPLES: Custom hardware order, regulated software baseline, multi-supplier integration.
  - BAND: R4_PHYSICAL_SAFETY_CRITICAL_OR_IRREVERSIBLE
    DESCRIPTION: Physical actuation/fabrication, human/environmental safety, nuclear startup, flight, infrastructure or one-way
      consequences.
    DEFAULT_CONTROL: Hazard control, qualification, independent assessment, actual-state readiness, certification/operational
      authority, contingency and through-life evidence.
    ESCALATORS: Unknown hazards, weak observability, single opportunity, catastrophic consequence.
    EXAMPLES: Launch, reactor restart, autonomous safety actuation, permanent construction/cutover.
  REVERSIBILITY_DIMENSIONS:
  - DIMENSION: EDIT_COST
    QUESTION: How costly is the direct change to code, model, document or physical item?
    WARNING: Often the least important cost.
  - DIMENSION: PROPAGATION_COST
    QUESTION: How many dependent interfaces, tests, analyses, suppliers and evidence items must change?
    WARNING: Requires current dependency/trace knowledge.
  - DIMENSION: COMMITMENT_UNWIND_COST
    QUESTION: What contracts, tooling, production, certification, migration or political commitments must be reversed?
    WARNING: Can increase before implementation is 'late'.
  - DIMENSION: FAILURE_AND_RECOVERY_COST
    QUESTION: What harm, outage, loss, recovery effort or irreversible side effect occurs if wrong?
    WARNING: Can be high even when code rollback is easy.
  - DIMENSION: OBSERVABILITY_LATENCY
    QUESTION: How long before correctness or harm is observable?
    WARNING: Fast iteration is unsafe when feedback is delayed or ambiguous.
  - DIMENSION: COUPLING_AND_RADIUS
    QUESTION: How broadly can the change propagate technically and organisationally?
    WARNING: Local edit does not imply local impact.
  - DIMENSION: EXTERNAL_AUTHORITY
    QUESTION: Does a regulator, acquirer, operator or public-risk authority control use?
    WARNING: Legal authority may impose non-negotiable minima.
  - DIMENSION: TEST_OPPORTUNITY_SCARCITY
    QUESTION: Are representative tests rare, destructive or expensive?
    WARNING: Raises value of modelling/qualification but also uncertainty about evidence.
  - DIMENSION: ADVERSARIAL_OR_REMEDIATION_URGENCY
    QUESTION: Does delay itself increase security or operational risk?
    WARNING: Heavy approval can be the unsafe choice.
  DOMAIN_PROFILES:
  - DOMAIN: Rapidly reversible software
    TRIGGER_PATTERN: Usually R0–R1; consequence, persistent data, privacy/security and external API can raise to R2/R3.
    VALUABLE_PROPERTIES: P006, P008, P011, P012, P020, P024, P028, P031, P033.
    CHEAP_PATH: VCS, CI, immutable artefacts, automated tests, canary, telemetry, one-click/tested recovery.
    COUNTEREVIDENCE: No universal late-defect cost; heavy boards and exhaustive traces can reduce feedback and remediation
      speed.
  - DOMAIN: Aerospace/space
    TRIGGER_PATTERN: Long lead, scarce test, flight safety, certification and physical integration often R3–R4.
    VALUABLE_PROPERTIES: P003, P004, P006–P019, P021–P024, P026–P033.
    CHEAP_PATH: Early simulations/prototypes and informal iterative builds before evidence is used for certification credit.
    COUNTEREVIDENCE: DO-178C does not mandate a lifecycle; certification artefacts have flexible packaging; IV&V economics
      are mixed.
  - DOMAIN: Medical devices/quality-system software
    TRIGGER_PATTERN: Patient/product risk and regulatory intended use; not every tool function has equal risk.
    VALUABLE_PROPERTIES: P001, P006, P008, P010–P015, P018, P020, P024, P032, P033.
    CHEAP_PATH: FDA least-burdensome risk-based assurance, unscripted or continuous methods where justified.
    COUNTEREVIDENCE: Testing alone may be insufficient; more paperwork is not automatically more assurance.
  - DOMAIN: Automotive
    TRIGGER_PATTERN: ASIL/hazard classification, fleet/update management, physical actuation and type approval.
    VALUABLE_PROPERTIES: P006–P020, P024, P029, P031–P033.
    CHEAP_PATH: Classify non-safety functions lower, reuse automated evidence and manage updates incrementally.
    COUNTEREVIDENCE: ISO 26262 is functional-safety/domain specific, not a general development process.
  - DOMAIN: Rail
    TRIGGER_PATTERN: Significant technical/operational/organisational change and system safety; independent assessment scaled
      by risk.
    VALUABLE_PROPERTIES: P008, P009, P012, P015–P020, P024, P027, P032, P033.
    CHEAP_PATH: Risk-significance screening and sampled/vertical-slice independent assessment rather than 100% review.
    COUNTEREVIDENCE: Formal documentation alone is insufficient; assessment is expected to address actual implementation.
  - DOMAIN: Nuclear/high-hazard infrastructure
    TRIGGER_PATTERN: Safety significance, licence basis, physical configuration and startup/restart authority, generally R4.
    VALUABLE_PROPERTIES: P006–P021, P024, P027–P033.
    CHEAP_PATH: 10 CFR 50.59 demonstrates evaluated changes can be made without prior NRC approval below defined thresholds.
    COUNTEREVIDENCE: High hazard does not justify universal external pre-approval; readiness/CM paperwork can still diverge
      from plant state.
  - DOMAIN: Large infrastructure/data migration
    TRIGGER_PATTERN: Physical construction or persistent data, multi-supplier interfaces, cutover and long recovery, R2–R4.
    VALUABLE_PROPERTIES: P003, P006–P009, P021–P030, P033.
    CHEAP_PATH: Pilot segments, rehearsals, progressive migration, automated reconciliation and delegated local changes.
    COUNTEREVIDENCE: Digital asset models and gates are not valuable if authority and as-built correspondence are weak.
  INTERNAL_TENSIONS:
  - TENSION: Stability versus adaptability
    SIDE_A_PROPERTY: P001/P006 authoritative baselines
    SIDE_B_PROPERTY: P002/P004/P031 learning and rapid change
    CONTEXT_THAT_FAVOURS_A: External commitments, many independent actors, safety/certification, long lifecycle.
    CONTEXT_THAT_FAVOURS_B: Uncertain need, reversible experiments, rapid observability.
    KNOWN_HYBRID_RESOLUTION: Baseline only decision-relevant state; use incremental baselines and cheap experimental branches.
    UNRESOLVED_RISK: Promotion from experiment to authority may be mistimed.
  - TENSION: Assurance versus delivery latency
    SIDE_A_PROPERTY: P010–P019, P021
    SIDE_B_PROPERTY: P031 continuous delivery
    CONTEXT_THAT_FAVOURS_A: Catastrophic/public consequence, scarce test, external authority.
    CONTEXT_THAT_FAVOURS_B: Fast threat/market/operational feedback and reversible releases.
    KNOWN_HYBRID_RESOLUTION: Automated continuous evidence plus risk-triggered independent/legal decisions.
    UNRESOLVED_RISK: Automation may validate wrong assumptions; authority may remain slower than risk.
  - TENSION: Traceability versus maintenance burden
    SIDE_A_PROPERTY: P017
    SIDE_B_PROPERTY: P024/P031 proportional flow
    CONTEXT_THAT_FAVOURS_A: Certification, complex impact, long life, supplier handoff.
    CONTEXT_THAT_FAVOURS_B: Small rapidly changing system with native executable links.
    KNOWN_HYBRID_RESOLUTION: Trace only decision-critical claims; automate and measure decay.
    UNRESOLVED_RISK: Minimum valuable trace set is not generally known.
  - TENSION: Architecture commitment versus learning
    SIDE_A_PROPERTY: P003/P009
    SIDE_B_PROPERTY: P004/P022
    CONTEXT_THAT_FAVOURS_A: Physical constraints, fixed interfaces, long lead, high coupling.
    CONTEXT_THAT_FAVOURS_B: Novel need, modular/reversible software, uncertain technology.
    KNOWN_HYBRID_RESOLUTION: Minimum sufficient architecture, executable risk tests and delayed irreversible choices.
    UNRESOLVED_RISK: Architecture work can itself create sunk cost and political lock-in.
  - TENSION: Independent challenge versus feedback speed
    SIDE_A_PROPERTY: P016
    SIDE_B_PROPERTY: P031 and integrated teams
    CONTEXT_THAT_FAVOURS_A: Conflicted incentives, public risk, high criticality, opaque evidence.
    CONTEXT_THAT_FAVOURS_B: Low consequence and need for continuous context-rich feedback.
    KNOWN_HYBRID_RESOLUTION: Focused early IV&V, embedded-but-protected reviewers, independent OT&E using shared evidence.
    UNRESOLVED_RISK: Optimal independence dimensions and scope lack modern causal evidence.
  - TENSION: Configuration control versus developer flow
    SIDE_A_PROPERTY: P006/P008
    SIDE_B_PROPERTY: P031
    CONTEXT_THAT_FAVOURS_A: Certified releases, multiple variants/suppliers, difficult rollback.
    CONTEXT_THAT_FAVOURS_B: Local branches, automated tests, high deployment frequency.
    KNOWN_HYBRID_RESOLUTION: Unrestricted exploratory states; controlled promotion to immutable authoritative releases.
    UNRESOLVED_RISK: Promotion boundary may be too early or too late.
  - TENSION: Formal acceptance versus continuous service
    SIDE_A_PROPERTY: P014/P032
    SIDE_B_PROPERTY: P031 continuous deployment
    CONTEXT_THAT_FAVOURS_A: Transfer of custody/liability, contractual delivery, operational authority.
    CONTEXT_THAT_FAVOURS_B: Continuously evolving service with reversible release.
    KNOWN_HYBRID_RESOLUTION: Conditional, incremental, service-level and revocable acceptance over identified releases.
    UNRESOLVED_RISK: Legal/contract language may not support continuous partial acceptance.
  - TENSION: Supplier coordination versus local autonomy
    SIDE_A_PROPERTY: P009/P026
    SIDE_B_PROPERTY: P023/P031 local iteration
    CONTEXT_THAT_FAVOURS_A: Long lead, fixed physical fit, multiple legal organisations, data-right dependence.
    CONTEXT_THAT_FAVOURS_B: Modular teams with automated compatibility and replaceable dependencies.
    KNOWN_HYBRID_RESOLUTION: Govern boundary products/interfaces/evidence, not supplier internal process.
    UNRESOLVED_RISK: Contract incentives can still freeze wrong interfaces.
  - TENSION: Exhaustive planning versus uncertainty
    SIDE_A_PROPERTY: P025/P026
    SIDE_B_PROPERTY: P002/P004
    CONTEXT_THAT_FAVOURS_A: Funding, capacity, procurement and long lead commitments.
    CONTEXT_THAT_FAVOURS_B: Novel work where detailed forecasts lack basis.
    KNOWN_HYBRID_RESOLUTION: Rolling ranges and scenario plans tied to staged commitment and experiments.
    UNRESOLVED_RISK: Targets continue to be mistaken for forecasts.
  - TENSION: Documentation continuity versus documentation debt
    SIDE_A_PROPERTY: P005/P029
    SIDE_B_PROPERTY: P024/P031
    CONTEXT_THAT_FAVOURS_A: Long-lived systems, turnover, safety and maintenance.
    CONTEXT_THAT_FAVOURS_B: Short-lived local software and self-describing executable artefacts.
    KNOWN_HYBRID_RESOLUTION: Capture durable/non-obvious knowledge; automate provenance; delete superseded representations.
    UNRESOLVED_RISK: Future information value is hard to predict.
  - TENSION: Safety stability versus security remediation urgency
    SIDE_A_PROPERTY: P013/P015/P018
    SIDE_B_PROPERTY: P008/P031 rapid patching
    CONTEXT_THAT_FAVOURS_A: Change may invalidate qualification or create physical hazard.
    CONTEXT_THAT_FAVOURS_B: Known exploitable vulnerability where delay raises harm.
    KNOWN_HYBRID_RESOLUTION: Pre-authorised emergency change classes, bounded patch evidence, monitoring and rapid post-change
      requalification.
    UNRESOLVED_RISK: No universal balance; adversarial timing can defeat normal approval.
  - TENSION: Single authority versus federated truth
    SIDE_A_PROPERTY: P006/P030/P032
    SIDE_B_PROPERTY: Local domain ownership and tool autonomy
    CONTEXT_THAT_FAVOURS_A: Need for final configuration/operational decision and legal accountability.
    CONTEXT_THAT_FAVOURS_B: Many disciplines with specialised models and rapid local change.
    KNOWN_HYBRID_RESOLUTION: Federated authoritative sources with scoped ownership, shared identifiers and explicit reconciliation.
    UNRESOLVED_RISK: Federated disagreement and semantic mismatch can remain invisible.
