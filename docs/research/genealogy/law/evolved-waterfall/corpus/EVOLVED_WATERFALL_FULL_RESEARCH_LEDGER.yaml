    SOURCES:
    - S002
  - DATE: '1970'
    EVENT: Royce presents the staged sequence, calls the unmodified version risky, and adds preliminary design, a pilot, early
      test planning, documentation and customer control.
    CLASSIFICATION: DIRECT_LINEAGE
    SOURCES:
    - S003
  - DATE: '1976'
    EVENT: Bell and Thayer attach 'waterfall' terminology to Royce's sequence while documenting continuing requirements problems.
    CLASSIFICATION: DIRECT_LINEAGE_NAMING_HINGE
    SOURCES:
    - S004
  - DATE: '1979'
    EVENT: Boehm's software V-chart pairs requirements/design baselines with verification and validation activities and includes
      iterative problem feedback.
    CLASSIFICATION: SOFTWARE_V_FAMILY
    SOURCES:
    - S005
  - DATE: '1986'
    EVENT: Parnas and Clements reject a perfectly rational top-down chronology but defend coherent current design records;
      Rook publishes an influential software V-model; Germany's V-Modell lineage begins separately.
