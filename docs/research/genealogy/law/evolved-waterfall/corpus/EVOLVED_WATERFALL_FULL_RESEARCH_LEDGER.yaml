    REVERSIBILITY_PROFILE: Disproportionate in R0–R1; selective value rises R2–R4.
    LINEAGE_CLASSIFICATION:
    - REAL_DEPLOYED_PRACTICE
    - CEREMONIAL_COMPLIANCE
    RELATION_TO_ADAPTIVE_METHODS: REPLACED
    QUESTIONS_FOR_REPOSITORY_AUDIT:
    - Are trace and approval obligations selected by a concrete decision/failure mode, or applied uniformly?
    - Could automation and delegated policy preserve authority with less latency?
    POSSIBLE_CONFLICTING_PROPERTY: Conflicts with EW-P008, EW-P017, EW-P024 and EW-P031.
  - PROPERTY_ID: EW-P038
    PROPERTY_NAME: Universal exponential late-change cost rule
    HISTORICAL_ORIGIN: Popularised lifecycle cost-of-change curves and retrospective defect-cost claims.
    ORIGINAL_FORM: Assume every change or defect becomes exponentially more expensive with each later phase, justifying maximal
      up-front control.
    PROBLEM_IT_ADDRESSED: Attempted to motivate early defect prevention and planning.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: Misallocates control, discourages cheap late improvement, confuses code edit with propagation,
      commitment-unwind and failure/recovery cost.
    MECHANISM: Use calendar lateness or phase as a universal proxy for change cost.
    TRIGGER_OR_CONTEXT: None; context-specific commitment and consequence evidence must be measured instead.
    NON_TRIGGER_OR_CHEAP_PATH: Assess edit, propagation, commitment-unwind and failure/recovery cost separately.
    DEPENDENCIES_OR_PRECONDITIONS: A universal law would require stable cross-domain cost definitions and effects, which evidence
      does not supply.
    EXPECTED_ENGINEERING_PAYOFF: The warning is directionally useful in some hardware/certification contexts, but the universal
      curve is false.
    KNOWN_FAILURE_MODES: BDUF, sunk-cost protection, avoidance of beneficial change, inflated process burden.
    IMPORTANT_CRITICISMS: Aerospace-like studies show large but wildly variable escalation; 171 software projects found no
      consistent substantial delayed-issue effect.
    HOW_THE_PROPERTY_EVOLVED: Replaced by EW-P033's multidimensional reversibility/commitment profile.
    MATURE_OR_EVOLVED_FORM: No universal curve; use domain-specific evidence and tested recovery.
    CEREMONY_VS_PROPERTY: Citing a generic cost curve is not engineering evidence for a control.
    CURRENT_STATUS: REJECTED_OR_DISFAVOURED
    EVIDENCE_STRENGTH: A_STRONG_DIRECT_COUNTEREVIDENCE_TO_UNIVERSALITY
    PRIMARY_SOURCES:
    - S047
    - S048
    CRITICAL_SOURCES:
    - S048
    EMPIRICAL_OR_DOMAIN_EVIDENCE: Haskins et al. support escalation in aerospace-like systems with multipliers varying from
      29 to over 1,500 by method; Menzies et al. reject a global software effect.
    OPEN_QUESTIONS: Domain-specific thresholds remain open and are retained under EW-P033.
    REVERSIBILITY_PROFILE: Replaced by R0–R4 profiles; calendar phase alone is not a trigger.
    LINEAGE_CLASSIFICATION:
    - LATER_SIMPLIFICATION
    - PREDICTIVE_ESTIMATION
    RELATION_TO_ADAPTIVE_METHODS: REJECTED
    QUESTIONS_FOR_REPOSITORY_AUDIT:
    - Is a control justified by measured commitment/consequence, or by an uncited generic late-change curve?
    - Are edit, propagation, unwind and failure/recovery costs distinguished?
    POSSIBLE_CONFLICTING_PROPERTY: Conflicts with EW-P033 and EW-P024.
  CEREMONY_STRIPPING_LEDGER:
  - PRACTICE_OR_ARTEFACT: Giant requirements specification
    UNDERLYING_PROPERTY: EW-P001 authoritative revisable intent
    WHAT_IT_BUYS: A shared basis for design, contract and verification.
    WHEN_IT_FAILS: Volume hides uncertainty; stale document outranks reality; readers cannot find governing detail.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Structured requirements data, executable examples, models, versioned decisions, smaller specifications.
    MODERN_DISPOSITION: Retain authority and versioning; reject document size as evidence.
  - PRACTICE_OR_ARTEFACT: Requirements-complete gate
    UNDERLYING_PROPERTY: EW-P001 plus EW-P002
    WHAT_IT_BUYS: A declared scope boundary.
    WHEN_IT_FAILS: Unknowns are relabelled as settled and later learning becomes non-compliance.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: NO_GENERAL_PROPERTY
    ALTERNATIVE_IMPLEMENTATIONS: Baseline stable obligations; mark hypotheses and next evidence explicitly.
    MODERN_DISPOSITION: REJECTED_OR_DISFAVOURED.
  - PRACTICE_OR_ARTEFACT: Preliminary/Critical Design Review meeting
    UNDERLYING_PROPERTY: EW-P003 and EW-P021
    WHAT_IT_BUYS: Cross-disciplinary challenge before commitment.
    WHEN_IT_FAILS: Slideware and document maturity substitute for tested constraints; decision is already made.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Asynchronous model/code/evidence review, focused review panel, automated constraint evidence.
    MODERN_DISPOSITION: Use only around a real expensive commitment.
  - PRACTICE_OR_ARTEFACT: Fixed phase gate
    UNDERLYING_PROPERTY: EW-P021 evidence-backed commitment decision
    WHAT_IT_BUYS: Potential stop/redirect point.
    WHEN_IT_FAILS: Calendar, sunk cost and political commitments predetermine passage.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Event-driven knowledge point; automated policy gate; incremental funding decision.
    MODERN_DISPOSITION: Replace phase completion with commitment-specific evidence.
  - PRACTICE_OR_ARTEFACT: Traceability matrix spreadsheet
    UNDERLYING_PROPERTY: EW-P017 demonstrable relations
    WHAT_IT_BUYS: Coverage and impact visibility.
    WHEN_IT_FAILS: Links decay, are copied for compliance, or are never used in a decision.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Linked identifiers, graph queries, executable specifications, code/test/issue relations,
      generated evidence.
    MODERN_DISPOSITION: Selective, automated and quality-checked.
  - PRACTICE_OR_ARTEFACT: Standing Change-Control Board
    UNDERLYING_PROPERTY: EW-P008 authorised impact evaluation
    WHAT_IT_BUYS: Shared consequence review and authority.
    WHEN_IT_FAILS: Every harmless change queues centrally; board rubber-stamps stale impact analyses.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: CONTEXT_DEPENDENT
    ALTERNATIVE_IMPLEMENTATIONS: Delegated thresholds, policy as code, peer approval, emergency path, post-change audit.
    MODERN_DISPOSITION: Reserve synchronous board action for cross-authority/high-consequence change.
  - PRACTICE_OR_ARTEFACT: Static configuration baseline document
    UNDERLYING_PROPERTY: EW-P006 configuration identity
    WHAT_IT_BUYS: Known approved state.
    WHEN_IT_FAILS: Document is controlled while source, build or deployed system drifts.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Immutable version tags, signed artefacts, reproducible builds, deployment manifests, model
      baselines.
    MODERN_DISPOSITION: Baseline actual configurations and status, not paper alone.
  - PRACTICE_OR_ARTEFACT: Interface Control Document
    UNDERLYING_PROPERTY: EW-P009 owned testable interface
    WHAT_IT_BUYS: Agreement across independently controlled boundaries.
    WHEN_IT_FAILS: Syntax is documented but semantics/units/timing are not tested; document goes stale.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Versioned schema/API, contract test, shared model, physical drawing, compatibility policy.
    MODERN_DISPOSITION: Use form appropriate to boundary and consequence.
  - PRACTICE_OR_ARTEFACT: Interface Control Working Group/Board
    UNDERLYING_PROPERTY: EW-P009 shared interface authority
    WHAT_IT_BUYS: Cross-party change negotiation.
    WHEN_IT_FAILS: Unanimity blocks evolution or participants lack technical ownership.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: ONLY_WHERE_SHARED_AUTHORITY_REQUIRES_IT
    ALTERNATIVE_IMPLEMENTATIONS: Named bilateral owners, automated compatibility rules, delegated semantic-version policy.
    MODERN_DISPOSITION: Escalate only consequential cross-authority changes.
  - PRACTICE_OR_ARTEFACT: Monolithic final test phase
    UNDERLYING_PROPERTY: EW-P010–EW-P012 evaluation
    WHAT_IT_BUYS: Integrated evidence.
    WHEN_IT_FAILS: Evidence arrives after options and schedule are exhausted.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Continuous lower-level verification, repeated integration, staged high-fidelity and operational
      evaluation.
    MODERN_DISPOSITION: REJECTED as sole evaluation strategy.
  - PRACTICE_OR_ARTEFACT: Independent V&V organisation
    UNDERLYING_PROPERTY: EW-P016 independent challenge
    WHAT_IT_BUYS: Separation of incentives and a second technical view.
    WHEN_IT_FAILS: Duplicate work, slow feedback, weak context, nominal independence or no corrective authority.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: HIGH_CONSEQUENCE_OR_REGULATORY_CONTEXT
    ALTERNATIVE_IMPLEMENTATIONS: Focused IV&V, independent assessor, rotating reviewer, external lab, independent OT&E.
    MODERN_DISPOSITION: Scale dimensions and scope of independence to risk.
  - PRACTICE_OR_ARTEFACT: Safety-case report / GSN diagram
    UNDERLYING_PROPERTY: EW-P019 challengeable assurance argument
    WHAT_IT_BUYS: Visible relationship between claims and evidence.
    WHEN_IT_FAILS: Persuasive static dossier, after-the-fact rationalisation, graphical complexity and stale evidence.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: NO_GENERAL_FORM
    ALTERNATIVE_IMPLEMENTATIONS: Living claim/evidence graph, concise argument, risk register plus explicit justification.
    MODERN_DISPOSITION: Use only where argument changes assurance decisions.
  - PRACTICE_OR_ARTEFACT: Formal evidence package
    UNDERLYING_PROPERTY: EW-P006, EW-P010–EW-P015 evidence provenance
    WHAT_IT_BUYS: Reproducible basis for acceptance/certification.
    WHEN_IT_FAILS: Assembled retrospectively, detached from exact configuration, duplicated across authorities.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: THE_EVIDENCE_MAY_BE; PACKAGING_NEED_NOT_BE
    ALTERNATIVE_IMPLEMENTATIONS: Continuously accumulated configuration-linked evidence and authority-specific views.
    MODERN_DISPOSITION: Automate provenance and reuse; preserve legal packaging where mandated.
  - PRACTICE_OR_ARTEFACT: Pilot project / MVP phase
    UNDERLYING_PROPERTY: EW-P004 executable risk retirement
    WHAT_IT_BUYS: Evidence before full commitment.
    WHEN_IT_FAILS: Demo does not test decisive risk, becomes production accidentally or cannot affect plan.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Simulation, spike, test article, thin increment, shadow operation, hardware-in-loop.
    MODERN_DISPOSITION: Choose experiment by hypothesis, not label.
  - PRACTICE_OR_ARTEFACT: Qualification campaign
    UNDERLYING_PROPERTY: EW-P013 envelope/margin evidence
    WHAT_IT_BUYS: Design-type confidence across required conditions.
    WHEN_IT_FAILS: Unrepresentative article, invalidated by change, nominal pass treated as all-purpose validation.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: DOMAIN_SPECIFIC
    ALTERNATIVE_IMPLEMENTATIONS: Analysis, similarity, incremental/component qualification, validated simulation.
    MODERN_DISPOSITION: Retain where an envelope/type claim exists.
  - PRACTICE_OR_ARTEFACT: Acceptance certificate/signature
    UNDERLYING_PROPERTY: EW-P014 acceptance authority
    WHAT_IT_BUYS: Transfer of responsibility over an identified item.
    WHEN_IT_FAILS: Signer cannot identify configuration, exceptions or operational evidence.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: LEGAL_OR_CONTRACT_SPECIFIC
    ALTERNATIVE_IMPLEMENTATIONS: Signed digital decision, automated promotion plus recorded authority, conditional acceptance
      record.
    MODERN_DISPOSITION: Retain decision provenance, not paper symbolism.
  - PRACTICE_OR_ARTEFACT: Operational Readiness Review meeting
    UNDERLYING_PROPERTY: EW-P027 actual readiness
    WHAT_IT_BUYS: Cross-functional go/no-go before operation.
    WHEN_IT_FAILS: Checklist/slide review after irreversible cutover; actual data, people or support not examined.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: NO_GENERAL_FORM
    ALTERNATIVE_IMPLEMENTATIONS: Automated readiness checks, rehearsal, canary, incident exercise, focused authority review.
    MODERN_DISPOSITION: Use strength proportional to cutover consequence and recovery.
  - PRACTICE_OR_ARTEFACT: Contingency/rollback plan document
    UNDERLYING_PROPERTY: EW-P028 demonstrated recovery
    WHAT_IT_BUYS: Prepared response.
    WHEN_IT_FAILS: Never exercised; backup shares failure; rollback ignores data/physical side effects.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Automated rollback, recovery test, chaos exercise, alternate operation, rehearsed runbook.
    MODERN_DISPOSITION: Evidence of recovery matters more than prose.
  - PRACTICE_OR_ARTEFACT: MBSE platform / 'single source of truth'
    UNDERLYING_PROPERTY: EW-P030 governed authoritative engineering data
    WHAT_IT_BUYS: Consistency, analysis and reduced handoffs.
    WHEN_IT_FAILS: Authority is ambiguous; tools do not interoperate; model is stale or unvalidated; vendor lock-in.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Federated authoritative sources, source/tests/schemas, lightweight models, data contracts.
    MODERN_DISPOSITION: Adopt only for measurable decisions and govern model-to-reality correspondence.
  - PRACTICE_OR_ARTEFACT: Continuous-compliance dashboard
    UNDERLYING_PROPERTY: EW-P031 fresh evidence and EW-P032 authority
    WHAT_IT_BUYS: Low-latency status and evidence reuse.
    WHEN_IT_FAILS: Green metrics cover weak controls, stale scope or compromised pipeline; no one owns residual risk.
    WHETHER_THE_ARTEFACT_IS_REQUIRED: 'NO'
    ALTERNATIVE_IMPLEMENTATIONS: Signed evidence store, risk-specific alerts, sampled independent evaluation, release attestations.
    MODERN_DISPOSITION: Treat as evidence interface, never as automatic assurance truth.
