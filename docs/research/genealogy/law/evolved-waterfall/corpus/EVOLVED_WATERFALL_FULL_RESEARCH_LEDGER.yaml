  - PROPERTY_ID: EW-P033
    PROPERTY_NAME: Reversibility- and commitment-sensitive control strength
    HISTORICAL_ORIGIN: Royce late-integration argument; spiral risk; graded nuclear/rail/medical assurance; modern continuous
      delivery and recovery practice.
    ORIGINAL_FORM: Increase formality by project phase, size or prescribed safety class, often using a presumed rising cost-of-change
      curve.
    PROBLEM_IT_ADDRESSED: 'Neither universal heavy control nor universal rapid change is rational: the value of evidence and
      authority depends on what can be undone and what harm can occur.'
    FAILURE_MODE_IT_TRIES_TO_PREVENT: Over-control cheap experiments; under-control irreversible/public changes; confuse edit
      cost with propagation, commitment-unwind or failure/recovery cost.
    MECHANISM: Classify a decision/change by consequence, reversibility/recovery, coupling, observability latency, external
      commitment, test scarcity and adversarial urgency; select the least burdensome control that closes the failure mode.
    TRIGGER_OR_CONTEXT: This is a meta-property applied whenever choosing baseline, trace, review, independence, qualification
      or authorisation strength.
    NON_TRIGGER_OR_CHEAP_PATH: Default pre-authorised path for local, low-consequence, rapidly observable and genuinely reversible
      work.
    DEPENDENCIES_OR_PRECONDITIONS: Operational definition of reversibility; tested recovery; impact visibility; clear thresholds;
      feedback on false positives/negatives; legal minima.
    EXPECTED_ENGINEERING_PAYOFF: Controls concentrate where mistakes are costly while preserving learning and flow elsewhere.
    KNOWN_FAILURE_MODES: Risk scoring theatre; reversibility claimed without data/side-effect analysis; consequence ignored
      because rollback is easy; all high-risk work receives every control; thresholds manipulated.
    IMPORTANT_CRITICISMS: Evidence does not support one universal monotonic formula; irreversible systems can still be harmed
      by bureaucracy, and reversible software can create irreversible disclosure or transaction effects.
    HOW_THE_PROPERTY_EVOLVED: From calendar-phase severity and universal late-change curves to multidimensional commitment/risk
      profiles and dynamic evidence.
    MATURE_OR_EVOLVED_FORM: 'A falsifiable control-selection policy: identify the failure mode, trigger dimensions, cheap
      path, required evidence and residual risk; re-evaluate after operational feedback.'
    CEREMONY_VS_PROPERTY: The property is proportional selection tied to a real failure mode; a risk matrix, phase label or
      'high assurance' designation is not sufficient.
