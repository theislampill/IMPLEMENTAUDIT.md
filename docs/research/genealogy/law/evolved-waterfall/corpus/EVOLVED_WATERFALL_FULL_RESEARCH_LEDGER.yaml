EVOLVED_WATERFALL:
  RESEARCH_STATE: FROZEN
  ACCESS_DATE: '2026-08-11'
  PROPERTY_POPULATION_TOTAL: 38
  PROPERTY_POPULATION_EXAMINED: 38
  PROPERTY_COVERAGE: 38/38
  SYNTHESIS: A risk- and commitment-sensitive assurance architecture, not a fixed lifecycle sequence. It preserves authoritative
    but revisable intent and configuration, executable risk retirement, multi-level verification and intended-use validation,
    interface and change visibility, acceptance/qualification/certification distinctions, and evidence-backed authority. It
    applies those properties iteratively, incrementally, concurrently and recursively, and scales control to consequence,
    actual recoverability, coupling, observability latency, external commitment and test scarcity. Traditional documents,
    boards, matrices and fixed phases are optional mechanisms, not general properties.
  REVERSIBILITY_VERDICT:
    STATUS: QUALIFIED_CONTEXTUAL_RULE_NOT_UNIVERSAL_LAW
    FINDING: Control strength should normally rise only when the expected value of added evidence or authority exceeds its
      latency and maintenance cost. Irreversibility is one dimension, not the whole rule. Consequence, coupling, observability,
      external authority, recovery, test scarcity and adversarial urgency also matter.
    COST_COMPONENTS:
    - EDIT_COST
    - PROPAGATION_COST
    - COMMITMENT_UNWIND_COST
    - FAILURE_AND_RECOVERY_COST
    COUNTEREVIDENCE: A multi-project software study did not find a consistent universal delayed-issue cost effect; heavy controls
      can increase sunk cost, slow feedback and delay remediation.
  BURDEN_CLOSURE:
  - BURDEN: Exact textbook/transmission history of the Waterfall caricature
    DISPOSITION: CLOSED_TO_DECISION_RELEVANT_LIMIT
    FINDING: Bell and Thayer (1976) are the located primary naming hinge; later pedagogical diagrams often foregrounded distinct
      stages, while some textbooks simultaneously acknowledged iteration. No single author-to-textbook causal chain is proven.
      Real procurement, approval and organisational structures materially reinforced the caricature.
    EVIDENCE_LIMIT: A complete bibliometric transmission genealogy was not established and is not required to distinguish
      Royce, pedagogical simplification and deployed sequentiality.
    SOURCES:
    - S003
    - S004
    - S015
    - S017
  - BURDEN: Multiple V-model/Vee genealogies
    DISPOSITION: CLOSED
    FINDING: 'At least three decision-relevant families must be separated: the software V/V-chart linking definition products
      to evaluation (Boehm 1979; Rook 1986), the systems-engineering Vee (Forsberg–Mooz 1991, explicitly incremental/evolutionary
      by 1995), and Germany''s V-Modell/V-Modell XT governance framework. Shared geometry does not prove shared ancestry or
      mechanism.'
    EVIDENCE_LIMIT: Earlier diagrammatic antecedents may exist, but they do not change the required three-family distinction.
    SOURCES:
    - S005
    - S010
    - S011
    - S012
    - S013
  - BURDEN: Systems-engineering evolution beyond fixed phase order
    DISPOSITION: CLOSED
    FINDING: Current ISO 15288/12207 and NASA guidance treat lifecycle processes as outcomes and responsibilities applied
      iteratively, concurrently, recursively and incrementally, with tailoring and no universal phase sequence.
    EVIDENCE_LIMIT: Normative modernisation does not guarantee non-bureaucratic implementation.
    SOURCES:
    - S018
    - S019
    - S022
    - S037
  - BURDEN: Configuration-management history and empirical engineering value
    DISPOSITION: CLOSED_WITH_EVIDENCE_LIMIT
    FINDING: The surviving property is configuration identity, integrity, status and change provenance across requirements,
      models, builds, releases and deployed assets—not freezing or a standing board. Strong domain/failure rationale exists;
      broad controlled causal return evidence is sparse.
    EVIDENCE_LIMIT: Mostly standards, mishap/audit evidence and qualitative cases; no universal ROI threshold.
    SOURCES:
    - S021
    - S023
    - S026
    - S059
  - BURDEN: Interface-control history and empirical engineering value
    DISPOSITION: CLOSED_WITH_CONTEXT_LIMIT
    FINDING: Owned, testable contracts are strongly justified at cross-team, supplier, physical and independently released
      boundaries. Formal ICD/board machinery is not justified for every local interface.
    EVIDENCE_LIMIT: Direct counterfactual causal studies are limited; support is mechanistic, domain and mishap based.
    SOURCES:
    - S001
    - S024
    - S025
  - BURDEN: Traceability cost/benefit and stale-traceability failure
    DISPOSITION: CLOSED_MIXED
    FINDING: Controlled experiments show task speed/correctness gains under good traces; observational evidence links completeness
      with fewer defects; reviews identify link creation/maintenance as the main cost and call for stronger industrial evidence.
      Selective, queryable, maintained trace is retained; exhaustive manual matrices are not.
    EVIDENCE_LIMIT: No validated general net-benefit threshold; ideal-trace experiments overstate real-world conditions.
    SOURCES:
    - S041
    - S042
    - S043
    - S044
  - BURDEN: Independent V&V outcomes and independence conditions
    DISPOSITION: CLOSED_MIXED
    FINDING: Independence can find unique defects and counter incentive bias, but comparative outcome/economic evidence is
      mixed and older. Scope should rise with criticality; technical, managerial and financial independence trade against
      access and feedback speed.
    EVIDENCE_LIMIT: Modern causal comparisons and calibrated scope thresholds remain sparse.
    SOURCES:
    - S020
    - S045
    - S046
    - S062
  - BURDEN: Qualification, validation, acceptance and certification across domains
    DISPOSITION: CLOSED_WITH_TERMINOLOGY_FIREWALL
    FINDING: Verification addresses specified requirements; validation intended use; qualification a design/type/process envelope;
      acceptance an authorised decision over a delivered identified item; certification an empowered external attestation
      against a governing basis. Domain terminology varies, so the applicable regime controls.
    EVIDENCE_LIMIT: No single dictionary overrides domain-specific legal definitions.
    SOURCES:
    - S005
    - S022
    - S026
    - S027
    - S028
    - S029
    - S030
    - S031
  - BURDEN: Safety/assurance-case lineage
    DISPOSITION: CLOSED_MIXED
    FINDING: Goal-setting safety regimes shifted responsibility toward a structured through-life argument and evidence. Current
      guidance explicitly rejects equating the safety case with its report and records confirmation, staleness, compliance-only
      and after-the-fact pathologies.
    EVIDENCE_LIMIT: Strong practice rationale, weak comparative outcome evidence.
    SOURCES:
    - S033
  - BURDEN: Phase-gate and milestone gaming
    DISPOSITION: CLOSED
    FINDING: The surviving property is a real evidence-backed commitment decision with stop/redirect authority. Fixed calendar
      gates and document-completion meetings are ceremony; escalation-of-commitment and acquisition evidence show why formal
      milestones may fail.
    EVIDENCE_LIMIT: Gate effectiveness depends on actual decision power and evidence quality; no universal meeting form.
    SOURCES:
    - S017
    - S037
    - S049
    - S050
    - S060
  - BURDEN: Predictive estimation, sunk cost and false certainty
    DISPOSITION: CLOSED_MIXED
    FINDING: Forecasting remains useful for funding, suppliers and capacity, but mature practice uses ranges, assumptions,
      outside views, independent estimates and updates from actuals. Point-plan certainty and baseline protection are rejected.
    EVIDENCE_LIMIT: No universally dominant estimation method; behavioural and political distortions remain.
    SOURCES:
    - S050
    - S051
    - S052
    - S053
  - BURDEN: Digital engineering/model-authority failure modes
    DISPOSITION: CLOSED_MIXED
    FINDING: Digital models can reduce handoff and enable analysis, but authority ambiguity, interoperability, semantics,
      access, model validation, staleness and divergence from physical/deployed state are first-order risks. Tool adoption
      is not a property.
    EVIDENCE_LIMIT: Many benefits are perceived or expected; measured comparisons remain sparse.
    SOURCES:
    - S038
    - S039
    - S040
  - BURDEN: DevSecOps and continuous-assurance hybrids
    DISPOSITION: CLOSED
    FINDING: Current defence/aerospace practice permits iterative delivery while retaining immutable baselines, traceable
      evidence, independent evaluation and explicit operational authority. Continuous evidence changes cadence and packaging,
      not the need to know what was tested and who accepts risk.
    EVIDENCE_LIMIT: Automation can reproduce weak tests and compromised evidence continuously.
    SOURCES:
    - S026
    - S034
    - S035
    - S036
    - S054
    - S055
  - BURDEN: Reversibility/commitment thresholds across domains
    DISPOSITION: SEARCHED_GENERAL_THRESHOLD_UNRESOLVED
    FINDING: Cross-domain evidence supports graded controls by consequence, safety significance, coupling, external commitment,
      observability and recovery—not calendar lateness alone. No validated universal threshold function exists. Technical
      rollback can coexist with irreversible harm; heavy controls can themselves increase latency and sunk cost.
    EVIDENCE_LIMIT: Domain-specific calibration remains necessary.
    SOURCES:
    - S027
    - S028
    - S030
    - S031
    - S032
    - S047
    - S048
  TIMELINE:
  - DATE: 1956 / 1983 publication
    EVENT: Benington's SAGE account combines staged production, interface discipline, independent testing and records; the
      1983 foreword reports an experimental prototype and criticises specification before detailed knowledge.
