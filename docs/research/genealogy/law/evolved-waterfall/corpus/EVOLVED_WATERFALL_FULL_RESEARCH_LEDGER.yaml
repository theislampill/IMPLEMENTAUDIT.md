  OPEN_QUESTIONS:
  - ID: OQ-01
    QUESTION: What quantitative, domain-portable control-escalation function could combine consequence, reversibility, coupling,
      observability, external authority and recovery?
    DISPOSITION: UNRESOLVED; evidence supports dimensions, not a universal formula.
    RELATED:
    - P024
    - P033
  - ID: OQ-02
    QUESTION: What is the minimum trace set that yields positive net value in real industrial settings, including maintenance
      and decay cost?
    DISPOSITION: UNRESOLVED; controlled task benefits and observational quality associations exist, but general ROI thresholds
      do not.
    RELATED:
    - P017
  - ID: OQ-03
    QUESTION: Which technical, managerial and financial independence profiles produce net IV&V benefit in modern continuous
      delivery?
    DISPOSITION: UNRESOLVED; older evidence is mixed and context-sensitive.
    RELATED:
    - P016
    - P031
  - ID: OQ-04
    QUESTION: Do living assurance cases improve safety outcomes beyond good hazard/evidence management, or mainly improve
      communication/auditability?
    DISPOSITION: UNRESOLVED; practice rationale strong, comparative outcome evidence weak.
    RELATED:
    - P019
  - ID: OQ-05
    QUESTION: Which MBSE/digital-engineering benefits survive controlled comparison after tool, training and model-maintenance
      cost?
    DISPOSITION: UNRESOLVED; many claims are perceived or expected.
    RELATED:
    - P030
  - ID: OQ-06
    QUESTION: How should formal certification credit be reused across frequent incremental changes without unsafe evidence
      inheritance?
    DISPOSITION: DOMAIN-SPECIFIC OPEN ENGINEERING QUESTION.
    RELATED:
    - P013
    - P015
    - P031
  - ID: OQ-07
    QUESTION: How can organisations detect that a baseline or gate has become sunk-cost protection rather than decision support?
    DISPOSITION: PARTIALLY ANSWERED by real stop authority, independent challenge and actual-state evidence; no robust universal
      indicator.
    RELATED:
    - P021
    - P025
  - ID: OQ-08
    QUESTION: How should hidden organisational, data and semantic interfaces be discovered before integration failure?
    DISPOSITION: OPEN; formal ICDs cover known boundaries better than emergent socio-technical coupling.
    RELATED:
    - P009
    - P030
  - ID: OQ-09
    QUESTION: When does architecture effort preserve options, and when does it itself create irreversibility?
    DISPOSITION: CONTEXTUAL AND EMPIRICALLY UNDER-SPECIFIED.
    RELATED:
    - P003
    - P004
    - P022
  - ID: OQ-10
    QUESTION: How should readiness and acceptance be represented for continuously changing services with no singular handover?
    DISPOSITION: PARTIALLY RESOLVED by incremental/revocable authority; legal and contractual practice varies.
    RELATED:
