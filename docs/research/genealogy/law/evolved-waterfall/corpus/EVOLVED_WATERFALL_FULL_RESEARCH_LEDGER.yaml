    ORIGINAL_FORM: Detailed up-front work breakdown, deterministic schedule/cost baseline and variance control.
    PROBLEM_IT_ADDRESSED: Funding, suppliers and coordination require forecasts, but uncertain development cannot be represented
      honestly by one precise plan.
    FAILURE_MODE_IT_TRIES_TO_PREVENT: False certainty, narrow intervals, political estimates, local optimism, plan treated
      as contract with reality, and continued funding because baseline sunk cost is large.
    MECHANISM: Use ranges, assumptions, scenarios, base rates/reference classes, independent estimates and rolling updates
      from actual performance; separate target, forecast and commitment.
    TRIGGER_OR_CONTEXT: Budget or contract decision; long lead; portfolio trade-off; external dependency; irreversible investment;
      capacity planning.
    NON_TRIGGER_OR_CHEAP_PATH: Small reversible work can use short-horizon forecasts and throughput history; avoid elaborate
      earned-value machinery.
    DEPENDENCIES_OR_PRECONDITIONS: Comparable data; transparent assumptions; incentives to report bad news; update cadence;
      distinction between estimate and target; independent challenge.
    EXPECTED_ENGINEERING_PAYOFF: More honest decisions, visible uncertainty, earlier replan and less surprise from deterministic
      commitments.
    KNOWN_FAILURE_MODES: Pseudo-precision; reference class chosen strategically; ranges ignored; baseline used to punish learning;
      constant replanning hides lack of progress.
    IMPORTANT_CRITICISMS: Estimation evidence is fragmented; outside views do not remove novelty or strategic behaviour; planning
      overhead may exceed value.
